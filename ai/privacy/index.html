<div class="eyebrow">PRIVACY</div>
<h1 data-ko="QueryBot AI 개인정보처리방침" data-en="QueryBot AI Privacy Policy"></h1>
<p data-ko="최종 업데이트: 2026년 11월 14일 · 대상: querybot.kr/ai (QueryBot AI 채팅)" data-en="Last updated: November 14, 2026 · Applies to querybot.kr/ai (QueryBot AI chat)"></p>

<h2 data-ko="1. 대화 기록은 내 브라우저에" data-en="1. Chats stay in your browser"></h2>
<p data-ko="대화 기록, 메모리(쿼리봇이 기억하는 것), 사용자 지침과 말투, 설정은 사용하는 브라우저의 저장 공간(localStorage)에만 저장됩니다. QueryBot 서버에는 대화 기록을 저장하지 않습니다." data-en="Chat history, memory, custom instructions, tone and settings are stored only in your browser's local storage. The QueryBot server does not store chat history."></p>

<h2 data-ko="2. 답을 만들 때 보내는 것" data-en="2. What is sent to make an answer"></h2>
<p data-ko="질문을 보내면 답을 만들기 위해 다음이 QueryBot 서버로 전송되고, 처리가 끝나면 저장하지 않습니다." data-en="When you send a message, the following is sent to the QueryBot server to produce an answer and is not stored afterwards."></p>
<ul>
<li data-ko="보낸 글, 최근 앞 대화 일부, 첨부한 그림·파일 내용, 메모리, 사용자 지침·말투" data-en="Your message, part of the recent conversation, attached images or files, memory, custom instructions and tone"></li>
<li data-ko="'위치 공유'를 켠 경우에만 좌표 — 켤 때 직접 고른 정밀도(정확한 위치: 약 10m 단위, 대략적인 위치: 약 1km 단위)로, 날씨·근처 질문에만 씁니다" data-en="Coordinates, only if you turn on location sharing — at the precision you choose when turning it on (precise: about 10 m, approximate: about 1 km); used only for weather or nearby questions"></li>
</ul>
<p data-ko="Nova G(구글 Gemma 4 기반) 모델을 고르면 이 내용이 답을 만들기 위해 Cloudflare Workers AI로 전달됩니다. 웹 검색·날씨가 필요할 때는 검색어나 지역 이름이 검색 서비스(카카오, Bing 등)와 날씨·지도 서비스(OpenStreetMap, 노르웨이 기상청 등)로 전달됩니다. 서버 기록(로그)에는 글자 수·처리 시간 같은 숫자만 남기고 대화 내용은 남기지 않습니다. 답을 받는 중에 페이지를 닫거나 새로 고쳐도 이어 받을 수 있게, 만든 답은 서버 메모리에 최대 15분 동안만 두었다가 지웁니다(디스크에는 쓰지 않습니다)." data-en="If you choose Nova G (based on Google Gemma 4), this content is passed to Cloudflare Workers AI to generate the answer. For web search or weather, the search terms or place names are passed to search services (Kakao, Bing, etc.) and weather/map services (OpenStreetMap, MET Norway, etc.). Server logs keep only numbers such as length and time, not chat content. So that you can still get an answer after closing or reloading the page mid-reply, a finished answer is kept in server memory for at most 15 minutes and then deleted (never written to disk)."></p>

<h2 data-ko="3. Google Drive 백업 (선택)" data-en="3. Google Drive backup (optional)"></h2>
<ul>
<li data-ko="설정 > 데이터 관리에서 직접 단추를 누를 때만 동작합니다. 각 사용자는 자기 Google 계정으로 로그인하고, 백업은 그 사용자의 Google Drive에 저장됩니다." data-en="It runs only when you press the button in Settings > Data. Each user signs in with their own Google account and the backup is saved to their own Google Drive."></li>
<li data-ko="권한은 drive.file 하나만 요청합니다. QueryBot은 자신이 만든 백업 파일('QueryBot 대화 백업.json')에만 접근하며, Drive의 다른 파일은 볼 수 없습니다." data-en="Only the drive.file permission is requested. QueryBot can access only the backup file it created ('QueryBot 대화 백업.json') and cannot see your other Drive files."></li>
<li data-ko="저장되는 것은 대화 제목·내용, 메모리, 사용자 지침·말투입니다. 첨부한 그림·파일은 이름만 들어갑니다." data-en="Saved: chat titles and messages, memory, and custom instructions and tone. Attachments are included by name only."></li>
<li data-ko="연결을 유지하려고 Google이 준 새로 고침 토큰을 이 브라우저에만 저장합니다. 사이트를 열 때 QueryBot 서버가 그 토큰으로 Google에서 새 접근 권한을 받아 브라우저에 돌려줍니다. 서버는 토큰을 저장하거나 기록하지 않습니다. 대화 파일 내용은 QueryBot 서버를 거치지 않고 브라우저와 Google Drive 사이에서만 오갑니다." data-en="To keep you connected, the refresh token from Google is stored only in this browser. When you open the site, the QueryBot server uses it to get a new access token from Google and returns it to your browser; the server does not store or log tokens. Chat file contents travel only between your browser and Google Drive, not through the QueryBot server."></li>
<li data-ko="연결된 동안 대화·메모리·사용자 지침이 바뀌면 자동으로 Google Drive의 파일에 저장되고, 사이트를 열 때마다 그 파일과 합쳐집니다. 설정 › 데이터 관리의 '연결 끊기'를 누르면 Google 쪽 권한도 함께 거둡니다." data-en="While connected, changes to chats, memory and instructions are saved to the Drive file automatically and merged each time you open the site. 'Disconnect' in Settings › Data also revokes the Google permission."></li>
<li data-ko="사이트 운영자 전용 모델(Gemma 4 31B, 운영자의 RunPod 서버)이 있어서, 연결된 계정이 운영자 계정인지 확인하려고 그 권한으로 Google 계정 이메일 주소를 확인합니다. 이메일과 권한은 저장하거나 기록하지 않고, 확인 결과(운영자인지 아닌지)만 서버 메모리에 최대 50분 둡니다. 운영자가 아니면 이 모델은 보이지 않습니다." data-en="There is an operator-only model (Gemma 4 31B on the operator's RunPod server). To check whether the connected account is the operator's, the server reads the Google account email address with that permission. The email and token are not stored or logged; only the yes/no result is kept in server memory for up to 50 minutes. Other users do not see this model."></li>
<li data-ko="Google 사용자 데이터는 백업·복원과 위의 운영자 확인에만 쓰며, 광고·판매·모델 학습 등 다른 목적으로 쓰거나 다른 곳에 넘기지 않습니다. QueryBot의 Google API 데이터 사용은 Google API 서비스 사용자 데이터 정책(제한적 사용 요건 포함)을 따릅니다." data-en="Google user data is used only for backup and restore, never for ads, sale, model training or other purposes, and is not transferred to others. QueryBot's use of data from Google APIs adheres to the Google API Services User Data Policy, including the Limited Use requirements."></li>
<li data-ko="권한을 거두려면 Google 계정 > 보안 > 서드 파티 연결(myaccount.google.com/permissions)에서 QueryBot을 삭제하세요. 백업 파일은 Google Drive에서 직접 지울 수 있습니다." data-en="To revoke access, remove QueryBot at Google Account > Security > Third-party connections (myaccount.google.com/permissions). You can delete the backup file directly in Google Drive."></li>
</ul>

<h2 data-ko="4. 지우기" data-en="4. Deleting data"></h2>
<p data-ko="대화는 왼쪽 목록의 ⋯ > 삭제로, 메모리는 설정 > 메모리에서 지울 수 있습니다. 브라우저의 사이트 데이터를 지우면 이 기기에 저장된 모든 기록이 지워집니다." data-en="Delete chats with ⋯ > Delete in the list, and memory in Settings > Memory. Clearing the site's browser data removes everything stored on this device."></p>

<h2 data-ko="5. 문의" data-en="5. Contact"></h2>
<p data-ko="개인정보 관련 문의는 Google 권한 창에 표시되는 개발자 이메일로 보내 주세요." data-en="For privacy questions, please email the developer address shown on the Google consent screen."></p>
