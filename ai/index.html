    en: { on: "Online", off: "Offline", wake: "Waking", switched: "Model changed. Starting a new chat.", waking: "Waking the server… the first answer can take about a minute.", down: "Can't reach the server right now. Please try again later.", busy: "Too many messages. Please wait a moment.", fail: "No answer received. Please try again.", copy: "Copy", copied: "Copied", thinking: "Thinking", thinkingN: "Thinking", sec: "s", retry: "Retry", stopped: "Stopped.", editQ: "Edit", cancel: "Cancel", prevVer: "Previous version", nextVer: "Next version", stopTip: "Stop", sendTip: "Send", rename: "Rename", del: "Delete", more: "More", restarting: "The server is restarting. I'll resend automatically when it's back…", weatherTag: "Weather forecast", looking: "Looking at the image", reading: "Reading the file", working: "Searching or reading…", sources: "Sources", webTag: "Web search", attOnly: "Please look at the attachment and explain it.", wikiTag: "Wikipedia search", wikiOpen: "Open on Wikipedia", aiTag: "AI answer", taughtTag: "Taught answer", newChat: "New chat", noChats: "No chats yet", today: "Today", yesterday: "Yesterday", week: "Previous 7 days", older: "Older", delAsk: "Delete this chat?", helloTitle: "What would you like to know?", helloText: "Say anything — Gemma 4 replies in your language. Questions about people or places are answered from Wikipedia." }
  };
  const SUGGEST = [
    ["오늘 너무 피곤하다", "위로가 필요할 때"],
    ["좋아하는 사람이 생겼어", "설레는 이야기"],
    ["이순신은 누구야?", "위키백과 검색"],
    ["심심해", "이야기 상대가 필요할 때"]
  ];
  const lang = () => (document.documentElement.lang === "en" ? "en" : "ko");
  const t = (k) => T[lang()][k];
  const $ = (id) => document.getElementById(id);
  const log = $("log"), scroller = $("scroller"), input = $("input"), send = $("send"), status = $("status");
  const modelSel = $("model"), mem = $("mem"), convList = $("convList");
  let online = null, busy = false;
  // 서버가 알려 주는 모델 이름(한국어)의 영어 이름
  // 모델 이름 (사용자 요청 2026-10-21): 사이트에 올라간 최고 모델은 QueryBot the Best, 예전 모델은 단계 번호로
  const MODEL_NAME = { latest: "QueryBot the Best", stage3: "QueryBot 3", v1: "QueryBot 1" };
  // 서버가 잠들어 있고 기억한 목록도 없을 때(처음 온 폰 등) 보여 줄 기본 목록. 서버 목록이 오면 그걸로 바뀐다 (2026-11-09)
  const DEFAULT_MODELS = [{ key: "latest", label: "QueryBot the Best" }, { key: "stage3", label: "QueryBot 3" }, { key: "v1", label: "QueryBot 1" }, { key: "gemma4", label: "Gemma 4 (구글 26B)" }];
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 고른 모델·기억 설정은 이 브라우저에만 기억해 둔다 (못 쓰는 환경이면 그냥 넘어감)
  const store = {
    get(k) { try { return localStorage.getItem("qbAi." + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("qbAi." + k, v); } catch (e) {} }
  };
  mem.checked = true;  // 앞 대화 기억은 항상 켬 (2026-11-10 사용자: "기본이니까 선택 삭제")

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };
  function put(node) {
    const hello = log.querySelector(".qa-hello");
    if (hello) hello.remove();
    log.appendChild(node);
    toBottom();
    return node;
  }
  // 내 말: 첨부가 있으면 말풍선 위에 그림 썸네일·파일 이름 (저장된 대화는 이름만 남아 있음)
  function addMe(text, att, live) {
    if (!att || !att.length) return put(el("div", "me", text));
    const wrap = el("div", "me-wrap"), row = el("div", "me-atts");
    (live || att).forEach((a) => {
      if (a.type === "image" && a.url) { const im = document.createElement("img"); im.src = a.url; im.alt = a.name; im.className = "me-img"; row.appendChild(im); }
      else row.appendChild(el("span", "me-file", (a.type === "image" ? "🖼 " : "📄 ") + a.name));
    });
    wrap.append(row, el("div", "me", text));
    return put(wrap);
  }
  const addSys = (text) => put(el("div", "sys", text));
  function addAlert(text, warn, retry) {
    const a = el("div", "alert" + (warn ? " warn" : ""));
    a.append(el("span", "", warn ? "⏳" : "⚠"), el("span", "", text));
    if (retry) {  // [다시 시도]: 방금 질문을 같은 설정으로 다시 보낸다 (2026-11-09 사용자 요청)
      const b = el("button", "retry", t("retry"));
      b.type = "button";
      b.addEventListener("click", () => { if (!busy) { a.remove(); retry(); } });
      a.appendChild(b);
    }
    return put(a);
  }

  // 빈 채팅: 가운데 아이콘·소개·추천 질문
  // 첫 화면: 가운데에 한 줄만 (예시 단추·아이콘·설명은 뺌 — 2026-11-10 사용자 요청)
  function showHello() {
    log.innerHTML = "";
    const box = el("div", "qa-hello");
    box.appendChild(el("h2", "", t("helloTitle")));
    log.appendChild(box);
  }

  // =========================================================
  // 대화 기록 — 이 브라우저에만 저장. 서버에는 남지 않는다. 기본 켜짐, '기록 끄기'로 끌 수 있다.
  // 폴더(프로젝트) 저장·저장 위치 고르기는 뺐다 (2026-11-09 사용자: "앱이면 괜찮은데 사이트라 아직 넣을 때 아님")
  // =========================================================
  const CONV_KEY = "qbAi.convs", MAX_CONVS = 100, MAX_MSGS = 200;
  let histOn = store.get("histOn") !== "0";  // 예전에 끈 사람('0')만 꺼짐
  let convs = [];
  if (histOn) {
    try { convs = JSON.parse(localStorage.getItem(CONV_KEY) || "[]"); if (!Array.isArray(convs)) convs = []; } catch (e) { convs = []; }
  }
  let cur = null;  // 지금 대화 {id, title, created, updated, model, messages: [{role, content, kind?, source?}]}
  function saveConvs() {
    if (!histOn) return;
    convs = convs.slice(0, MAX_CONVS);
    try { localStorage.setItem(CONV_KEY, JSON.stringify(convs)); } catch (e) {
      // 저장 공간이 꽉 참(아주 긴 글) → 저장본에서만 긴 글을 2만 자로 줄이고, 그래도 안 되면 오래된 대화부터 빼고 저장. 막혀 있으면 이번 화면에서만 유지
      const cut = (c) => ({ ...c, messages: c.messages.map((m) => (m.content.length > 20000 ? { ...m, content: m.content.slice(0, 20000) + " …" } : m)) });
      for (let n = convs.length; n > 0; n = Math.floor(n / 2)) {
        try { localStorage.setItem(CONV_KEY, JSON.stringify(convs.slice(0, n).map(cut))); break; } catch (e2) {}
      }
    }
  }

  // 기록 켜기 (꺼 둔 사람이 왼쪽 칸에서 다시 켤 때): 지금 하던 대화부터 저장
  function startHistory() {
    histOn = true;
    store.set("histOn", "1");
    convs = cur && cur.messages.length ? [cur] : [];
    saveConvs();
    renderList();
    paintFoot();
  }
  function disableHistory() {
    if (!confirm("대화 기록을 끄시겠습니까? 이 브라우저에 저장된 대화가 모두 삭제됩니다. (먼저 '내보내기'로 백업할 수 있습니다)")) return;
    histOn = false;
    store.set("histOn", "0");
    try { localStorage.removeItem(CONV_KEY); } catch (e) {}
    convs = [];
    renderList();
    paintFoot();
  }
  // 기록이 꺼져 있을 때 왼쪽 칸 안내
  function offCard() {
    const box = el("div", "qa-offer-side");
    box.appendChild(el("b", "", "대화 기록이 꺼져 있습니다"));
    box.appendChild(el("p", "", "켜면 지난 대화를 왼쪽에서 다시 열어 볼 수 있습니다. 이 브라우저에만 저장되고 서버에는 남지 않습니다."));
    const row = el("div", "r");
    const yes = el("button", "go", "기록 켜기"); yes.type = "button";
    yes.addEventListener("click", startHistory);
    row.appendChild(yes);
    box.appendChild(row);
    return box;
  }
  // 왼쪽 아래: 기록이 켜져 있을 때만 저장 안내·내보내기·가져오기·끄기
  function paintFoot() {
    const note = $("histNote");
    note.innerHTML = "";
    $("histTools").hidden = !histOn;
    // '대화는 이 브라우저에만 저장됩니다' 문구는 뺌 (2026-11-10 사용자: "불필요한 요소들 삭제")
  }
  // 앞 대화 (서버에 보낼 것·가르치기 때 같이 저장할 것)
  const hist = (n) => (cur ? cur.messages.map((m) => ({ role: m.role, content: m.content.slice(0, n || 400) })) : []);

  function dayLabel(ts) {
    const d = new Date(ts), n = new Date();
    const same = (a, b) => a.toDateString() === b.toDateString();
    if (same(d, n)) return t("today");
    const y = new Date(n); y.setDate(n.getDate() - 1);
    if (same(d, y)) return t("yesterday");
    return n - d < 7 * 864e5 ? t("week") : t("older");
  }

  function renderList() {
    convList.innerHTML = "";
    if (!histOn) { convList.appendChild(offCard()); return; }
    if (!convs.length) { convList.appendChild(el("div", "qa-empty-list", t("noChats"))); return; }
    let group = "";
    for (const c of convs) {
      const g = dayLabel(c.updated || c.created || Date.now());
      if (g !== group) { convList.appendChild(el("div", "qa-group", g)); group = g; }
      const item = el("div", "qa-conv" + (cur && c.id === cur.id ? " on" : ""));
      const open = el("button", "qa-conv-open", c.title || t("newChat"));
      open.type = "button";
      open.title = c.title || "";
      open.addEventListener("click", () => openConv(c.id));
      const more = el("button", "qa-conv-more", "⋯");  // 이름 바꾸기·삭제 (2026-11-10)
      more.type = "button";
      more.title = t("more");
      more.setAttribute("aria-label", t("more"));
      more.setAttribute("aria-haspopup", "menu");
      more.addEventListener("click", (e) => { e.stopPropagation(); convMenu(item, c); });
      item.append(open, more);
      convList.appendChild(item);
    }
  }

  function newChat() {
    cur = null;
    const dm = store.get("defModel");  // 설정 > 일반 > 새 대화 기본 모델
    if (dm && dm !== modelSel.value && [...modelSel.options].some((o) => o.value === dm)) { modelSel.value = dm; store.set("model", dm); paintModel(); setQuota(); }
    showHello();
    renderList();
    closeSide();
    input.focus();
  }

  // 저장된 대화 다시 보기 (한 글자씩 써지는 효과 없이)
  function openConv(id, upto) {
    const c = cur && cur.id === id ? cur : convs.find((x) => x.id === id);
    if (!c) return;
    cur = c;
    log.innerHTML = "";
    const msgs = upto != null ? c.messages.slice(0, upto) : c.messages;  // upto: 질문 고치기 때 고친 말 앞까지만
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.role === "user") { meTools(addMe(m.content, m.att), i); continue; }
      const prevUser = i > 0 && msgs[i - 1].role === "user" ? msgs[i - 1].content : "";
      const meta = prevUser ? { user: prevUser, ctx: msgs.slice(Math.max(0, i - 3), i - 1).map((x) => ({ role: x.role, content: x.content })) } : null;
      if (m.kind === "wiki" && m.source) addWikiReply(m.content, m.source, meta);
      else addAiReply(m.content, meta, m.kind === "taught" ? "taught" : "ai", false, m.sources, m.thought);
    }
    if (!msgs.length) showHello();
    if (c.model && [...modelSel.options].some((o) => o.value === c.model)) modelSel.value = c.model;
    paintModel();
    renderList();
    closeSide();
    toBottom();
  }

  // 한 번 주고받을 때마다 지금 대화에 저장 (첫 질문이 대화 제목)
  function record(text, reply, kind, source, more) {
    if (!cur) {
      // Gemma 4 대화는 제목을 비워 두고(목록엔 '새 대화') 답이 온 뒤 Gemma가 붙인다. 기본 모델은 예전처럼 첫 말
      const g4 = modelSel.value === "gemma4";
      cur = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), title: g4 ? "" : text.slice(0, 40), titled: !g4, created: Date.now(), updated: Date.now(), model: modelSel.value, messages: [] };
    }
    const a = { role: "assistant", content: reply, kind };
    if (source) a.source = source;
    const u = { role: "user", content: text };
    if (more && more.att && more.att.length) u.att = more.att;  // 그림·파일 자체는 저장하지 않고 이름만
    if (more && more.thought && typeof more.thought.seconds === "number") a.thought = { seconds: Math.round(more.thought.seconds), summary: String(more.thought.summary || "").slice(0, 800) };
    if (more && Array.isArray(more.sources) && more.sources.length) a.sources = more.sources.filter((s) => s && /^https:\/\//.test(s.url || "")).slice(0, 10).map((s) => ({ title: String(s.title || "").slice(0, 120), url: String(s.url).slice(0, 500) }));
    u.ts = a.ts = Date.now();
    if (more && more.branch && cur.messages.length >= more.branch.i) {  // 질문 고치기: 고친 말 자리부터 새 버전 (예전 버전들은 u.vers에)
      cur.messages = cur.messages.slice(0, more.branch.i);
      u.vers = more.branch.vers;
      u.vi = more.branch.vi;
    }
    cur.messages.push(u, a);
    cur.messages = cur.messages.slice(-MAX_MSGS);
    cur.updated = Date.now();
    cur.model = modelSel.value;
    if (!histOn) return;  // 기록이 꺼져 있으면 저장하지 않는다
    convs = [cur].concat(convs.filter((c) => c.id !== cur.id));
    saveConvs();
    renderList();
  }

  // 대화 제목: Gemma 4가 질문·답을 함께 보고 중심 내용을 짧게 (2026-11-10 사용자 요청)
  //  - 인사만 오갔으면 서버가 빈 제목 → '새 대화'로 두고 다음 주고받기에서 다시 (사용자 말 3번까지)
  //  - 한 번 정하면 그대로, ⋯ → 이름 바꾸기로 직접 바꾼 제목도 그대로. 예전 대화(titled 없음)는 건드리지 않는다
  const naming = new Set();
  async function nameConv(c) {
    if (!c || c.titled !== false || c.userTitle || naming.has(c.id)) return;
    const users = c.messages.filter((m) => m.role === "user");
    if (users.length > 3) { c.titled = true; saveConvs(); return; }
    const last = [...c.messages].reverse().find((m) => m.role === "assistant");
    const said = users.slice(-3).map((m) => m.content.slice(0, 400) + (m.att && m.att.length ? " [첨부: " + m.att.map((a) => a.name).join(", ") + "]" : "")).join("\n---\n");
    naming.add(c.id);
    try {
      const r = await fetch(API + "/title", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: said.slice(0, 1400), reply: last ? last.content.slice(0, 700) : "" }) });
      const j = r.ok ? await r.json() : null;
      const tt = j && typeof j.title === "string" ? j.title.replace(/\s+/g, " ").trim().slice(0, 40) : "";
      if (tt && !c.userTitle) { c.title = tt; c.titled = true; saveConvs(); renderList(); }
    } catch (e) {} finally { naming.delete(c.id); }
  }
  // 사이드바 ⋯ 메뉴: 이름 바꾸기 / 삭제
  function convMenu(item, c) {
    const old = document.querySelector(".qa-conv-menu");
    if (old) { old.remove(); if (old.dataset.id === c.id) return; }
    const m = el("div", "qa-conv-menu");
    m.dataset.id = c.id;
    m.setAttribute("role", "menu");
    const ren = el("button", "", t("rename")), del = el("button", "danger", t("del"));
    ren.type = del.type = "button";
    ren.setAttribute("role", "menuitem"); del.setAttribute("role", "menuitem");
    ren.addEventListener("click", (e) => { e.stopPropagation(); m.remove(); renameConv(item, c); });
    del.addEventListener("click", (e) => {
      e.stopPropagation(); m.remove();
      if (!confirm(t("delAsk"))) return;
      convs = convs.filter((x) => x.id !== c.id);
      saveConvs();
      if (cur && cur.id === c.id) newChat(); else renderList();
    });
    m.append(ren, del);
    item.appendChild(m);
    ren.focus();
  }
  document.addEventListener("click", (e) => { const m = document.querySelector(".qa-conv-menu"); if (m && !e.target.closest(".qa-conv-menu")) m.remove(); });
  document.addEventListener("keydown", (e) => { const m = document.querySelector(".qa-conv-menu"); if (m && e.key === "Escape") m.remove(); });
  function renameConv(item, c) {
    const open = item.querySelector(".qa-conv-open");
    if (!open) return;
    const inp = el("input", "qa-conv-edit");
    inp.value = c.title || "";
    inp.maxLength = 60;
    inp.setAttribute("aria-label", t("rename"));
    open.replaceWith(inp);
    inp.focus(); inp.select();
    let done = false;
    const save = (ok) => {
      if (done) return;
      done = true;
      const v = inp.value.replace(/\s+/g, " ").trim().slice(0, 60);
      if (ok && v && v !== c.title) { c.title = v; c.userTitle = true; c.titled = true; saveConvs(); }
      renderList();
    };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(true); } else if (e.key === "Escape") { e.preventDefault(); save(false); } });
    inp.addEventListener("blur", () => save(true));
    inp.addEventListener("click", (e) => e.stopPropagation());
  }

  // 내보내기·가져오기: 기록을 파일로 백업하거나 다른 기기로 옮기기
  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "querybot-ai", version: 1, exported: new Date().toISOString(), convs }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = "querybot-대화기록-" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  // 파일에서 읽은 대화는 그대로 믿지 않고 필요한 모양만 골라 담는다 (가져오기). 모양이 틀리면 null
  function cleanConv(c) {
    if (!c || typeof c.id !== "string" || !c.id || !Array.isArray(c.messages)) return null;
    const messages = [];
    for (const m of c.messages.slice(-MAX_MSGS)) {
      if (!m || (m.role !== "user" && m.role !== "assistant") || typeof m.content !== "string") continue;
      const x = { role: m.role, content: m.content.slice(0, 200000) };
      if (typeof m.ts === "number") x.ts = m.ts;
      if (m.role === "assistant") {
        x.kind = ["ai", "wiki", "taught"].includes(m.kind) ? m.kind : "ai";
        if (typeof m.source === "string" && /^https:\/\/([a-z]+\.)?wikipedia\.org\//.test(m.source)) x.source = m.source;
        if (Array.isArray(m.sources)) {
          const ss = m.sources.filter((s) => s && typeof s.url === "string" && /^https:\/\//.test(s.url)).slice(0, 10).map((s) => ({ title: String(s.title || "").slice(0, 120), url: s.url.slice(0, 500) }));
          if (ss.length) x.sources = ss;
        }
        if (m.thought && typeof m.thought.seconds === "number" && m.thought.seconds >= 0 && m.thought.seconds < 3600) {
          x.thought = { seconds: Math.round(m.thought.seconds), summary: typeof m.thought.summary === "string" ? m.thought.summary.slice(0, 800) : "" };
        }
      } else if (Array.isArray(m.att)) {
        const aa = m.att.filter((a) => a && (a.type === "image" || a.type === "file")).slice(0, 8).map((a) => ({ type: a.type, name: String(a.name || "").slice(0, 80) }));
        if (aa.length) x.att = aa;
      }
      messages.push(x);
    }
    if (!messages.length) return null;
    return { id: c.id.slice(0, 40), title: String(c.title || messages[0].content).slice(0, 40), created: Number(c.created) || Date.now(), updated: Number(c.updated) || Date.now(), model: typeof c.model === "string" ? c.model.slice(0, 32) : "latest", titled: c.titled !== false || !!c.userTitle, userTitle: !!c.userTitle, messages };
  }
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    if (!files.length) return;
    let added = 0, bad = 0;
    const have = new Set(convs.map((c) => c.id));
    for (const f of files) {
      try {
        if (f.size > 5e6) throw new Error("big");
        const data = JSON.parse(await f.text());
        // 내보내기 묶음({convs:[…]}), 대화 목록([…]), 예전 폴더 저장 파일 하나({app, messages…}) 모두 받는다 — 폴더 파일은 여러 개를 한꺼번에 골라도 됨
        const list = Array.isArray(data) ? data : data && Array.isArray(data.convs) ? data.convs : data && Array.isArray(data.messages) ? [data] : null;
        if (!list) throw new Error("form");
        for (const raw of list) {
          const c = cleanConv(raw);
          if (!c || have.has(c.id)) continue;
          convs.push(c);
          have.add(c.id);
          added++;
        }
      } catch (err) { bad++; }
    }
    convs.sort((a, b) => (b.updated || 0) - (a.updated || 0));
    saveConvs();
    renderList();
    if (bad && !added) alert("가져올 수 없는 파일입니다. 이 페이지에서 '내보내기'로 만든 파일인지 확인해 주세요.");
    else alert((added ? "대화 " + added + "개를 가져왔습니다." : "새로 가져올 대화가 없습니다.") + (bad ? " (읽지 못한 파일 " + bad + "개)" : ""));
  });

  // 폰: 대화 기록 서랍
  const openSide = () => document.body.classList.add("side-open");
  const closeSide = () => document.body.classList.remove("side-open");
  $("menuBtn").addEventListener("click", openSide);
  $("scrim").addEventListener("click", closeSide);
  $("newChat").addEventListener("click", newChat);
  $("histOff").addEventListener("click", disableHistory);

  // 쿼리봇 차례 한 칸: 아이콘 + 이름 + 내용. kind = "ai" | "wiki" | "taught"(주인이 가르친 답)
  function turnShell(kind) {
    const turn = el("div", "turn");
    const av = el("div", "avatar" + (kind === "wiki" ? " wiki" : kind === "taught" ? " taught" : ""), kind === "wiki" ? "W" : "Q");
    av.setAttribute("aria-hidden", "true");
    const body = el("div", "turn-body");
    const who = el("div", "who", "QueryBot");
    const tag = el("span", "who-tag" + (kind === "taught" ? " taught" : ""), kind === "wiki" ? t("wikiTag") : kind === "taught" ? t("taughtTag") : t("aiTag"));
    if (kind !== "wiki" && kind !== "taught") tag.prepend(spark());  // AI가 만든 답에는 ✨
    who.appendChild(tag);
    body.appendChild(who);
    turn.append(av, body);
    return { turn, body };
  }

  // 반짝임(✨) 아이콘: AI 기능 표시
  function spark() { const s = el("span", "spark"); s.setAttribute("aria-hidden", "true"); return s; }
  // 답을 기다리는 동안: 아이콘에 흐르는 그라데이션 + '✨ 답을 만드는 중' + 글자 모양 회색 줄(스켈레톤)
  function addWaiting(label) {
    const { turn, body } = turnShell("ai");
    turn.querySelector(".avatar").classList.add("thinking");
    body.querySelector(".who-tag").remove();
    const th = el("span", "think");
    th.append(spark(), el("span", "", label || t("thinking")));
    body.querySelector(".who").appendChild(th);
    const sk = el("div", "skel");
    sk.setAttribute("aria-label", t("thinking"));
    sk.append(el("i"), el("i"), el("i"));
    body.appendChild(sk);
    return put(turn);
  }

  // 답 아래 도구: 복사 + (가르치기 모드일 때만 보이는) 고치기. meta = {user, ctx}: 이 답을 부른 질문과 그 앞 대화
  function copyTool(getText, meta, body) {
    const tools = el("div", "tools");
    const b = el("button", "", t("copy"));
    b.type = "button";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(getText()); b.textContent = t("copied"); setTimeout(() => (b.textContent = t("copy")), 1500); } catch (e) {}
    });
    tools.appendChild(b);
    if (meta && body) {
      const f = el("button", "fix", "고치기");
      f.type = "button";
      f.title = "더 좋은 답을 직접 가르치기 (관리자만)";
      f.addEventListener("click", () => openEdit(body, meta, getText()));
      tools.appendChild(f);
    }
    return tools;
  }

  // 답 속 수식 위치를 글자(코드 포인트) 단위로 [시작, 끝]. 코드 안의 $는 빼고, 닫히지 않은 $는 수식이 아님 (2026-11-09)
  function mathSpans(text) {
    if (!/\$|\\\(|\\\[/.test(text)) return [];
    const code = [];
    for (const m of text.matchAll(/```[\s\S]*?(?:```|$)|`[^`\n]+`/g)) code.push([m.index, m.index + m[0].length]);
    const inCode = (k) => code.some(([a, b]) => k >= a && k < b);
    const cp = (k) => [...text.slice(0, k)].length;
    const out = [];
    for (const m of text.matchAll(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$/g)) {
      if (!inCode(m.index)) out.push([cp(m.index), cp(m.index + m[0].length)]);
    }
    return out;
  }

  // 모델 답: 새 답은 한 글자씩 써지듯 보여 준다 (실제로는 다 받은 뒤 보여 주는 것). 저장된 대화를 열 땐 바로.
  function addAiReply(text, meta, kind, animate, sources, thought) {
    const { turn, body } = turnShell(kind || "ai");
    const p = el("div", "text");
    const src = Array.isArray(sources) && sources.length ? sourceList(sources) : null;
    if (src) body.querySelector(".who").appendChild(el("span", "who-tag web",
      sources.every((s) => /open-meteo\.com|met\.no/.test((s && s.url) || "")) ? t("weatherTag") : t("webTag")));
    if (thought && typeof thought.seconds === "number") body.appendChild(thoughtBox(thought));
    body.append(p, copyTool(() => text, meta, body));
    put(turn);
    const finish = () => { renderMath(p); if (src) { linkCites(p, sources); p.after(src); } };
    if (reduceMotion || animate === false) { renderRich(p, text); finish(); return; }
    p.classList.add("typing");
    const chars = [...text];
    const spans = mathSpans(text);  // 수식이 있는 곳(글자 위치): 한 글자씩 보여 주지 않고 통째로
    let i = 0;
    let halted = false;
    const halt = () => { halted = true; };
    setStopper(halt);
    const step = () => {
      if (halted) {  // ■ 멈춤: 써진 데까지만 남기고, 저장된 대화도 거기까지
        const shown = chars.slice(0, i).join("");
        p.classList.remove("typing");
        try { renderRich(p, shown); renderMath(p); } catch (e) { p.textContent = shown; }
        p.appendChild(el("span", "halted", " · " + t("stopped")));
        const last = cur && cur.messages.length ? cur.messages[cur.messages.length - 1] : null;
        if (last && last.role === "assistant" && last.content === text) { last.content = shown + " …"; saveConvs(); }
        if (stopper === halt) setStopper(null);
        return;
      }
      try {
        i = Math.min(chars.length, i + 2);
        for (const [s, e] of spans) if (i > s && i < e) { i = e; break; }  // 수식 안으로 들어가면 수식 끝까지 한 번에
        renderRich(p, chars.slice(0, i).join(""));
        if (spans.length) renderMath(p);  // 다 나오기 전에도 이미 나온 수식은 바로 그림으로
        toBottom();
        if (i < chars.length) { setTimeout(step, 22); return; }
      } catch (e) {  // 그리다 오류 → 남은 글을 한 번에 (2026-11-10 '답이 오류라 안 떴다')
        console.error("답 그리기 오류", e);
        p.textContent = text;
      }
      p.classList.remove("typing");
      try { finish(); } catch (e) { console.error("답 마무리 오류", e); }
      if (stopper === halt) setStopper(null);
      toBottom();
    };
    step();
  }

  // 위키백과 답: 서버 글 "위키백과에서 찾아봤어요. <요약>\n(출처: 위키백과 「제목」)"을 나눠 출처 카드로
  function addWikiReply(text, url, meta) {
    const m = text.match(/\(출처:\s*위키백과\s*「([^」]+)」\)\s*$/);
    const title = m ? m[1] : "";
    const summary = text.replace(/\(출처:[^)]*\)\s*$/, "").replace(/^위키백과에서 찾아봤어요\.\s*/, "").trim();
    const { turn, body } = turnShell("wiki");
    const card = el("div", "src");
    const top = el("div", "src-top");
    top.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
    top.appendChild(el("span", "", lang() === "en" ? "Found on Korean Wikipedia" : "위키백과 검색 결과"));
    card.appendChild(top);
    if (title) card.appendChild(el("div", "src-title", title));
    card.appendChild(el("div", "src-text", summary));
    let safe = "";
    try { const u = new URL(url); if (u.protocol === "https:" && /(^|\.)wikipedia\.org$/.test(u.hostname)) safe = u.href; } catch (e) {}
    if (safe) {
      const a = el("a", "src-link");
      a.href = safe; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.append(el("span", "", t("wikiOpen") + " ↗"), el("small", "", "ko.wikipedia.org"));
      card.appendChild(a);
    }
    body.append(card, copyTool(() => summary + (title ? "\n(출처: 위키백과 「" + title + "」)" : ""), meta, body));
    put(turn);
  }

  // =========================================================
  // 가르치기 모드 (주인만). 가르친 대화는 PC 답변 서버에 저장 → 같은 말엔 몇 분 안에 사이트 AI가 그 답을 하고,
  // 모두 다음 학습 라운드에 들어간다. 키는 PC에서 '가르치기키만들기.bat'로 정하고, 이 브라우저에만 기억한다.
  // =========================================================
  const TEACH_API = "https://poem-defog-septum.ngrok-free.dev";
  const TEACH_HEADERS = { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" };
  const teachBox = $("teach"), teachState = $("teachState");
  let teachKey = store.get("teachKey") || "";
  let owner = false;

  async function teachCall(path, body) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    let r;
    try {
      r = await fetch(TEACH_API + path, { method: "POST", headers: TEACH_HEADERS, body: JSON.stringify(Object.assign({ key: teachKey }, body || {})), signal: ctrl.signal });
    } catch (e) {
      throw new Error("PC 답변 서버에 연결할 수 없습니다. 가르치기는 PC가 켜져 있을 때만 할 수 있습니다.");
    } finally {
      clearTimeout(timer);
    }
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (r.status === 401) { setOwner(false); teachKey = ""; store.set("teachKey", ""); }
    if (!r.ok) throw new Error(j.detail || ("오류 " + r.status));
    return j;
  }

  // 쿼리봇은 해요체로 말하도록 배우는 중 → 반말 답이면 한 번 물어본다
  const POLITE_END = /(요|죠|니다|니까)$/, INTERJ = /^(와|우와|헉|어머|아이고|저런|오|앗|네|음|아하|에구|아니요)$/;
  const politeOk = (s) => s.split(/(?<=[.!?])\s+/).every((x) => { const c = x.replace(/[^가-힣A-Za-z0-9]+$/, ""); return !c || POLITE_END.test(c) || INTERJ.test(c); });

  // 중요도 1~5: 학습 데이터에 넣는 횟수 (PC 서버 teach_store.WEIGHT_REPEAT와 같게)
  const REPEAT = { 1: 2, 2: 4, 3: 6, 4: 10, 5: 15 };
  function weightPicker(initial) {
    let w = initial || 3;
    const box = el("span", "wpick");
    box.appendChild(el("b", "", "중요도"));
    const hint = el("small");
    const btns = [1, 2, 3, 4, 5].map((n) => {
      const b = el("button", "", String(n));
      b.type = "button";
      b.title = "학습에 " + REPEAT[n] + "번 넣습니다";
      b.addEventListener("click", () => { w = n; paint(); });
      box.appendChild(b);
      return b;
    });
    box.appendChild(hint);
    function paint() {
      btns.forEach((b, i) => b.setAttribute("aria-pressed", String(i + 1 === w)));
      hint.textContent = "학습에 " + REPEAT[w] + "번";
    }
    paint();
    return { el: box, get: () => w };
  }

  const fmtDialog = (msgs) => msgs.map((m) => (m.role === "user" ? "사용자: " : "쿼리봇: ") + m.content).join(" / ");

  // 사이트 서버(Render)가 지금 쓰는 가르친 대화 — '사이트 반영됨' 표시용. 비교는 서버와 같은 방식(띄어쓰기·문장 부호 무시)
  const tnorm = (s) => s.replace(/[\s.,!?~…ㅠㅜ"'()\[\]{}:;·\-]+/g, "").toLowerCase();
  async function siteTaught(refresh) {
    try {
      if (refresh) await fetch(API + "/taught/refresh", { method: "POST" });
      const r = await fetch(API + "/taught", { cache: "no-store" });
      if (!r.ok) return null;
      const j = await r.json();
      j.map = new Map(j.items.map((it) => [it.q, it.a]));
      return j;
    } catch (e) { return null; }
  }
  const onSite = (st, msgs) => !!st && msgs.length === 2 && st.map.get(tnorm(msgs[0].content)) === msgs[1].content;

  // 가르친 직후: 사이트 서버가 바로 받아 가게 하고, 반영됐는지 메시지에 덧붙인다
  async function syncSite(messages, msgEl) {
    if (messages.length !== 2) return;
    const st = await siteTaught(true);
    if (!msgEl.isConnected) return;
    msgEl.textContent += onSite(st, messages) ? " · ✓ 사이트 서버에 반영됨" : " · 사이트 서버 반영 대기(서버가 쉬고 있으면 깨어날 때 반영됩니다)";
  }

  // 가르치기 저장. 서버가 '똑같거나 80% 이상 비슷한 가르침이 있다'고 하면 저장하지 않고 주인에게 고르게 한다.
  async function saveTeach(messages, msgEl, btn, weight, opts) {
    const answer = messages[messages.length - 1].content;
    if (!(opts && opts.mode) && !politeOk(answer) && !confirm("쿼리봇은 해요체(~요)로 말하도록 학습 중입니다. 그래도 이 답으로 가르치시겠습니까?")) return false;
    const old = msgEl.parentNode.querySelector(".similar");
    if (old) old.remove();
    if (btn) btn.disabled = true;
    try {
      const j = await teachCall("/teach", Object.assign({ messages, weight: weight || 3, mode: "check" }, opts || {}));
      if (!j.ok && j.similar) return await askSimilar(j.similar, messages, msgEl, btn, weight);
      msgEl.className = "teach-msg";
      msgEl.textContent = (messages.length === 2 ? "저장했습니다. 사이트 AI가 같은 말에 이 답을 하고, " : "저장했습니다. 이어지는 대화이므로 ")
        + "다음 학습 라운드에 " + REPEAT[weight || 3] + "번 들어갑니다. (모두 " + j.count + "개)";
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
      syncSite(messages, msgEl);
      return true;
    } catch (e) {
      msgEl.className = "teach-msg bad";
      msgEl.textContent = e.message;
      return false;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // 비슷한 가르침이 있을 때: 기존 것 바꾸기 / 따로 저장 / (완전히 같으면) 중요도만 바꾸기 / 취소
  function askSimilar(similar, messages, msgEl, btn, weight) {
    return new Promise((resolve) => {
      msgEl.textContent = "";
      const box = el("div", "similar");
      const same = similar.find((s) => s.same);
      box.appendChild(el("div", "", same ? "이미 같은 대화를 가르쳤습니다." : "비슷한 대화가 이미 있습니다. 어떻게 하시겠습니까?"));
      for (const s of similar.slice(0, 3)) {
        box.appendChild(el("div", "it", (s.same ? "같음" : "비슷함 " + s.score + "%") + " · 중요도 " + s.weight + " — " + fmtDialog(s.messages)));
      }
      const row = el("div", "row");
      const done = (v) => { box.remove(); resolve(v); };
      const mk = (label, cls, fn) => { const b = el("button", cls, label); b.type = "button"; b.addEventListener("click", fn); row.appendChild(b); };
      if (same) {
        if (same.weight !== (weight || 3)) {
          mk("중요도만 " + (weight || 3) + "(으)로 바꾸기", "go", async () => {
            try {
              await teachCall("/teach/weight", { id: same.id, weight: weight || 3 });
              msgEl.className = "teach-msg"; msgEl.textContent = "중요도를 바꿨습니다. 다음 학습 라운드부터 " + REPEAT[weight || 3] + "번 들어갑니다.";
              done(true);
            } catch (e) { msgEl.className = "teach-msg bad"; msgEl.textContent = e.message; done(false); }
          });
        }
      } else {
        mk("이걸로 바꾸기", "go", async () => { box.remove(); resolve(await saveTeach(messages, msgEl, btn, weight, { mode: "replace", replace_id: similar[0].id })); });
        mk("따로 저장", "sub", async () => { box.remove(); resolve(await saveTeach(messages, msgEl, btn, weight, { mode: "new" })); });
      }
      mk("취소", "sub", () => { msgEl.className = "teach-msg"; msgEl.textContent = "저장하지 않았습니다."; done(false); });
      box.appendChild(row);
      msgEl.parentNode.insertBefore(box, msgEl.nextSibling);
    });
  }

  // AI 답 아래 '고치기': 더 좋은 답을 적어서 가르친다 (질문과 그 앞 대화는 자동으로 같이)
  function openEdit(body, meta, current) {
    const old = body.querySelector(".edit");
    if (old) { old.remove(); return; }
    const box = el("div", "edit");
    box.appendChild(el("div", "lbl", "\"" + meta.user + "\"에 대한 더 좋은 답" + (meta.ctx.length ? " (앞 대화도 같이 가르쳐요)" : "")));
    const ta = el("textarea");
    ta.maxLength = 200;
    ta.value = current.replace(/\n?\(출처:[^)]*\)\s*$/, "").trim().slice(0, 200);
    const row = el("div", "row");
    const go = el("button", "go", "가르치기"); go.type = "button";
    const no = el("button", "sub", "취소"); no.type = "button";
    const wp = weightPicker(3);
    const msg = el("div", "teach-msg");
    row.append(go, no, wp.el);
    box.append(ta, row, msg);
    body.appendChild(box);
    ta.focus();
    no.addEventListener("click", () => box.remove());
    go.addEventListener("click", async () => {
      const a = ta.value.trim();
      if (!a) { msg.className = "teach-msg bad"; msg.textContent = "답을 적어 주세요."; return; }
      const ok = await saveTeach(meta.ctx.concat([{ role: "user", content: meta.user }, { role: "assistant", content: a }]), msg, go, wp.get());
      if (ok) setTimeout(() => box.remove(), 3000);
    });
  }

  function setOwner(v) {
    owner = v;
    document.body.classList.toggle("owner", v);
    $("teachToggle").textContent = v ? "● 관리자 모드" : "관리자";
    if (!v) teachState.textContent = "";
  }

  function renderTeach() {
    teachBox.innerHTML = "";
    teachBox.hidden = false;
    if (!owner) {
      teachBox.append(el("h3", "", "관리자 · 가르치기"),
        el("p", "", "PC에서 '가르치기키만들기.bat'로 정한 키를 입력해 주세요. 키는 이 브라우저에만 저장됩니다."));
      const form = el("form");
      const inp = el("input"); inp.type = "password"; inp.autocomplete = "current-password"; inp.placeholder = "가르치기 키"; inp.maxLength = 200;
      const row = el("div", "row");
      const go = el("button", "go", "켜기"); go.type = "submit";
      const msg = el("div", "teach-msg");
      row.append(go);
      form.append(inp, row, msg);
      teachBox.appendChild(form);
      inp.focus();
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        teachKey = inp.value;
        go.disabled = true;
        try {
          const j = await teachCall("/teach/check");
          store.set("teachKey", teachKey);
          setOwner(true);
          teachState.textContent = "· 가르친 대화 " + j.count + "개";
          renderTeach();
        } catch (err) {
          teachKey = "";
          msg.className = "teach-msg bad";
          msg.textContent = err.message;
        } finally {
          go.disabled = false;
        }
      });
      return;
    }
    teachBox.append(el("h3", "", "관리자 모드 · 가르치기"),
      el("p", "", "AI 답 아래 '고치기'로 더 좋은 답을 가르치거나, 여기서 새 대화를 가르칠 수 있습니다. 한 번 주고받은 대화는 사이트 AI가 같은 말에 바로 그 답을 하고, 모두 다음 학습에 들어갑니다. 중요도가 높을수록 학습에 여러 번 들어가며, 똑같거나 80% 넘게 비슷한 대화가 있으면 저장 전에 알려 드립니다. 개인정보는 넣지 마세요."));
    // 주고받기 칸들: '+ 이어서'를 누르면 한 번 더 주고받는 칸이 붙어서 이어지는 대화로 가르친다 (최대 MAX_EX번)
    const MAX_EX = 6;
    const pairsBox = el("div", "pairs");
    const pairs = [];
    function addPair() {
      const n = pairs.length + 1;
      const wrap = el("div", "pair");
      const q = el("textarea"); q.maxLength = 200;
      const a = el("textarea"); a.maxLength = 200;
      q.placeholder = n === 1 ? "예: 나 요즘 수영 배워" : "앞 이야기에 이어지는 말 (예: 오늘 25미터 갔어)";
      a.placeholder = n === 1 ? "예: 수영 좋죠! 배운 지 얼마나 됐어요?" : "앞 이야기를 이어받는 답 (예: 처음 수영으로 25미터라니 대단해요!)";
      wrap.append(el("label", "f", n === 1 ? "사용자 말" : "사용자 말 " + n), q, el("label", "f", n === 1 ? "쿼리봇 답" : "쿼리봇 답 " + n), a);
      pairsBox.appendChild(wrap);
      pairs.push({ wrap, q, a });
      paintPairs();
      if (n > 1) q.focus();
    }
    function paintPairs() {
      plus.disabled = pairs.length >= MAX_EX;
      plus.textContent = pairs.length >= MAX_EX ? "최대 " + MAX_EX + "번까지" : "+ 이어서 한 번 더 주고받기";
      minus.hidden = pairs.length <= 1;
    }
    const plus = el("button", "sub", ""); plus.type = "button";
    const minus = el("button", "sub", "− 마지막 주고받기 빼기"); minus.type = "button";
    plus.addEventListener("click", addPair);
    minus.addEventListener("click", () => { const p = pairs.pop(); if (p) p.wrap.remove(); paintPairs(); });
    const plusRow = el("div", "row");
    plusRow.append(plus, minus);
    const row = el("div", "row");
    const ctxLabel = el("label");
    const ctxBox = el("input"); ctxBox.type = "checkbox";
    ctxLabel.append(ctxBox, document.createTextNode("지금 대화의 바로 앞 주고받기도 맨 앞에 같이"));
    const go = el("button", "go", "가르치기"); go.type = "button";
    const listBtn = el("button", "sub", "가르친 대화 보기"); listBtn.type = "button";
    const wp = weightPicker(3);
    const msg = el("div", "teach-msg");
    const list = el("div", "teach-list"); list.hidden = true;
    const row2 = el("div", "row");
    row2.append(wp.el, ctxLabel);
    const offBtn = el("button", "sub", "관리자 모드 끄기"); offBtn.type = "button";
    offBtn.addEventListener("click", () => { setOwner(false); teachKey = ""; store.set("teachKey", ""); closeModal(); });
    row.append(go, listBtn, offBtn);
    teachBox.append(pairsBox, plusRow, row2, row, msg, list);
    addPair();
    go.addEventListener("click", async () => {
      const msgs = [];
      for (const p of pairs) {
        const uq = p.q.value.trim(), ua = p.a.value.trim();
        if (!uq || !ua) { msg.className = "teach-msg bad"; msg.textContent = "모든 칸에 사용자 말과 쿼리봇 답을 적어 주세요(빈 칸은 '− 마지막 주고받기 빼기'로 뺄 수 있습니다)."; return; }
        msgs.push({ role: "user", content: uq }, { role: "assistant", content: ua });
      }
      let ctx = ctxBox.checked ? hist().slice(-2) : [];
      if (ctx.length / 2 + pairs.length > MAX_EX) ctx = [];
      if (await saveTeach(ctx.concat(msgs), msg, go, wp.get())) {
        while (pairs.length > 1) pairs.pop().wrap.remove();
        pairs[0].q.value = ""; pairs[0].a.value = "";
        paintPairs();
        ctxBox.checked = false;
        if (!list.hidden) loadList(list, msg);
      }
    });
    listBtn.addEventListener("click", () => { list.hidden = !list.hidden; if (!list.hidden) loadList(list, msg); });
  }

  async function loadList(list, msg) {
    list.textContent = "불러오는 중…";
    try {
      const [j, st] = await Promise.all([teachCall("/teach/list"), siteTaught(false)]);
      list.innerHTML = "";
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
      // 반영 상태 요약: 사이트 서버가 마지막으로 받아 간 때, 학습이 마지막으로 가져간 때
      list.appendChild(el("div", "sync-line",
        (st ? "사이트 서버: " + st.count + "개 쓰는 중 (" + (st.updated || "아직 못 받음").slice(5, 16) + " 받음)" : "사이트 서버: 확인 못 함(쉬고 있을 수 있습니다)")
        + " · 학습: " + (j.last_export ? j.last_export.slice(5, 16) + "에 마지막으로 가져감" : "아직 안 가져감")));
      if (!j.items.length) { list.appendChild(el("div", "", "아직 가르친 대화가 없습니다.")); return; }
      for (const it of j.items) {
        const row = el("div", "teach-item");
        const d = el("div");
        it.messages.forEach((m, i) => {
          if (i) d.appendChild(document.createElement("br"));
          d.append(el("b", "", m.role === "user" ? "사용자: " : "쿼리봇: "), document.createTextNode(m.content));
        });
        // 실제 서버에 들어갔는지
        const badges = el("div", "badges");
        if (it.messages.length !== 2) badges.appendChild(el("span", "bdg no", "이어지는 대화 · 학습에만 사용"));
        else if (onSite(st, it.messages)) badges.appendChild(el("span", "bdg ok", "✓ 사이트 서버 반영됨"));

  // 답 속 코드(```언어 … ```)는 따로 코드 상자로, `짧은 코드`는 알약 모양으로 (2026-11-09 사용자: "코드는 따로 뜨게")
  // 한 글자씩 써지는 중이라 아직 안 닫힌 ```도 상자로 보여 준다. 글은 전부 textContent로만 넣는다(HTML로 해석 안 함).
  function addInline(node, s) {
    s.split(/`([^`\n]+)`/).forEach((x, i) => {
      if (!x) return;
      node.appendChild(i % 2 ? el("code", "inl", x) : document.createTextNode(x));
    });
  }
  function codeBox(lng, code) {
    const box = el("div", "code"), head = el("div", "code-head"), b = el("button", "", t("copy"));
    b.type = "button";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code); b.textContent = t("copied"); setTimeout(() => (b.textContent = t("copy")), 1500); } catch (e) {}
    });
    head.append(el("span", "", lng || (lang() === "en" ? "code" : "코드")), b);
    const pre = document.createElement("pre");
    pre.appendChild(el("code", "", code));
    box.append(head, pre);
    return box;
  }
  function renderRich(node, text) {
    node.textContent = "";
    if (text.indexOf("`") < 0) { node.textContent = text; return; }
    const re = /```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      let seg = text.slice(last, m.index);
      if (last) seg = seg.replace(/^\n+/, "");
      addInline(node, seg.replace(/\s+$/, ""));
      node.appendChild(codeBox(m[1].trim(), m[2].replace(/\n$/, "")));
      last = re.lastIndex;
    }
    addInline(node, last ? text.slice(last).replace(/^\n+/, "") : text);
  }

  // 수식($...$, $$...$$, \( \), \[ \])을 KaTeX로 그린다. KaTeX가 아직 안 불러졌으면 페이지 load 때 한꺼번에.
  function renderMath(node) {
    if (!node || !window.renderMathInElement || !/\$|\\\(|\\\[/.test(node.textContent)) return;
    try {
      renderMathInElement(node, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    } catch (e) {}
  }
  window.addEventListener("load", () => document.querySelectorAll(".qa-log .text").forEach(renderMath));

  function fillModels(list) {

    // 서버가 잠들어 있을 때도 목록이 바로 보이게 이 브라우저에 기억 (2026-11-09: 폰에서 기본 모델 하나만 보이던 문제)
    store.set("models", JSON.stringify(list.map((m) => ({ key: m.key, label: m.label }))));

  // =========================================================
  // 그림·파일 첨부 (Gemma 4만, 2026-11-09 사용자 요청) — 그림은 줄여서 data URL로, 파일은 글자만 뽑아서 보낸다. 서버에 저장하지 않음
  // =========================================================
  const ATT_MAX_IMG = 4, ATT_MAX_FILE = 3, ATT_MAX_CHARS = 30000;
  const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|xml|ya?ml|log|py|js|mjs|ts|jsx|tsx|html?|css|java|c|cc|cpp|h|hpp|cs|go|rs|kt|swift|rb|php|sh|bat|ps1|sql|ini|toml|srt|vtt|tex)$/i;
  var atts = [];  // {type:"image", name, url} | {type:"file", name, text, pdf}  (var: 모델 표시가 먼저 불러도 오류 없게)
  const canAttach = () => modelSel.value === "gemma4";
  function paintAttach() {
    const ok = canAttach();
    $("attachBtn").hidden = !ok;
    $("thinkBtn").hidden = !ok;
    $("locBtn").hidden = !ok || $("locBtn").getAttribute("aria-pressed") !== "true";  // 위치는 + 메뉴에서 켜고, 켜져 있을 때만 알약(누르면 끔)
    $("form").classList.toggle("can-attach", ok);
    if (!ok && atts && atts.length) atts = [];
    paintAtts();
  }
  function paintAtts() {
    const box = $("atts");
    box.innerHTML = "";
    box.hidden = !(atts && atts.length);
    (atts || []).forEach((a, i) => {
      const chip = el("div", a.type === "image" ? "att img" : "att file");
      if (a.type === "image") {
        const im = document.createElement("img");
        im.src = a.url; im.alt = a.name;
        chip.appendChild(im);
        chip.title = a.name;
      } else {
        chip.append(el("span", "ic", a.pdf ? "PDF" : "TXT"), el("span", "nm", a.name));
        chip.title = a.name + " · " + a.text.length.toLocaleString() + "자" + (a.cut ? " (일부만)" : "");
      }
      const x = el("button", "x", "×");
      x.type = "button";
      x.setAttribute("aria-label", "첨부 빼기");
      x.addEventListener("click", () => { atts.splice(i, 1); paintAtts(); input.focus(); });
      chip.appendChild(x);
      box.appendChild(chip);
    });
  }
  let noteTimer = 0;
  function attNote(msg) {
    let n = document.querySelector(".att-note");
    if (!n) { n = el("div", "att-note"); $("atts").before(n); }
    n.textContent = msg;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => n.remove(), 4500);
  }
  function shrinkImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * s));
        c.height = Math.max(1, Math.round(img.naturalHeight * s));
        const g = c.getContext("2d");
        g.fillStyle = "#fff";  // 투명 PNG는 흰 바탕으로
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
      img.src = url;
    });
  }
  // PDF는 pdf.js(cdnjs, 무결성 확인)를 처음 쓸 때만 불러서 글자만 뽑는다 (스캔한 그림 PDF는 글자가 없음)
  let pdfjs = null;
  function loadPdfJs() {
    if (pdfjs) return pdfjs;
    pdfjs = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.integrity = "sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e";
      s.crossOrigin = "anonymous";
      s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
      s.onerror = () => { pdfjs = null; rej(new Error("pdfjs")); };
      document.head.appendChild(s);
    });
    return pdfjs;
  }
  async function pdfText(file) {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = "";
    for (let n = 1; n <= doc.numPages && out.length < ATT_MAX_CHARS; n++) {
      const tc = await (await doc.getPage(n)).getTextContent();
      out += tc.items.map((x) => x.str + (x.hasEOL ? "\n" : "")).join("") + "\n\n";
    }
    return out;
  }
  async function addFiles(list) {
    if (!canAttach()) { attNote("그림·파일 첨부는 Gemma 4 모델에서만 할 수 있습니다."); return; }
    for (const f of list) {
      try {
        if (/^image\//.test(f.type)) {
          if (atts.filter((a) => a.type === "image").length >= ATT_MAX_IMG) { attNote("그림은 한 번에 4장까지 올릴 수 있습니다."); continue; }
          if (f.size > 20e6) { attNote("그림이 너무 큽니다 (20MB까지)."); continue; }
          atts.push({ type: "image", name: f.name || "그림", url: await shrinkImage(f) });
        } else {
          if (atts.filter((a) => a.type === "file").length >= ATT_MAX_FILE) { attNote("파일은 한 번에 3개까지 올릴 수 있습니다."); continue; }
          const pdf = /\.pdf$/i.test(f.name) || f.type === "application/pdf";
          if (!pdf && !TEXT_EXT.test(f.name) && !/^text\//.test(f.type)) { attNote("‘" + f.name + "’은 읽을 수 없는 형식입니다. 그림, PDF, 글자 파일(txt·md·csv·코드 등)만 올릴 수 있습니다."); continue; }
          if (f.size > 15e6) { attNote("파일이 너무 큽니다 (15MB까지)."); continue; }
          let text = (pdf ? await pdfText(f) : await f.text()).replace(/\u0000/g, "").trim();
          if (!text) { attNote(pdf ? "이 PDF에서 글자를 찾지 못했습니다 (스캔한 그림 PDF는 읽을 수 없습니다)." : "빈 파일입니다."); continue; }
          const room = ATT_MAX_CHARS - atts.reduce((n, a) => n + (a.text ? a.text.length : 0), 0);
          if (room <= 0) { attNote("파일 글자 수 한도(3만 자)를 넘었습니다."); continue; }
          const cut = text.length > room;
          if (cut) { text = text.slice(0, room); attNote("‘" + f.name + "’은 길어서 앞부분 " + room.toLocaleString() + "자만 보냅니다."); }
          atts.push({ type: "file", name: f.name, text, pdf, cut });
        }
      } catch (e) {
        attNote("‘" + (f.name || "파일") + "’을 읽지 못했습니다.");
      }
      paintAtts();
    }
  }
  // + 단추: 바로 파일 창을 열지 않고 작은 메뉴 (2026-11-10 사용자: "파일 업로드랑 위치를 저기다 넣자. 채팅창 간소화")
  const plusMenu = $("plusMenu");
  function closePlus() { plusMenu.hidden = true; $("attachBtn").setAttribute("aria-expanded", "false"); }
  $("attachBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!plusMenu.hidden) { closePlus(); return; }
    closeModels();
    plusMenu.hidden = false;
    $("attachBtn").setAttribute("aria-expanded", "true");
    $("plusFile").focus();
  });
  $("plusFile").addEventListener("click", () => { closePlus(); $("attachFile").click(); });
  $("plusLoc").addEventListener("click", () => { closePlus(); $("locBtn").click(); input.focus(); });
  document.addEventListener("click", (e) => { if (!plusMenu.hidden && !e.target.closest("#plusMenu,#attachBtn")) closePlus(); });
  plusMenu.addEventListener("keydown", (e) => {
    const items = [...plusMenu.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); closePlus(); $("attachBtn").focus(); }
  });
  $("attachFile").addEventListener("change", (e) => { const fs = [...e.target.files]; e.target.value = ""; addFiles(fs); });
  input.addEventListener("paste", (e) => {
    const fs = [...((e.clipboardData && e.clipboardData.files) || [])];
    if (!fs.length) return;
    e.preventDefault();
    addFiles(fs);
  });
  // 끌어 놓기: 채팅 칸 어디에 놓아도 (파일을 놓았을 때 브라우저가 그 파일로 넘어가 버리지 않게 항상 막는다)
  const chatArea = document.querySelector(".qa-chat");
  // 첫 화면(인사말)에서만 뒤쪽 하늘빛 — 대화가 시작되면 서서히 사라짐
  const paintGlow = () => chatArea.classList.toggle("chatting", !log.querySelector(".qa-hello"));
  new MutationObserver(paintGlow).observe(log, { childList: true });
  paintGlow();
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  chatArea.addEventListener("dragover", (e) => { if (!hasFiles(e)) return; e.preventDefault(); if (canAttach()) $("form").classList.add("drop"); });
  chatArea.addEventListener("dragleave", (e) => { if (!chatArea.contains(e.relatedTarget)) $("form").classList.remove("drop"); });
  chatArea.addEventListener("drop", (e) => {
    $("form").classList.remove("drop");
    if (!hasFiles(e)) return;
    e.preventDefault();
    addFiles([...e.dataTransfer.files]);

  }
  // 연필: 그 자리에서 고치고 보내면, 그 말 앞까지의 대화로 다시 답을 받는다. 고치기 전 대화는 버전으로 남김
  function startEdit(node, i) {
    if (busy || !cur) return;
    const m = cur.messages[i];
    if (!m || m.role !== "user") return;
    const bar = node.nextElementSibling && node.nextElementSibling.classList.contains("me-tools") ? node.nextElementSibling : null;
    const box = el("div", "me-edit");
    const ta = el("textarea");
    ta.value = m.content;
    ta.rows = 1;
    ta.setAttribute("aria-label", t("editQ"));
    const row = el("div", "row");
    const no = el("button", "", t("cancel")), go = el("button", "go", t("sendTip"));
    no.type = go.type = "button";
    row.append(no, go);
    box.append(ta, row);
    node.replaceWith(box);
    if (bar) bar.hidden = true;
    const fit = () => { ta.style.height = "auto"; ta.style.height = Math.min(320, ta.scrollHeight + 2) + "px"; };
    ta.addEventListener("input", fit);
    fit();
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    const cancel = () => { box.replaceWith(node); if (bar) bar.hidden = false; };
    no.addEventListener("click", cancel);
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { e.preventDefault(); cancel(); }
      else if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && (enterSends() || e.ctrlKey || e.metaKey)) { e.preventDefault(); go.click(); }
    });
    go.addEventListener("click", () => {
      const v = ta.value.trim();
      if (!v || busy || !cur) return;
      const head = cur.messages[i];
      const vers = Array.isArray(head.vers) ? head.vers.slice() : [null];
      const vi = typeof head.vi === "number" ? head.vi : 0;
      vers[vi] = [stripVer(head)].concat(cur.messages.slice(i + 1));  // 지금 버전(고치기 전)을 보관
      vers.push(null);  // 새 버전 자리 (답이 오면 record가 채움)
      const mdl = modelSel.value, g = mdl === "gemma4";
      const opts = { model: mdl, think: g && thinkOn, loc: g && locOn && myLoc ? myLoc : null, branch: { i, vers, vi: vers.length - 1 } };
      openConv(cur.id, i);  // 고친 말 앞까지만 보이게 (저장은 답이 온 뒤에 — 실패하면 예전 대화 그대로)
      if (modelSel.value !== mdl) { modelSel.value = mdl; paintModel(); }
      ask(v, [], opts);
    });
  }
  // ‹ › 버전 바꾸기: 지금 버전을 보관하고 고른 버전을 그 자리에
  function switchVer(i, k) {
    if (busy || !cur) return;
    const head = cur.messages[i];
    if (!head || !Array.isArray(head.vers) || k < 0 || k >= head.vers.length || k === head.vi || !head.vers[k]) return;
    const vers = head.vers.slice();
    vers[head.vi] = [stripVer(head)].concat(cur.messages.slice(i + 1));
    const tail = vers[k];
    vers[k] = null;
    cur.messages = cur.messages.slice(0, i).concat([Object.assign({}, tail[0], { vers, vi: k })], tail.slice(1));
    saveConvs();
    const mdl = modelSel.value;
    openConv(cur.id);
    if (modelSel.value !== mdl) { modelSel.value = mdl; paintModel(); }
    const n = log.querySelector('[data-mi="' + i + '"]');
    if (n) n.scrollIntoView({ block: "center" });
  }

  // ■ 멈추기 (2026-11-10 사용자: "ai가 답변 중 멈추기 기능"): 기다리는 동안·답이 써지는 동안 보내기 단추가 멈춤 단추로
  var stopper = null;
  function setStopper(fn) {
    stopper = fn;
    const on = !!fn;
    send.classList.toggle("stop", on);
    send.setAttribute("aria-label", t(on ? "stopTip" : "sendTip"));
    send.title = on ? t("stopTip") : "";
    send.querySelector(".ic-send").hidden = on;
    send.querySelector(".ic-stop").hidden = !on;
    if (on) send.disabled = false;
  }
  // 서버가 다시 켜질 때까지 /state를 3초마다 확인 (배포·재시작 중 끊긴 질문을 자동으로 다시 보내려고)
  async function waitServer(ms, sig) {
    const end = Date.now() + ms;
    while (Date.now() < end) {
      if (sig && sig.aborted) return false;
      try { const r = await fetch(API + "/state", { cache: "no-store" }); if (r.ok) return true; } catch (e) {}
      await new Promise((z) => setTimeout(z, 3000));
    }
    return false;
  }
  async function postChat(payload, ms, outer) {
    const c = new AbortController(), tm = setTimeout(() => c.abort(), ms);
    const onStop = () => c.abort();
    if (outer) { if (outer.aborted) c.abort(); else outer.addEventListener("abort", onStop, { once: true }); }
    try {
      return await fetch(API + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload, signal: c.signal });
    } finally { clearTimeout(tm); if (outer) outer.removeEventListener("abort", onStop); }
  }
  // 보내기 — 안에서 무슨 오류가 나도 '기다리는 중'에 갇히지 않게 감싼다 (2026-11-10 사용자: "내 답변이 화면에 오류라 안 떴던 거야")
  async function ask(text, sent, opts) {
    if (busy) return;
    try {
      await askInner(text, sent, opts);
    } catch (e) {
      console.error("보내기 오류", e);
      log.querySelectorAll(".turn .avatar.thinking").forEach((a) => a.closest(".turn").remove());
      const why = e && (e.name || "") + (e.message ? ": " + String(e.message).slice(0, 80) : "");
      addAlert((lang() === "en" ? "Something went wrong on this page" : "화면에서 오류가 났어요") + (why ? " (" + why + ")" : ""), false,
        () => ask(text, sent, opts));
    } finally {
      if (busy) { busy = false; send.disabled = false; $("form").classList.remove("busy"); setStopper(null); }
    }
  }
  async function askInner(text, sent, opts) {
    text = (text || "").trim();
    sent = sent || [];
    if (busy || (!text && !sent.length)) return;
    if (!text) text = t("attOnly");  // 그림만 올리고 말없이 보내면
    busy = true; send.disabled = true;
    const stopCtl = new AbortController(), reqStop = () => stopCtl.abort();
    setStopper(reqStop);
    $("form").classList.add("busy");  // 답 만드는 동안 입력칸 테두리에 그라데이션이 흐른다
    // 이번 질문의 설정 — [다시 시도]는 처음 보낼 때의 설정 그대로
    opts = opts || { model: modelSel.value, think: modelSel.value === "gemma4" && thinkOn, loc: modelSel.value === "gemma4" && locOn && myLoc ? myLoc : null };
    const asked = opts.model;
    const convAtAsk = cur;  // 기다리는 사이 다른 대화를 열면 답을 그 대화에 섞지 않으려고
    const ctx = mem.checked ? hist().slice(-2) : [];  // 가르치기('고치기')할 때 같이 저장할 바로 앞 주고받기
    // 앞 대화는 최근 2번 주고받은 것만: 작은 모델은 앞 대화가 길면 헷갈려서 이상한 답을 한다 (2026-10-21)
    // Gemma 4는 앞 대화 8개(4번 주고받기)·한 줄 1,000자까지 (2026-11-10 '기억 한도 늘려'), 기본 모델은 4개·400자
    let before = asked === "gemma4" ? hist(1000) : hist();
    if (opts.branch) before = before.slice(0, opts.branch.i);  // 질문 고치기: 고친 말 앞까지만
    before = asked === "gemma4" ? before.slice(-8) : before.slice(-4);
    const meNode = addMe(text, attMeta(sent), sent);
    const thinking = asked === "gemma4" && (opts.think || (THINK_ASK.test(text) && !THINK_OPINION.test(text)));
    const wait = addWaiting(thinking ? t("thinkingN") + " · 0" + t("sec") : sent.some((a) => a.type === "image") ? t("looking") : sent.length ? t("reading") : null);
    let tick = 0;
    if (thinking) {  // 실제로 생각하는 동안 초를 센다
      const t0 = Date.now(), lab = wait.querySelector(".think span:last-child");
      tick = setInterval(() => { lab.textContent = t("thinkingN") + " · " + Math.floor((Date.now() - t0) / 1000) + t("sec"); }, 1000);
    }
    // 생각하기는 1분 넘게 걸릴 수 있음. 아주 긴 글은 읽는 시간만큼 더 기다림(2천 자에 1초, 최대 +2분)
    const limit = (thinking ? 200000 : WAKE_TIMEOUT) + Math.min(120000, Math.round(text.length / 2));
    // 5초 넘게 걸리면: 서버가 깨어 있으면 검색·자료 읽는 중, 아니면 잠든 서버를 깨우는 중
    const slow = thinking ? 0 : setTimeout(() => { wait.querySelector(".turn-body").appendChild(el("div", "wait-note", t(online === true ? "working" : "waking"))); toBottom(); }, 5000);
    let err = null, warn = false;
    const payload = JSON.stringify({ message: text, model: asked, history: before,
      images: sent.filter((a) => a.type === "image").map((a) => a.url),
      files: sent.filter((a) => a.type === "file").map((a) => ({ name: a.name, text: a.text })),
      think: asked === "gemma4" && !!opts.think, memory: asked === "gemma4" ? memList() : [],
      style: asked === "gemma4" ? store.get("style") || "" : "", instructions: asked === "gemma4" ? (store.get("instr") || "").slice(0, 1500) : "",
      location: asked === "gemma4" ? opts.loc || null : null });
    try {
      let r = null;
      try { r = await postChat(payload, limit, stopCtl.signal); } catch (e) { if (e && e.name === "AbortError") throw e; }
      if (!r || [502, 503, 504].includes(r.status)) {
        // 연결이 끊김 = 서버가 다시 켜지는 중(배포·재시작)일 수 있다 → 알리고, 살아나면 같은 질문을 한 번 더 자동으로
        clearTimeout(slow);
        const body = wait.querySelector(".turn-body");
        if (body) { body.querySelectorAll(".wait-note").forEach((x) => x.remove()); body.appendChild(el("div", "wait-note", t("restarting"))); toBottom(); }
        if (await waitServer(90000, stopCtl.signal)) r = await postChat(payload, limit, stopCtl.signal);
        if (!r && stopCtl.signal.aborted) throw Object.assign(new Error("stopped"), { name: "AbortError" });
        if (!r) throw new Error("down");
      }
      if (r.status === 429) { let d = ""; try { d = (await r.json()).detail || ""; } catch (e) {} err = (asked === "gemma4" && d && lang() !== "en") ? d : t("busy"); warn = true; }
      else if ([404, 502, 503, 504].includes(r.status)) { err = t("down"); setOnline(false); }
      else if (r.status === 400) { let d = ""; try { d = (await r.json()).detail; } catch (e) {} err = typeof d === "string" && d && lang() !== "en" ? d : t("fail"); warn = true; }
      else if (!r.ok) { err = t("fail"); }
      else {
        const j = await r.json();
        const reply = j.reply || "";
        if (j.quota) setQuota(j.quota);
        wait.remove();
        const meta = { user: text, ctx };
        const kind = j.source ? "wiki" : j.taught ? "taught" : "ai";
        try {
          if (j.source) addWikiReply(reply, j.source, meta); else addAiReply(reply, meta, kind, true, j.sources, j.thought);
        } catch (e) {  // 그리기 오류여도 답은 보이게: 빈 말풍선이 있으면 거기에, 없으면 새로
          console.error("답 그리기 오류", e);
          const last = log.lastElementChild, tx = last && last.classList.contains("turn") ? last.querySelector(".text") : null;
          if (tx && !tx.textContent) { tx.classList.remove("typing"); tx.textContent = reply; }
          else { const sh = turnShell("ai"); sh.body.appendChild(el("div", "text", reply)); put(sh.turn); }
        }
        if (Array.isArray(j.remember) && j.remember.length) {  // 쿼리봇이 기억하기로 한 것 → 이 브라우저에 저장하고 답 아래에 표시
          const added = memAdd(j.remember);
          const body = log.lastElementChild && log.lastElementChild.querySelector(".turn-body");
          if (body && added.length) body.appendChild(el("div", "mem-note", "💾 기억함 · " + added.join(" · ")));
        }
        setOnline(true);
        if (cur === convAtAsk) {  // 기다리는 사이 다른 대화를 열었으면 섞지 않는다 (모델만 바꾼 건 같은 대화)
          record(text, reply, kind, j.source, { att: attMeta(sent), sources: j.sources, thought: j.thought, branch: opts.branch });
          meTools(meNode, cur.messages.length - 2);  // 이제 저장됐으니 말풍선 아래 복사·고치기
          if (asked === "gemma4") nameConv(cur);  // 제목은 답과 따로 (기다리는 시간을 늘리지 않게)
        }
      }
    } catch (e) {
      if (stopCtl.signal.aborted) err = null;  // ■ 멈춤을 눌렀음
      else if (e && e.name === "AbortError") err = t("fail");
      else { err = t("down"); setOnline(false); }
    }
    clearTimeout(slow);
    clearInterval(tick);
    if (stopCtl.signal.aborted && wait.isConnected) { wait.remove(); addSys(t("stopped")); }
    if (stopper === reqStop) setStopper(null);
    if (err) {
      wait.remove();
      // [다시 시도]: 실패한 내 말풍선을 지우고 처음과 같은 설정·첨부로 다시 보낸다
      addAlert(err, warn, () => { if (meNode) meNode.remove(); ask(text, sent, opts); });
    }
    busy = false; send.disabled = false; $("form").classList.remove("busy"); input.focus();
  }

  // 입력창: Enter로 보내고 Shift+Enter는 줄 바꿈. 한글 조합 중 Enter는 무시(글자가 끊겨 보내지는 것 막기). 내용에 맞춰 높이가 늘어남.
  function fitInput() {
    input.style.height = "";  // CSS 기본 높이로 돌린 뒤, 글이 넘칠 때만 늘린다
    if (input.scrollHeight > input.clientHeight + 1) input.style.height = Math.min(160, input.scrollHeight + 2) + "px";
  }
  input.addEventListener("input", fitInput);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && (enterSends() || e.ctrlKey || e.metaKey)) {  // 설정에서 끄면 Ctrl+Enter
      e.preventDefault();
      $("form").requestSubmit();
    }
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (stopper && e.submitter === send) { stopper(); return; }  // ■ 멈춤 단추 (Enter로는 멈추지 않음)
    const text = input.value.trim();
    if ((!text && !atts.length) || busy) return;
    const sent = atts;
    atts = [];
    paintAtts();
    input.value = "";
    fitInput();
    ask(text, sent);
  });
  // 모델을 바꾸면 다른 모델이 앞 대화를 이어받지 않게 새 대화로 시작한다.
  modelSel.addEventListener("change", () => {
    store.set("model", modelSel.value);
    setQuota();
    // 모델을 바꿔도 같은 대화에서 이어서 (예전: 새 대화 + '모델을 바꿨습니다' 안내 — 2026-11-10 사용자: "자동으로 새 대화 넘어가지 않게")
  });
  mem.addEventListener("change", () => { store.set("mem", mem.checked ? "1" : "0"); $("mem2").checked = mem.checked; });
  // 폰: '앞 대화 기억'은 서랍 안 스위치로 (위쪽 체크와 같은 값)
  $("mem2").checked = mem.checked;
  $("mem2").addEventListener("change", () => { mem.checked = $("mem2").checked; mem.dispatchEvent(new Event("change")); });
  $("newTop").addEventListener("click", newChat);

  function applyPlaceholder() { input.placeholder = input.dataset["ph" + (lang() === "en" ? "En" : "Ko")]; }
  // 언어를 바꾸면 안내 문구·대화 목록도 그 언어로
  new MutationObserver(() => { applyPlaceholder(); renderList(); if (log.querySelector(".qa-hello")) showHello(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  document.addEventListener("DOMContentLoaded", () => {
    applyPlaceholder();
    showHello();
    renderList();
    paintFoot();
    paintMem();
    let saved = null;
    try { saved = JSON.parse(store.get("models") || "null"); } catch (e) {}
    fillModels(Array.isArray(saved) && saved.length ? saved : DEFAULT_MODELS);
    checkHealth();
    resumeOwner();
  });
  // 주기적으로 확인하지 않는다 (확인 요청이 서버를 계속 깨워 무료 사용 시간을 쓰지 않게).
  // 탭으로 돌아왔을 때만 2분에 한 번 확인하고, 평소 상태는 /chat 응답으로 갱신된다.
  let lastCheck = 0;
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastCheck > 120000) { lastCheck = Date.now(); checkHealth(); }
  });
})();
</script>
</body>
