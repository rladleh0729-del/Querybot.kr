<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://querybot.kr/ai/">
<meta name="description" content="QueryBot AI — 직접 학습시킨 작은 한국어 AI와 대화하기">
<title>QueryBot AI</title>
<link rel="icon" href="/ai/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ai/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .ai-main{padding:48px 0 64px}
  .ai-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .ai-head h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.04em;margin:6px 0 0;line-height:1.1}
  .ai-status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted);background:var(--panel)}
  .ai-status i{width:9px;height:9px;border-radius:50%;background:var(--idle)}
  .ai-status.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(30,138,82,.18)}
  .ai-status.off i{background:var(--danger)}
  .ai-note{color:var(--muted);font-size:14px;margin:0 0 18px}
  .ai-box{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--card-a),var(--card-b));box-shadow:var(--shadow-sm);display:flex;flex-direction:column;height:min(66vh,620px);overflow:hidden}
  .ai-log{flex:1;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}

  /* 내 말: 오른쪽 말풍선 */
  .me{align-self:flex-end;max-width:78%;padding:10px 15px;border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 4px 12px rgba(204,68,52,.18);white-space:pre-wrap;word-break:break-word}

  /* 쿼리봇 답: 말풍선 없이 아이콘 + 이름 + 글 (대화형 AI 화면처럼) */
  .turn{display:flex;gap:12px;align-items:flex-start;max-width:88%;animation:rise .25s ease-out}
  .avatar{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(204,68,52,.25)}
  .avatar.wiki{background:#ffffff;color:var(--text);border:1px solid var(--line2);font-family:Georgia,"Times New Roman",serif;font-size:17px;box-shadow:0 1px 3px rgba(92,58,34,.08)}
  .turn-body{min-width:0;flex:1}
  .who{font-size:13px;font-weight:700;color:var(--text2);margin:5px 0 6px;display:flex;align-items:center;gap:8px}
  .who-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
  .text{line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .text.typing::after{content:"";display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;background:var(--accent);animation:blink .9s steps(2) infinite}
  .tools{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .15s}
  .turn:hover .tools,.turn:focus-within .tools{opacity:1}
  .tools button{border:1px solid transparent;background:none;color:var(--muted);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
  .tools button:hover{border-color:var(--line);color:var(--text);background:var(--hover)}

  /* 위키백과 검색 답: 출처 카드 */
  .src{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(160deg,#ffffff,#fbf5ee);overflow:hidden}
  .src-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel2)}
  .src-top svg{flex:none}
  .src-title{padding:12px 14px 2px;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .src-text{padding:4px 14px 12px;line-height:1.7;color:var(--text2);word-break:break-word}
  .src-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--accent-ink);text-decoration:none}
  .src-link:hover{background:var(--hover)}
  .src-link small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 기다리는 중: 점 세 개 */
  .dots{display:inline-flex;gap:5px;padding:8px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  .wait-note{font-size:13px;color:var(--muted);margin-top:2px}

  /* 오류·알림 */
  .alert{align-self:flex-start;display:flex;gap:10px;align-items:flex-start;max-width:88%;padding:10px 14px;border-radius:12px;border:1px solid #f2b8bd;background:#fff1f1;color:#9b1c2c;font-size:14px}
  .alert.warn{border-color:#f1d29a;background:#fff6e5;color:#7a4a00}
  .sys{align-self:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel)}

  /* 주인이 가르친 답: 초록 표시 */
  .avatar.taught{background:linear-gradient(135deg,#1e8a52,#2f9e6a);box-shadow:0 4px 14px rgba(30,138,82,.25)}
  .who-tag.taught{color:#145c37;background:#e3f5ea;border-color:#a8dcbc}

  /* 가르치기 모드 (주인만) */
  .fix{display:none}
  body.owner .fix{display:inline-block}
  .teach-toggle{margin:18px 0 0;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .teach-toggle button{border:0;background:none;color:var(--accent-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  .teach{margin-top:12px;border:1px solid var(--line2);border-radius:16px;background:var(--panel);box-shadow:var(--shadow-sm);padding:16px 18px}
  .teach h3{margin:0 0 4px;font-size:16px;color:var(--text)}
  .teach p{margin:0 0 10px;font-size:13px;color:var(--muted)}
  .teach label.f{display:block;font-size:13px;font-weight:700;color:var(--text2);margin:10px 0 4px}
  .teach input[type=password],.teach textarea,.edit textarea{width:100%;border:1px solid var(--field-line);background:var(--field);border-radius:10px;padding:9px 12px;color:var(--text);font:inherit;font-size:14px}
  .teach textarea,.edit textarea{min-height:60px;resize:vertical}
  .teach input:focus,.teach textarea:focus,.edit textarea:focus{outline:2px solid var(--focus);border-color:var(--accent)}
  .teach .row,.edit .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .teach .row label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text2);cursor:pointer}
  .teach .row input[type=checkbox]{accent-color:var(--accent)}
  .go{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:800;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer}
  .go:disabled{opacity:.6;cursor:default}
  .sub{border:1px solid var(--field-line);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;background:var(--field);color:var(--text2);cursor:pointer}
  .teach-msg{font-size:13px;margin-top:8px;color:#145c37}
  .teach-msg.bad{color:#9b1c2c}
  .teach-list{margin-top:12px;border-top:1px solid var(--line);padding-top:6px;max-height:280px;overflow:auto}
  .teach-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--text2)}
  .teach-item div{flex:1;min-width:0;word-break:break-word}
  .teach-item b{color:var(--accent-ink)}
  .edit{margin-top:8px;border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel2)}
  .edit .lbl{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px}
  .wpick{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--text2);flex-wrap:wrap}
  .wpick b{font-weight:700;margin-right:2px}
  .wpick button{width:28px;height:28px;border-radius:8px;border:1px solid var(--field-line);background:var(--field);color:var(--text2);font:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:0}
  .wpick button[aria-pressed=true]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent}
  .wpick small{color:var(--muted);margin-left:4px}
  .similar{margin-top:8px;border:1px solid #f1d29a;background:#fff6e5;border-radius:12px;padding:10px 12px;font-size:13px;color:#5c3a00}
  .similar .it{margin:6px 0;padding:6px 8px;border-radius:8px;background:#fffdf7;border:1px solid #f3e2bd;word-break:break-word}
  .similar .row{margin-top:8px}
  .teach-item select{border:1px solid var(--field-line);border-radius:8px;background:var(--field);color:var(--text2);font:inherit;font-size:12px;height:28px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .bdg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
  .bdg.ok{color:#145c37;background:#e3f5ea;border-color:#a8dcbc}
  .bdg.wait{color:#7a4a00;background:#fff6e5;border-color:#f1d29a}
  .bdg.no{color:var(--muted);background:var(--panel2);border-color:var(--line)}
  .sync-line{font-size:12px;color:var(--muted);margin:2px 0 6px}
  .pair+.pair{margin-top:10px;padding-top:6px;border-top:1px dashed var(--line2)}
  .sub:disabled{opacity:.6;cursor:default}

  .ai-form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--panel2)}
  .ai-form input{flex:1;min-width:0;height:48px;border:1px solid var(--field-line);background:var(--field);border-radius:12px;padding:0 14px;color:var(--text);font:inherit}
  .ai-form input:focus{outline:2px solid var(--focus);border-color:var(--accent)}
  .ai-form input::placeholder{color:var(--muted);opacity:1}
  .ai-form button{min-width:84px;cursor:pointer;color:var(--on-accent)}
  .ai-form button:disabled{opacity:1;background:var(--line2);color:var(--text2);box-shadow:none;cursor:default}
  .ai-opts{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin:0 0 12px;font-size:14px;color:var(--muted)}
  .ai-opts label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .ai-opts select{height:36px;border:1px solid var(--field-line);background:var(--field);color:var(--text);border-radius:10px;padding:0 10px;font:inherit;font-size:14px;max-width:100%}
  .ai-opts input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
  .ai-opts button{margin-left:auto;border:1px solid var(--field-line);background:var(--field);color:var(--text2);border-radius:10px;height:36px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
  .ai-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  .ai-chips button{border:1px solid var(--field-line);background:var(--field);color:var(--text2);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
  .ai-chips button:hover{border-color:var(--accent);color:var(--text)}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.7}30%{transform:translateY(-5px);opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.turn,.dots i,.text.typing::after{animation:none}}
  @media (max-width:640px){.navlinks{display:none}.me{max-width:88%}.turn,.alert{max-width:100%}.ai-box{height:70vh}.ai-log{padding:18px 14px}.tools{opacity:1}}
</style>
</head>
<body>
<header class="nav"><div class="wrap navin"><a class="brand" href="/">Query<b>Bot</b> AI</a><nav class="navlinks"><a href="/" data-ko="홈" data-en="Home"></a><a href="/games/" data-ko="게임" data-en="Games"></a></nav><button class="lang">EN</button></div></header>
<main class="ai-main"><div class="wrap">
  <div class="ai-head">
    <div>
      <div class="eyebrow">QUERYBOT AI · EXPERIMENT</div>
      <h1 data-ko="직접 키운 작은 한국어 AI" data-en="A small Korean AI, trained from scratch"></h1>
    </div>
    <div id="status" class="ai-status"><i></i><span data-ko="연결 확인 중" data-en="Checking"></span></div>
  </div>
  <p class="ai-note" data-ko="무료 서버에서 돌아가는 실험용 모델이라 엉뚱한 답을 할 때가 많습니다. 지식 질문은 위키백과에서 찾아 출처와 함께 보여 줍니다. 한동안 아무도 안 쓰면 서버가 잠들어서 첫 답은 1분쯤 걸릴 수 있습니다. 입력한 글은 저장하지 않습니다." data-en="An experimental model on a free server, so its answers are often off. Knowledge questions are looked up on Korean Wikipedia and shown with the source. The server sleeps when idle, so the first answer can take about a minute. Messages are not stored."></p>
  <div class="ai-opts">
    <label><span data-ko="모델" data-en="Model"></span>
      <select id="model"><option value="latest" data-ko="최신 모델" data-en="Latest model">최신 모델</option></select>
    </label>
    <label title="켜면 앞에서 나눈 대화를 기억하고 이어서 답합니다"><input id="mem" type="checkbox" checked><span data-ko="이전 대화 기억" data-en="Remember chat"></span></label>
    <button id="clear" type="button" data-ko="대화 지우기" data-en="Clear chat"></button>
  </div>
  <div class="ai-box">
    <div id="log" class="ai-log" aria-live="polite"></div>
    <form id="form" class="ai-form" autocomplete="off">
      <input id="input" maxlength="200" data-ph-ko="하고 싶은 말을 입력" data-ph-en="Type a message (Korean works best)">
      <button id="send" class="btn primary" type="submit" data-ko="보내기" data-en="Send"></button>
    </form>
  </div>
  <div class="ai-chips" id="chips">
    <button type="button">오늘 너무 피곤하다</button>
    <button type="button">배고파</button>
    <button type="button">좋아하는 사람이 생겼어</button>
    <button type="button">이순신은 누구야?</button>
    <button type="button">심심해</button>
  </div>
  <div class="teach-toggle"><button id="teachToggle" type="button">가르치기 모드</button><span id="teachState"></span></div>
  <div id="teach" class="teach" hidden></div>
</div></main>
<footer class="footer"><div class="wrap footin"><div class="brand">QueryBot</div><a href="/" data-ko="홈" data-en="Home">홈</a><div>© 2026 QueryBot. All rights reserved.</div></div></footer>
<script src="/assets/app.js"></script>
<script>
(() => {
  const API = "https://querybot-ai.onrender.com";
  // 무료 서버는 한동안 안 쓰면 잠들고, 깨어나는 데 50초 넘게 걸리기도 한다 → 넉넉히 기다린다.
  const WAKE_TIMEOUT = 90000;
  const T = {
    ko: { on: "연결됨 · 답변 가능", off: "연결 안 됨 · 잠시 후 다시", wake: "서버 깨우는 중 · 최대 1분", hello: "안녕하세요! 무엇이든 말을 걸어 보세요.", switched: "모델을 바꿨어요. 새 대화를 시작해요.", cleared: "대화를 지웠어요.", waking: "서버를 깨우는 중이에요… 첫 답은 1분쯤 걸릴 수 있어요.", down: "지금은 서버에 연결할 수 없어요. 잠시 후 다시 해 주세요.", busy: "질문이 너무 많아요. 잠시 후 다시 해 주세요.", fail: "답을 받지 못했어요. 잠시 후 다시 해 주세요.", copy: "복사", copied: "복사됨", wikiTag: "위키백과 검색", wikiOpen: "위키백과에서 보기", aiTag: "AI 답변", taughtTag: "가르친 답" },
    en: { on: "Connected · ready", off: "Unavailable · try later", wake: "Waking server · up to 1 min", hello: "Hi! Say anything (Korean works best).", switched: "Model changed. Starting a new chat.", cleared: "Chat cleared.", waking: "Waking the server… the first answer can take about a minute.", down: "Can't reach the server right now. Please try again later.", busy: "Too many messages. Please wait a moment.", fail: "No answer received. Please try again.", copy: "Copy", copied: "Copied", wikiTag: "Wikipedia search", wikiOpen: "Open on Wikipedia", aiTag: "AI answer", taughtTag: "Taught answer" }
  };
  const lang = () => (document.documentElement.lang === "en" ? "en" : "ko");
  const t = (k) => T[lang()][k];
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send"), status = $("status");
  const modelSel = $("model"), mem = $("mem");
  let online = null, busy = false;
  let history = [];  // 이전 대화 기억용. 서버는 저장하지 않고, 이 페이지가 들고 있다가 매번 같이 보낸다.
  // 서버가 알려 주는 모델 이름(한국어)의 영어 이름
  const MODEL_EN = { latest: "Latest model", stage3: "Stage 3 model", v1: "First model (13.8M)" };
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 고른 모델·기억 설정은 이 브라우저에만 기억해 둔다 (못 쓰는 환경이면 그냥 넘어감)
  const store = {
    get(k) { try { return localStorage.getItem("qbAi." + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("qbAi." + k, v); } catch (e) {} }
  };
  if (store.get("mem") === "0") mem.checked = false;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function put(node) {
    log.appendChild(node);
    log.scrollTop = log.scrollHeight;
    return node;
  }
  const addMe = (text) => put(el("div", "me", text));
  const addSys = (text) => put(el("div", "sys", text));
  function addAlert(text, warn) {
    const a = el("div", "alert" + (warn ? " warn" : ""));
    a.append(el("span", "", warn ? "⏳" : "⚠"), el("span", "", text));
    return put(a);
  }

  // 쿼리봇 차례 한 칸: 아이콘 + 이름 + 내용. kind = "ai" | "wiki" | "taught"(주인이 가르친 답)
  function turnShell(kind) {
    const turn = el("div", "turn");
    const av = el("div", "avatar" + (kind === "wiki" ? " wiki" : kind === "taught" ? " taught" : ""), kind === "wiki" ? "W" : "Q");
    av.setAttribute("aria-hidden", "true");
    const body = el("div", "turn-body");
    const who = el("div", "who", "QueryBot");
    who.appendChild(el("span", "who-tag" + (kind === "taught" ? " taught" : ""), kind === "wiki" ? t("wikiTag") : kind === "taught" ? t("taughtTag") : t("aiTag")));
    body.appendChild(who);
    turn.append(av, body);
    return { turn, body };
  }

  function addWaiting() {
    const { turn, body } = turnShell("ai");
    body.querySelector(".who-tag").remove();
    const d = el("div", "dots");
    d.append(el("i"), el("i"), el("i"));
    body.appendChild(d);
    return put(turn);
  }

  // 답 아래 도구: 복사 + (가르치기 모드일 때만 보이는) 고치기. meta = {user, ctx}: 이 답을 부른 질문과 그 앞 대화
  function copyTool(getText, meta, body) {
    const tools = el("div", "tools");
    const b = el("button", "", t("copy"));
    b.type = "button";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(getText()); b.textContent = t("copied"); setTimeout(() => (b.textContent = t("copy")), 1500); } catch (e) {}
    });
    tools.appendChild(b);
    if (meta && body) {
      const f = el("button", "fix", "고치기");
      f.type = "button";
      f.title = "더 좋은 답을 직접 가르치기 (주인만)";
      f.addEventListener("click", () => openEdit(body, meta, getText()));
      tools.appendChild(f);
    }
    return tools;
  }

  // 모델 답: 한 글자씩 써지듯 보여 준다 (실제로는 다 받은 뒤 보여 주는 것)
  function addAiReply(text, meta, kind) {
    const { turn, body } = turnShell(kind || "ai");
    const p = el("div", "text");
    body.append(p, copyTool(() => text, meta, body));
    put(turn);
    if (reduceMotion) { p.textContent = text; return; }
    p.classList.add("typing");
    const chars = [...text];
    let i = 0;
    const step = () => {
      i = Math.min(chars.length, i + 2);
      p.textContent = chars.slice(0, i).join("");
      log.scrollTop = log.scrollHeight;
      if (i < chars.length) setTimeout(step, 22); else p.classList.remove("typing");
    };
    step();
  }

  // 위키백과 답: 서버 글 "위키백과에서 찾아봤어요. <요약>\n(출처: 위키백과 「제목」)"을 나눠 출처 카드로
  function addWikiReply(text, url, meta) {
    const m = text.match(/\(출처:\s*위키백과\s*「([^」]+)」\)\s*$/);
    const title = m ? m[1] : "";
    const summary = text.replace(/\(출처:[^)]*\)\s*$/, "").replace(/^위키백과에서 찾아봤어요\.\s*/, "").trim();
    const { turn, body } = turnShell("wiki");
    const card = el("div", "src");
    const top = el("div", "src-top");
    top.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
    top.appendChild(el("span", "", lang() === "en" ? "Found on Korean Wikipedia" : "위키백과에서 찾았어요"));
    card.appendChild(top);
    if (title) card.appendChild(el("div", "src-title", title));
    card.appendChild(el("div", "src-text", summary));
    let safe = "";
    try { const u = new URL(url); if (u.protocol === "https:" && /(^|\.)wikipedia\.org$/.test(u.hostname)) safe = u.href; } catch (e) {}
    if (safe) {
      const a = el("a", "src-link");
      a.href = safe; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.append(el("span", "", t("wikiOpen") + " ↗"), el("small", "", "ko.wikipedia.org"));
      card.appendChild(a);
    }
    body.append(card, copyTool(() => summary + (title ? "\n(출처: 위키백과 「" + title + "」)" : ""), meta, body));
    put(turn);
  }

  // =========================================================
  // 가르치기 모드 (주인만). 가르친 대화는 PC 답변 서버에 저장 → 같은 말엔 몇 분 안에 사이트 AI가 그 답을 하고,
  // 모두 다음 학습 라운드에 들어간다. 키는 PC에서 '가르치기키만들기.bat'로 정하고, 이 브라우저에만 기억한다.
  // =========================================================
  const TEACH_API = "https://poem-defog-septum.ngrok-free.dev";
  const TEACH_HEADERS = { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" };
  const teachBox = $("teach"), teachState = $("teachState");
  let teachKey = store.get("teachKey") || "";
  let owner = false;

  async function teachCall(path, body) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    let r;
    try {
      r = await fetch(TEACH_API + path, { method: "POST", headers: TEACH_HEADERS, body: JSON.stringify(Object.assign({ key: teachKey }, body || {})), signal: ctrl.signal });
    } catch (e) {
      throw new Error("PC 답변 서버에 연결할 수 없어요. 가르치기는 PC가 켜져 있을 때만 돼요.");
    } finally {
      clearTimeout(timer);
    }
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (r.status === 401) { setOwner(false); teachKey = ""; store.set("teachKey", ""); }
    if (!r.ok) throw new Error(j.detail || ("오류 " + r.status));
    return j;
  }

  // 쿼리봇은 해요체로 말하도록 배우는 중 → 반말 답이면 한 번 물어본다
  const POLITE_END = /(요|죠|니다|니까)$/, INTERJ = /^(와|우와|헉|어머|아이고|저런|오|앗|네|음|아하|에구|아니요)$/;
  const politeOk = (s) => s.split(/(?<=[.!?])\s+/).every((x) => { const c = x.replace(/[^가-힣A-Za-z0-9]+$/, ""); return !c || POLITE_END.test(c) || INTERJ.test(c); });

  // 중요도 1~5: 학습 데이터에 넣는 횟수 (PC 서버 teach_store.WEIGHT_REPEAT와 같게)
  const REPEAT = { 1: 2, 2: 4, 3: 6, 4: 10, 5: 15 };
  function weightPicker(initial) {
    let w = initial || 3;
    const box = el("span", "wpick");
    box.appendChild(el("b", "", "중요도"));
    const hint = el("small");
    const btns = [1, 2, 3, 4, 5].map((n) => {
      const b = el("button", "", String(n));
      b.type = "button";
      b.title = "학습에 " + REPEAT[n] + "번 넣어요";
      b.addEventListener("click", () => { w = n; paint(); });
      box.appendChild(b);
      return b;
    });
    box.appendChild(hint);
    function paint() {
      btns.forEach((b, i) => b.setAttribute("aria-pressed", String(i + 1 === w)));
      hint.textContent = "학습에 " + REPEAT[w] + "번";
    }
    paint();
    return { el: box, get: () => w };
  }

  const fmtDialog = (msgs) => msgs.map((m) => (m.role === "user" ? "사용자: " : "쿼리봇: ") + m.content).join(" / ");

  // 사이트 서버(Render)가 지금 쓰는 가르친 대화 — '사이트 반영됨' 표시용. 비교는 서버와 같은 방식(띄어쓰기·문장 부호 무시)
  const tnorm = (s) => s.replace(/[\s.,!?~…ㅠㅜ"'()\[\]{}:;·\-]+/g, "").toLowerCase();
  async function siteTaught(refresh) {
    try {
      if (refresh) await fetch(API + "/taught/refresh", { method: "POST" });
      const r = await fetch(API + "/taught", { cache: "no-store" });
      if (!r.ok) return null;
      const j = await r.json();
      j.map = new Map(j.items.map((it) => [it.q, it.a]));
      return j;
    } catch (e) { return null; }
  }
  const onSite = (st, msgs) => !!st && msgs.length === 2 && st.map.get(tnorm(msgs[0].content)) === msgs[1].content;

  // 가르친 직후: 사이트 서버가 바로 받아 가게 하고, 반영됐는지 메시지에 덧붙인다
  async function syncSite(messages, msgEl) {
    if (messages.length !== 2) return;
    const st = await siteTaught(true);
    if (!msgEl.isConnected) return;
    msgEl.textContent += onSite(st, messages) ? " · ✓ 사이트 서버에 반영됨" : " · 사이트 서버 반영 대기(서버가 잠들어 있으면 깨어날 때 받아 가요)";
  }

  // 가르치기 저장. 서버가 '똑같거나 80% 이상 비슷한 가르침이 있다'고 하면 저장하지 않고 주인에게 고르게 한다.
  async function saveTeach(messages, msgEl, btn, weight, opts) {
    const answer = messages[messages.length - 1].content;
    if (!(opts && opts.mode) && !politeOk(answer) && !confirm("쿼리봇은 해요체(~요)로 말하도록 배우고 있어요. 그래도 이 답으로 가르칠까요?")) return false;
    const old = msgEl.parentNode.querySelector(".similar");
    if (old) old.remove();
    if (btn) btn.disabled = true;
    try {
      const j = await teachCall("/teach", Object.assign({ messages, weight: weight || 3, mode: "check" }, opts || {}));
      if (!j.ok && j.similar) return await askSimilar(j.similar, messages, msgEl, btn, weight);
      msgEl.className = "teach-msg";
      msgEl.textContent = (messages.length === 2 ? "가르쳤어요! 사이트 AI가 같은 말에 이 답을 하고, " : "가르쳤어요! 이어지는 대화라서 ")
        + "다음 학습 라운드에 " + REPEAT[weight || 3] + "번 들어가요. (모두 " + j.count + "개)";
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
      syncSite(messages, msgEl);
      return true;
    } catch (e) {
      msgEl.className = "teach-msg bad";
      msgEl.textContent = e.message;
      return false;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // 비슷한 가르침이 있을 때: 기존 것 바꾸기 / 따로 저장 / (완전히 같으면) 중요도만 바꾸기 / 취소
  function askSimilar(similar, messages, msgEl, btn, weight) {
    return new Promise((resolve) => {
      msgEl.textContent = "";
      const box = el("div", "similar");
      const same = similar.find((s) => s.same);
      box.appendChild(el("div", "", same ? "완전히 같은 대화를 이미 가르쳤어요." : "비슷한 대화를 이미 가르쳤어요. 어떻게 할까요?"));
      for (const s of similar.slice(0, 3)) {
        box.appendChild(el("div", "it", (s.same ? "같음" : "비슷함 " + s.score + "%") + " · 중요도 " + s.weight + " — " + fmtDialog(s.messages)));
      }
      const row = el("div", "row");
      const done = (v) => { box.remove(); resolve(v); };
      const mk = (label, cls, fn) => { const b = el("button", cls, label); b.type = "button"; b.addEventListener("click", fn); row.appendChild(b); };
      if (same) {
        if (same.weight !== (weight || 3)) {
          mk("중요도만 " + (weight || 3) + "(으)로 바꾸기", "go", async () => {
            try {
              await teachCall("/teach/weight", { id: same.id, weight: weight || 3 });
              msgEl.className = "teach-msg"; msgEl.textContent = "중요도를 바꿨어요. 다음 학습 라운드부터 " + REPEAT[weight || 3] + "번 들어가요.";
              done(true);
            } catch (e) { msgEl.className = "teach-msg bad"; msgEl.textContent = e.message; done(false); }
          });
        }
      } else {
        mk("이걸로 바꾸기", "go", async () => { box.remove(); resolve(await saveTeach(messages, msgEl, btn, weight, { mode: "replace", replace_id: similar[0].id })); });
        mk("따로 저장", "sub", async () => { box.remove(); resolve(await saveTeach(messages, msgEl, btn, weight, { mode: "new" })); });
      }
      mk("취소", "sub", () => { msgEl.className = "teach-msg"; msgEl.textContent = "저장하지 않았어요."; done(false); });
      box.appendChild(row);
      msgEl.parentNode.insertBefore(box, msgEl.nextSibling);
    });
  }

  // AI 답 아래 '고치기': 더 좋은 답을 적어서 가르친다 (질문과 그 앞 대화는 자동으로 같이)
  function openEdit(body, meta, current) {
    const old = body.querySelector(".edit");
    if (old) { old.remove(); return; }
    const box = el("div", "edit");
    box.appendChild(el("div", "lbl", "\"" + meta.user + "\"에 대한 더 좋은 답" + (meta.ctx.length ? " (앞 대화도 같이 가르쳐요)" : "")));
    const ta = el("textarea");
    ta.maxLength = 200;
    ta.value = current.replace(/\n?\(출처:[^)]*\)\s*$/, "").trim().slice(0, 200);
    const row = el("div", "row");
    const go = el("button", "go", "가르치기"); go.type = "button";
    const no = el("button", "sub", "취소"); no.type = "button";
    const wp = weightPicker(3);
    const msg = el("div", "teach-msg");
    row.append(go, no, wp.el);
    box.append(ta, row, msg);
    body.appendChild(box);
    ta.focus();
    no.addEventListener("click", () => box.remove());
    go.addEventListener("click", async () => {
      const a = ta.value.trim();
      if (!a) { msg.className = "teach-msg bad"; msg.textContent = "답을 적어 주세요."; return; }
      const ok = await saveTeach(meta.ctx.concat([{ role: "user", content: meta.user }, { role: "assistant", content: a }]), msg, go, wp.get());
      if (ok) setTimeout(() => box.remove(), 3000);
    });
  }

  function setOwner(v) {
    owner = v;
    document.body.classList.toggle("owner", v);
    $("teachToggle").textContent = v ? "가르치기 모드 끄기" : "가르치기 모드";
    if (!v) teachState.textContent = "";
  }

  function renderTeach() {
    teachBox.innerHTML = "";
    teachBox.hidden = false;
    if (!owner) {
      teachBox.append(el("h3", "", "가르치기 모드 (주인만)"),
        el("p", "", "PC에서 '가르치기키만들기.bat'로 정한 키를 넣어 주세요. 키는 이 브라우저에만 저장돼요."));
      const form = el("form");
      const inp = el("input"); inp.type = "password"; inp.autocomplete = "current-password"; inp.placeholder = "가르치기 키"; inp.maxLength = 200;
      const row = el("div", "row");
      const go = el("button", "go", "켜기"); go.type = "submit";
      const msg = el("div", "teach-msg");
      row.append(go);
      form.append(inp, row, msg);
      teachBox.appendChild(form);
      inp.focus();
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        teachKey = inp.value;
        go.disabled = true;
        try {
          const j = await teachCall("/teach/check");
          store.set("teachKey", teachKey);
          setOwner(true);
          teachState.textContent = "· 가르친 대화 " + j.count + "개";
          renderTeach();
        } catch (err) {
          teachKey = "";
          msg.className = "teach-msg bad";
          msg.textContent = err.message;
        } finally {
          go.disabled = false;
        }
      });
      return;
    }
    teachBox.append(el("h3", "", "가르치기 모드 켜짐"),
      el("p", "", "AI 답 아래 '고치기'로 더 좋은 답을 가르치거나, 여기서 새 대화를 가르쳐요. 한 번 주고받은 대화는 몇 분 안에 사이트 AI가 같은 말에 바로 그 답을 하고, 모두 다음 학습에 들어가요. 중요도가 높을수록 학습에 여러 번 넣고, 똑같거나 80% 넘게 비슷한 대화가 있으면 저장 전에 알려 드려요. 개인정보는 넣지 마세요."));
    // 주고받기 칸들: '+ 이어서'를 누르면 한 번 더 주고받는 칸이 붙어서 이어지는 대화로 가르친다 (최대 MAX_EX번)
    const MAX_EX = 6;
    const pairsBox = el("div", "pairs");
    const pairs = [];
    function addPair() {
      const n = pairs.length + 1;
      const wrap = el("div", "pair");
      const q = el("textarea"); q.maxLength = 200;
      const a = el("textarea"); a.maxLength = 200;
      q.placeholder = n === 1 ? "예: 나 요즘 수영 배워" : "앞 이야기에 이어지는 말 (예: 오늘 25미터 갔어)";
      a.placeholder = n === 1 ? "예: 수영 좋죠! 배운 지 얼마나 됐어요?" : "앞 이야기를 이어받는 답 (예: 처음 수영으로 25미터라니 대단해요!)";
      wrap.append(el("label", "f", n === 1 ? "사용자 말" : "사용자 말 " + n), q, el("label", "f", n === 1 ? "쿼리봇 답" : "쿼리봇 답 " + n), a);
      pairsBox.appendChild(wrap);
      pairs.push({ wrap, q, a });
      paintPairs();
      if (n > 1) q.focus();
    }
    function paintPairs() {
      plus.disabled = pairs.length >= MAX_EX;
      plus.textContent = pairs.length >= MAX_EX ? "최대 " + MAX_EX + "번까지" : "+ 이어서 한 번 더 주고받기";
      minus.hidden = pairs.length <= 1;
    }
    const plus = el("button", "sub", ""); plus.type = "button";
    const minus = el("button", "sub", "− 마지막 주고받기 빼기"); minus.type = "button";
    plus.addEventListener("click", addPair);
    minus.addEventListener("click", () => { const p = pairs.pop(); if (p) p.wrap.remove(); paintPairs(); });
    const plusRow = el("div", "row");
    plusRow.append(plus, minus);
    const row = el("div", "row");
    const ctxLabel = el("label");
    const ctxBox = el("input"); ctxBox.type = "checkbox";
    ctxLabel.append(ctxBox, document.createTextNode("지금 대화의 바로 앞 주고받기도 맨 앞에 같이"));
    const go = el("button", "go", "가르치기"); go.type = "button";
    const listBtn = el("button", "sub", "가르친 대화 보기"); listBtn.type = "button";
    const wp = weightPicker(3);
    const msg = el("div", "teach-msg");
    const list = el("div", "teach-list"); list.hidden = true;
    const row2 = el("div", "row");
    row2.append(wp.el, ctxLabel);
    row.append(go, listBtn);
    teachBox.append(pairsBox, plusRow, row2, row, msg, list);
    addPair();
    go.addEventListener("click", async () => {
      const msgs = [];
      for (const p of pairs) {
        const uq = p.q.value.trim(), ua = p.a.value.trim();
        if (!uq || !ua) { msg.className = "teach-msg bad"; msg.textContent = "모든 칸에 사용자 말과 쿼리봇 답을 적어 주세요(빈 칸은 '− 마지막 주고받기 빼기'로 빼요)."; return; }
        msgs.push({ role: "user", content: uq }, { role: "assistant", content: ua });
      }
      let ctx = ctxBox.checked ? history.slice(-2) : [];
      if (ctx.length / 2 + pairs.length > MAX_EX) ctx = [];
      if (await saveTeach(ctx.concat(msgs), msg, go, wp.get())) {
        while (pairs.length > 1) pairs.pop().wrap.remove();
        pairs[0].q.value = ""; pairs[0].a.value = "";
        paintPairs();
        ctxBox.checked = false;
        if (!list.hidden) loadList(list, msg);
      }
    });
    listBtn.addEventListener("click", () => { list.hidden = !list.hidden; if (!list.hidden) loadList(list, msg); });
  }

  async function loadList(list, msg) {
    list.textContent = "불러오는 중…";
    try {
      const [j, st] = await Promise.all([teachCall("/teach/list"), siteTaught(false)]);
      list.innerHTML = "";
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
      // 반영 상태 요약: 사이트 서버가 마지막으로 받아 간 때, 학습이 마지막으로 가져간 때
      list.appendChild(el("div", "sync-line",
        (st ? "사이트 서버: " + st.count + "개 쓰는 중 (" + (st.updated || "아직 못 받음").slice(5, 16) + " 받음)" : "사이트 서버: 확인 못 함(잠들어 있을 수 있어요)")
        + " · 학습: " + (j.last_export ? j.last_export.slice(5, 16) + "에 마지막으로 가져감" : "아직 안 가져감")));
      if (!j.items.length) { list.appendChild(el("div", "", "아직 가르친 대화가 없어요.")); return; }
      for (const it of j.items) {
        const row = el("div", "teach-item");
        const d = el("div");
        it.messages.forEach((m, i) => {
          if (i) d.appendChild(document.createElement("br"));
          d.append(el("b", "", m.role === "user" ? "사용자: " : "쿼리봇: "), document.createTextNode(m.content));
        });
        // 실제 서버에 들어갔는지
        const badges = el("div", "badges");
        if (it.messages.length !== 2) badges.appendChild(el("span", "bdg no", "이어지는 대화 · 학습에만 쓰여요"));
        else if (onSite(st, it.messages)) badges.appendChild(el("span", "bdg ok", "✓ 사이트 서버 반영됨"));
        else badges.appendChild(el("span", "bdg wait", st ? "⏳ 사이트 서버 반영 대기" : "사이트 서버 확인 못 함"));
        if (j.last_export && it.at && it.at <= j.last_export) badges.appendChild(el("span", "bdg ok", "✓ 학습 데이터에 들어감"));
        else badges.appendChild(el("span", "bdg wait", "⏳ 다음 학습 라운드에 들어가요"));
        d.appendChild(badges);
        // 중요도 바꾸기 (학습에 넣는 횟수)
        const sel = el("select");
        sel.title = "중요도 (학습에 넣는 횟수)";
        for (const n of [1, 2, 3, 4, 5]) {
          const o = el("option", "", "중요도 " + n + " · " + REPEAT[n] + "번");
          o.value = String(n);
          sel.appendChild(o);
        }
        sel.value = String(it.weight || 3);
        sel.addEventListener("change", async () => {
          try { await teachCall("/teach/weight", { id: it.id, weight: Number(sel.value) }); msg.className = "teach-msg"; msg.textContent = "중요도를 바꿨어요."; }
          catch (e) { msg.className = "teach-msg bad"; msg.textContent = e.message; sel.value = String(it.weight || 3); }
        });
        const del = el("button", "sub", "삭제"); del.type = "button";
        del.addEventListener("click", async () => {
          if (!confirm("이 가르침을 지울까요?")) return;
          try { await teachCall("/teach/delete", { id: it.id }); row.remove(); siteTaught(true); } catch (e) { msg.className = "teach-msg bad"; msg.textContent = e.message; }
        });
        row.append(d, sel, del);
        list.appendChild(row);
      }
    } catch (e) {
      list.textContent = "";
      msg.className = "teach-msg bad";
      msg.textContent = e.message;
    }
  }

  $("teachToggle").addEventListener("click", () => {
    if (!teachBox.hidden) {  // 펼쳐져 있으면: 켜진 상태면 끄고, 키 입력 중이면 접기
      if (owner) setOwner(false);
      teachBox.hidden = true;
      return;
    }
    renderTeach();  // 접혀 있으면 펼친다 (켜져 있으면 가르치기 칸, 아니면 키 입력 칸)
  });
  // 전에 키를 넣어 둔 브라우저면 조용히 다시 확인해서 켜고, 가르치기 칸도 바로 펼친다
  // (예전엔 켜지기만 하고 칸이 접혀 있어서 '끄기'만 보여 껐다 켜야 했음)
  async function resumeOwner() {
    if (!teachKey) return;
    try {
      const j = await teachCall("/teach/check");
      setOwner(true);
      renderTeach();
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
    } catch (e) {}
  }

  function setStatus(key) {
    status.className = "ai-status " + (key === "on" ? "on" : "off");
    const span = status.querySelector("span");
    span.dataset.ko = T.ko[key];
    span.dataset.en = T.en[key];
    span.textContent = t(key);
  }

  function setOnline(v) {
    online = v;
    setStatus(v ? "on" : "off");
  }

  async function checkHealth() {
    // 바로 대답이 없으면 잠든 서버를 깨우는 중이라고 보여 준다.
    const slow = setTimeout(() => { if (online !== true) setStatus("wake"); }, 3000);
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), WAKE_TIMEOUT);
      const r = await fetch(API + "/state", { signal: ctrl.signal });
      clearTimeout(timer);
      setOnline(r.ok);
      if (r.ok) fillModels((await r.json()).models);
    } catch (e) {
      setOnline(false);
    }
    clearTimeout(slow);
  }

  function fillModels(list) {
    if (!Array.isArray(list) || !list.length) return;
    const want = store.get("model") || modelSel.value;
    modelSel.innerHTML = "";
    for (const m of list) {
      const o = document.createElement("option");
      o.value = m.key;
      o.dataset.ko = m.label;
      o.dataset.en = MODEL_EN[m.key] || m.label;
      o.textContent = lang() === "en" ? o.dataset.en : o.dataset.ko;
      modelSel.appendChild(o);
    }
    if (list.some((m) => m.key === want)) modelSel.value = want;
  }

  function resetChat(key) {
    history = [];
    addSys(t(key));
  }

  async function ask(text) {
    if (busy || !text) return;
    busy = true; send.disabled = true;
    addMe(text);
    const wait = addWaiting();
    const asked = modelSel.value;
    const ctx = mem.checked ? history.slice(-2) : [];  // 가르치기('고치기')할 때 같이 저장할 바로 앞 주고받기
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), WAKE_TIMEOUT);
    const slow = setTimeout(() => { wait.querySelector(".turn-body").appendChild(el("div", "wait-note", t("waking"))); log.scrollTop = log.scrollHeight; }, 5000);
    let err = null, warn = false;
    try {
      const r = await fetch(API + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // 앞 대화는 최근 2번 주고받은 것만: 작은 모델은 앞 대화가 길면 헷갈려서 이상한 답을 한다 (2026-10-21)
        body: JSON.stringify({ message: text, model: asked, history: mem.checked ? history.slice(-4) : [] }),
        signal: ctrl.signal
      });
      if (r.status === 429) { err = t("busy"); warn = true; }
      else if ([404, 502, 503, 504].includes(r.status)) { err = t("down"); setOnline(false); }
      else if (!r.ok) { err = t("fail"); }
      else {
        const j = await r.json();
        const reply = j.reply || "";
        wait.remove();
        const meta = { user: text, ctx };
        if (j.source) addWikiReply(reply, j.source, meta); else addAiReply(reply, meta, j.taught ? "taught" : "ai");
        setOnline(true);
        if (modelSel.value === asked) {  // 기다리는 사이 모델을 바꿨으면 새 대화에 섞지 않는다
          history.push({ role: "user", content: text }, { role: "assistant", content: reply.slice(0, 400) });
          history = history.slice(-20);  // 최근 10번 주고받은 것까지만 (서버 한도와 같음)
        }
      }
    } catch (e) {
      err = t("down");
      setOnline(false);
    }
    clearTimeout(timer);
    clearTimeout(slow);
    if (err) { wait.remove(); addAlert(err, warn); }
    busy = false; send.disabled = false; input.focus();
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    input.value = "";
    ask(text);
  });
  document.querySelectorAll("#chips button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
  // 모델을 바꾸면 다른 모델이 앞 대화를 이어받지 않게 새 대화로 시작한다.
  modelSel.addEventListener("change", () => { store.set("model", modelSel.value); resetChat("switched"); });
  mem.addEventListener("change", () => { store.set("mem", mem.checked ? "1" : "0"); });
  $("clear").addEventListener("click", () => { log.innerHTML = ""; resetChat("cleared"); });

  function applyPlaceholder() { input.placeholder = input.dataset["ph" + (lang() === "en" ? "En" : "Ko")]; }
  new MutationObserver(applyPlaceholder).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  document.addEventListener("DOMContentLoaded", () => {
    applyPlaceholder();
    addSys(t("hello"));
    checkHealth();
    resumeOwner();
  });
  // 주기적으로 확인하지 않는다 (확인 요청이 서버를 계속 깨워 무료 사용 시간을 쓰지 않게).
  // 탭으로 돌아왔을 때만 2분에 한 번 확인하고, 평소 상태는 /chat 응답으로 갱신된다.
  let lastCheck = 0;
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastCheck > 120000) { lastCheck = Date.now(); checkHealth(); }
  });
})();
</script>
</body>
</html>
