  //  (사용자: '저런 거는 그냥 명령어로 코드를 짜면 순식간이지 않을까? 오랫동안 만들었는데도 137이야')
  //  상자: sandbox iframe(출처 없음 — 이 사이트 저장소·로그인 못 만짐) + CSP로 인터넷 막음 + 그 안 Worker에서 계산, 8초 넘으면 상자째 버림
  const GEN_RE = /^(?:gen|생성)\s*[:：]\s*(.+)$/i;
  const GEN_MAX = 5 * 1048576, genCache = new Map();
  function runGen(code) {
    if (genCache.has(code)) return genCache.get(code);
    const job = new Promise((resolve) => {
      const id = Math.random().toString(36).slice(2), fr = document.createElement("iframe");
      const worker = "try{const r=(function(){\n" + code + "\n})();const o=typeof r==='string'?r:Array.isArray(r)?r.join('\\n'):r&&typeof r==='object'?JSON.stringify(r,null,2):null;"
        + "postMessage(o==null?{err:'return 한 값이 글자가 아님('+typeof r+')'}:{out:o})}catch(e){postMessage({err:String(e&&e.message||e)})}";
      const js = "const send=(r)=>parent.postMessage(Object.assign({qbGen:" + JSON.stringify(id) + "},r),'*');"
        + "try{const w=new Worker(URL.createObjectURL(new Blob([" + JSON.stringify(worker) + "],{type:'text/javascript'})));"
        + "w.onmessage=(e)=>send(e.data);w.onerror=(e)=>{e.preventDefault();send({err:String(e.message||'error')})}}catch(e){send({err:String(e&&e.message||e)})}";
      fr.setAttribute("sandbox", "allow-scripts");

      fr.srcdoc = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\' blob:; worker-src blob:"><script>'
        + js.replace(/</g, "\\u003c") + "<\/script>";
      let tm = 0;
      const on = (e) => { if (e.source === fr.contentWindow && e.data && e.data.qbGen === id) done(e.data); };
      const done = (r) => { clearTimeout(tm); window.removeEventListener("message", on); fr.remove(); resolve(r || {}); };
      tm = setTimeout(() => { genCache.delete(code); done({ err: L("8초 안에 끝나지 않아 멈췄어요", "Stopped after 8 seconds") }); }, 8000);
      window.addEventListener("message", on);
      document.body.appendChild(fr);
    });
    genCache.set(code, job);
    return job;
  }
  function genCard(raw, code, closed) {
    const box = fileCard(raw, "", false);  // 만드는 동안은 '만드는 중…' 알약

      if (typeof r.out === "string" && r.out.length <= GEN_MAX) { box.replaceWith(fileCard(raw, r.out, true)); return; }
      const w = box.querySelector(".file-wait");
      if (w) w.textContent = L("만들지 못했어요", "Couldn't build") + (r.err ? " — " + String(r.err).slice(0, 80) : r.out ? " — " + L("5MB를 넘어요", "over 5MB") : "");
    });

  }
  // 92차: 퀴즈 카드 — 모델이 ```quiz {JSON} 을 쓰면 누르거나 답을 넣어 바로 채점 (정답은 화면에 안 보임)
  //  (사용자: '번호 선택해서 맞으면 O 틀리면 X 다시 생각해보세요 … 단답형으로 넣으면 맞음 틀림')
  const QUIZ_RE = /^(quiz|퀴즈)$/i;
  const quizNorm = (s) => String(s == null ? "" : s).replace(/\$|\\[,;!]/g, "").replace(/[\s,]/g, "").replace(/[.。]$/, "").toLowerCase();
  function quizNum(s) {
    const t = quizNorm(s), f = t.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    if (f && +f[2]) return +f[1] / +f[2];
    return /^-?\d+(?:\.\d+)?$/.test(t) ? +t : NaN;
  }
  function quizCard(raw, closed) {
    const box = el("div", "quiz-card");
    if (!closed) { box.appendChild(el("div", "quiz-wait", L("문제 만드는 중…", "Writing a question…"))); return box; }
    let d = null;
    // 93차: JSON 속 LaTeX 역슬래시(\frac가 폼피드, \times가 탭으로 읽힘)를 먼저 고침
    const fixed = raw.replace(/(?<!\\)\\(?=(?:d?frac|times|div|sqrt|cdot|cdots|ldots|dots|left|right|pm|mp|le|leq|ge|geq|neq|approx|infty|int|sum|prod|lim|log|ln|sin|cos|tan|alpha|beta|gamma|theta|pi|sigma|omega|text|mathrm|quad|binom|vec|overline|angle|triangle|circ|to|rightarrow|Rightarrow|cup|cap|in|subset)\b)/g, "\\\\");
    try { d = JSON.parse(fixed); } catch (e) { try { d = JSON.parse(raw); } catch (e2) {} }
    if (!d || typeof d.q !== "string") return codeBox("quiz", raw);
    const q = el("div", "quiz-q");
    renderRich(q, d.q);
    const fb = el("div", "quiz-fb");

    box.appendChild(q);
    if (Array.isArray(d.choices) && d.choices.length) {
      const list = el("div", "quiz-choices"), ans = Number(d.answer);
      d.choices.forEach((c, i) => {
        const b = el("button", "quiz-opt"), tx = el("span", "quiz-t");
        b.type = "button";
        renderRich(tx, String(c).replace(/^\s*(?:[①②③④⑤⑥⑦⑧⑨⑩]|\(?\d+[.)])\s*/, ""));

        b.addEventListener("click", () => {
          if (box.classList.contains("solved")) return;

    } else {
      const row = el("form", "quiz-row"), inp = document.createElement("input"), go = el("button", "quiz-go", L("확인", "Check"));
      inp.className = "quiz-in"; inp.placeholder = L("답", "Answer"); inp.autocomplete = "off"; go.type = "submit";
      const accept = [d.answer].concat(Array.isArray(d.accept) ? d.accept : []).filter((x) => x != null && String(x).trim());

  function codeBox(lng, code) {

  function renderRich(node, text) {

  // 수식($...$, $$...$$, \( \), \[ \])을 KaTeX로 그린다. KaTeX가 아직 안 불러졌으면 페이지 load 때 한꺼번에.
  // 91차: 지수 속 분수(25^{\frac{1}{3}})는 KaTeX가 아주 작게 그림 → 그 지수 묶음을 \textstyle로(분수 모양 그대로, 숫자 크게)
  function bigExpFrac(m) {
    if (m.indexOf("\\frac") < 0 || m.indexOf("^") < 0) return m;
    let out = "", i = 0;
    while (i < m.length) {
      if (m[i] === "^") {
        let j = i + 1;
        while (m[j] === " ") j++;
        if (m[j] === "{") {
          let depth = 0, k = j;
          for (; k < m.length; k++) { if (m[k] === "{") depth++; else if (m[k] === "}" && --depth === 0) break; }

  function shrinkImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * s));
        c.height = Math.max(1, Math.round(img.naturalHeight * s));
        const g = c.getContext("2d");
        g.fillStyle = "#fff";  // 투명 PNG는 흰 바탕으로
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
      img.src = url;
    });

  // PDF는 pdf.js(cdnjs, 무결성 확인)를 처음 쓸 때만 불러서 글자만 뽑는다 (스캔한 그림 PDF는 글자가 없음)
  let pdfjs = null;
  function loadPdfJs() {
    if (pdfjs) return pdfjs;
    pdfjs = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

      s.onerror = () => { pdfjs = null; rej(new Error("pdfjs")); };

    });

  }
  async function pdfText(file) {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = "";
    for (let n = 1; n <= doc.numPages && out.length < ATT_MAX_CHARS; n++) {
      const tc = await (await doc.getPage(n)).getTextContent();

  }
  async function addFiles(list) {

  // 95차: 첫 그림 전에 첫 화면부터 (메인에서 넘어올 때 제목·로고가 겹쳐 보이지 않게)
  // 102차: 새로고침(주소에 ?c=대화)이면 첫 화면을 거치지 않고 그 대화를 바로 → 입력창이 가운데서 내려가는 움직임 없음
  new MutationObserver(paintSend).observe($("atts"), { childList: true, subtree: true });  // 113차
  paintSend();
  const bootConv = new URLSearchParams(location.search).get("c");
  if (bootConv && convs.some((x) => x.id === bootConv)) openConv(bootConv);
  else showHello();
  document.addEventListener("DOMContentLoaded", () => {
    gdLoad();
    setTimeout(drainFeedback, 1500);
    applyPlaceholder();
    if (!cur && !log.querySelector(".qa-hello")) showHello();  // 95차: 위에서 이미 그렸으면 그대로, 102차: 대화를 이미 열었으면 첫 화면 안 그림
    renderList();
    paintFoot();
    paintMem();
    let saved = null;
    try { saved = JSON.parse(store.get("models") || "null"); } catch (e) {}
    fillModels(Array.isArray(saved) && saved.length ? saved : DEFAULT_MODELS);
    checkHealth();
    checkOwner();
    resumeOwner();
    paintMe();
    if (store.get("gdOn") === "1" && store.get("gdRt")) setTimeout(loadMe, 2500);
    const urlConv = new URLSearchParams(location.search).get("c");  // 새로고침: 주소의 대화를 다시 열기 (40차)
    if (urlConv) { if (convs.some((x) => x.id === urlConv)) openConv(urlConv); else setUrlConv(null); }
    const askQ = (new URLSearchParams(location.search).get("q") || "").trim();  // 94차: 메인 입력창에서 온 질문 → 새 대화로 바로 보냄
    if (askQ) {
      history.replaceState(null, "", location.pathname);
      if (cur) newChat();
      input.value = askQ.slice(0, 20000); fitInput();  // 95차: 첫 화면에 질문이 든 채로 잠깐 보여 준 뒤, 원래 '대화 시작' 움직임으로
      setTimeout(() => { helloPick = null; if (input.value.trim()) $("form").requestSubmit(); }, 1000);
    } else setTimeout(resumePending, 200);  // 답을 받기 전에 닫혔던 질문 이어 받기
  });
  // 주기적으로 확인하지 않는다 (확인 요청이 서버를 계속 깨워 무료 사용 시간을 쓰지 않게).
  // 탭으로 돌아왔을 때만 2분에 한 번 확인하고, 평소 상태는 /chat 응답으로 갱신된다.
  let lastCheck = 0;
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastCheck > 120000) { lastCheck = Date.now(); checkHealth(); }
  });
})();
</script>
<i id="qbReady" hidden></i>
<script>
/* 49차 (2026-11-14 사용자: "마우스 올려두면 필요없는 설명 나타내지 마"): 마우스를 올리면 뜨는 설명(title)을 모두 없앰.
   지금 있는 것과 나중에 코드가 붙이는 것 모두. 화면 읽기 프로그램용으로는 aria-label 로 옮김 */
(() => {
  const strip = (e, fresh) => {
    const v = e.getAttribute("title");
    if (v == null) return;
    if (v && (fresh || !e.hasAttribute("aria-label"))) e.setAttribute("aria-label", v);
    e.removeAttribute("title");
  };
  const scan = (n) => {
    if (n.nodeType !== 1) return;
    if (n.hasAttribute("title")) strip(n, false);
    n.querySelectorAll("[title]").forEach((e) => strip(e, false));
  };
  scan(document.body);
  new MutationObserver((ms) => {
    for (const m of ms) {
      if (m.type === "attributes") strip(m.target, true);
      else m.addedNodes.forEach(scan);
    }
  }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["title"] });
})();
</script>
