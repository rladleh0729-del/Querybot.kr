<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://querybot.kr/ai/">
<meta name="description" content="QueryBot AI — 직접 학습시킨 작은 한국어 AI와 대화하기">
<title>QueryBot AI</title>
<link rel="icon" href="/ai/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ai/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .ai-main{padding:48px 0 64px}
  .ai-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .ai-head h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.04em;margin:6px 0 0;line-height:1.1}
  .ai-status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted);background:#ffffff08}
  .ai-status i{width:9px;height:9px;border-radius:50%;background:#55627a}
  .ai-status.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .ai-status.off i{background:#ff6b7a}
  .ai-note{color:var(--muted);font-size:14px;margin:0 0 18px}
  .ai-box{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#101a2c,#0b1220);display:flex;flex-direction:column;height:min(62vh,560px);overflow:hidden}
  .ai-log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:80%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
  .msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:5px}
  .msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.sys{align-self:center;background:none;color:var(--muted);font-size:13px;padding:2px}
  .msg.wait{opacity:.6}
  .ai-form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#0a1220}
  .ai-form input{flex:1;min-width:0;height:48px;border:1px solid var(--line);background:#09111f;border-radius:12px;padding:0 14px;color:var(--text);font:inherit}
  .ai-form input:focus{outline:2px solid #62a8ff66;border-color:var(--accent)}
  .ai-form button{min-width:84px;cursor:pointer;color:#fff}
  .ai-form button:disabled{opacity:.45;cursor:default}
  .ai-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  .ai-chips button{border:1px solid var(--line);background:#ffffff08;color:#c6d0e2;border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
  @media (max-width:640px){.navlinks{display:none}.msg{max-width:90%}.ai-box{height:66vh}}
</style>
</head>
<body>
<header class="nav"><div class="wrap navin"><a class="brand" href="/">Query<b>Bot</b> AI</a><nav class="navlinks"><a href="/" data-ko="홈" data-en="Home"></a><a href="/games/" data-ko="게임" data-en="Games"></a></nav><button class="lang">EN</button></div></header>
<main class="ai-main"><div class="wrap">
  <div class="ai-head">
    <div>
      <div class="eyebrow">QUERYBOT AI · EXPERIMENT</div>
      <h1 data-ko="직접 키운 작은 한국어 AI" data-en="A small Korean AI, trained from scratch"></h1>
    </div>
    <div id="status" class="ai-status"><i></i><span data-ko="연결 확인 중" data-en="Checking"></span></div>
  </div>
  <p class="ai-note" data-ko="개인 PC에서 돌아가는 실험용 모델이라 PC가 켜져 있을 때만 답할 수 있고, 엉뚱한 답을 할 때가 많습니다. 입력한 글은 저장하지 않습니다." data-en="An experimental model running on a personal PC: it only answers while that PC is on, and its answers are often off. Messages are not stored."></p>
  <div class="ai-box">
    <div id="log" class="ai-log" aria-live="polite"></div>
    <form id="form" class="ai-form" autocomplete="off">
      <input id="input" maxlength="200" data-ph-ko="하고 싶은 말을 입력" data-ph-en="Type a message (Korean works best)">
      <button id="send" class="btn primary" type="submit" data-ko="보내기" data-en="Send"></button>
    </form>
  </div>
  <div class="ai-chips" id="chips">
    <button type="button">오늘 너무 피곤하다</button>
    <button type="button">배고파</button>
    <button type="button">좋아하는 사람이 생겼어</button>
    <button type="button">심심해</button>
  </div>
</div></main>
<footer class="footer"><div class="wrap footin"><div class="brand">QueryBot</div><a href="/" data-ko="홈" data-en="Home">홈</a><div>© 2026 QueryBot. All rights reserved.</div></div></footer>
<script src="/assets/app.js"></script>
<script>
(() => {
  const API = "https://poem-defog-septum.ngrok-free.dev";
  const HEADERS = { "ngrok-skip-browser-warning": "1" };
  const T = {
    ko: { on: "PC 켜짐 · 답변 가능", off: "PC 꺼짐 · 지금은 답변 불가", hello: "안녕하세요! 무엇이든 말을 걸어 보세요.", down: "지금은 PC가 꺼져 있어서 답할 수 없어요. 나중에 다시 와 주세요.", busy: "질문이 너무 많아요. 잠시 후 다시 해 주세요.", fail: "답을 받지 못했어요. 잠시 후 다시 해 주세요." },
    en: { on: "PC on · ready", off: "PC off · unavailable", hello: "Hi! Say anything (Korean works best).", down: "The PC is off right now, so I can't answer. Please come back later.", busy: "Too many messages. Please wait a moment.", fail: "No answer received. Please try again." }
  };
  const lang = () => (document.documentElement.lang === "en" ? "en" : "ko");
  const t = (k) => T[lang()][k];
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send"), status = $("status");
  let online = null, busy = false;

  function add(cls, text) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function setOnline(v) {
    online = v;
    status.className = "ai-status " + (v ? "on" : "off");
    const span = status.querySelector("span");
    span.dataset.ko = T.ko[v ? "on" : "off"];
    span.dataset.en = T.en[v ? "on" : "off"];
    span.textContent = t(v ? "on" : "off");
  }

  async function checkHealth() {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      const r = await fetch(API + "/health", { headers: HEADERS, signal: ctrl.signal });
      clearTimeout(timer);
      setOnline(r.ok);
    } catch (e) {
      setOnline(false);
    }
  }

  async function ask(text) {
    if (busy || !text) return;
    busy = true; send.disabled = true;
    add("me", text);
    const wait = add("bot wait", "···");
    try {
      const r = await fetch(API + "/chat", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, HEADERS),
        body: JSON.stringify({ message: text })
      });
      if (r.status === 429) { wait.textContent = t("busy"); }
      else if ([404, 502, 503, 504].includes(r.status)) { wait.textContent = t("down"); setOnline(false); }
      else if (!r.ok) { wait.textContent = t("fail"); }
      else { wait.textContent = (await r.json()).reply; setOnline(true); }
    } catch (e) {
      wait.textContent = t("down");
      setOnline(false);
    }
    wait.classList.remove("wait");
    busy = false; send.disabled = false; input.focus();
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    input.value = "";
    ask(text);
  });
  document.querySelectorAll("#chips button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));

  function applyPlaceholder() { input.placeholder = input.dataset["ph" + (lang() === "en" ? "En" : "Ko")]; }
  new MutationObserver(applyPlaceholder).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  document.addEventListener("DOMContentLoaded", () => {
    applyPlaceholder();
    add("sys", t("hello"));
    checkHealth();
    setInterval(checkHealth, 30000);
  });
})();
</script>
</body>
</html>
