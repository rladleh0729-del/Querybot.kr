<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://querybot.kr/ai/">
<meta name="description" content="QueryBot AI — 직접 학습시킨 작은 한국어 AI와 대화하기">
<title>QueryBot AI</title>
<link rel="icon" href="/ai/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ai/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* ===== 채팅 중심 화면 (2026-10-21): 화면 높이를 꽉 채우고, 입력창은 항상 맨 아래, 왼쪽은 이 기기에 저장된 대화 기록 ===== */
  html,body{height:100%}
  body.qa-page{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  body.qa-page .nav{position:relative;flex:none}
  .qa-app{flex:1;min-height:0;display:flex}

  /* 왼쪽: 대화 기록 */
  .qa-side{width:280px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(255,253,249,.72)}
  .qa-new{margin:14px 14px 6px;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:12px;border:1px solid var(--field-line);background:var(--field);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .qa-new:hover{border-color:var(--accent);color:var(--accent-ink)}
  .qa-list{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 10px}
  .qa-group{font-size:12px;font-weight:700;color:var(--muted);margin:12px 8px 4px}
  .qa-conv{display:flex;align-items:center;border-radius:10px}
  .qa-conv:hover{background:var(--hover)}
  .qa-conv.on{background:var(--accent-soft)}
  .qa-conv-open{flex:1;min-width:0;text-align:left;border:0;background:none;padding:9px 10px;font:inherit;font-size:14.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .qa-conv.on .qa-conv-open{color:var(--accent-ink);font-weight:700}
  .qa-conv-del{flex:none;border:0;background:none;color:var(--muted);font-size:16px;line-height:1;width:28px;height:28px;border-radius:8px;cursor:pointer;opacity:0}
  .qa-conv:hover .qa-conv-del,.qa-conv.on .qa-conv-del,.qa-conv-del:focus{opacity:1}
  .qa-conv-del:hover{background:var(--panel2);color:#9b1c2c}
  .qa-empty-list{font-size:13px;color:var(--muted);padding:10px}
  /* 대화 보관함 권하기 (동의해야 저장) */
  .qa-offer-side,.qa-offer{border:1px solid var(--line2);border-radius:14px;background:var(--field);padding:14px 15px;font-size:14px;line-height:1.6;color:var(--text2);box-shadow:var(--shadow-sm)}
  .qa-offer-side{margin:8px 6px}
  .qa-offer{align-self:center;max-width:460px;width:100%;animation:rise .25s ease-out}
  .qa-offer-side b,.qa-offer b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
  .qa-offer-side p{margin:0 0 6px;color:var(--text2);font-size:13.5px}
  .qa-offer-side ul,.qa-offer ul{margin:6px 0 10px;padding-left:18px}
  .qa-offer-side li,.qa-offer li{margin:2px 0}
  .qa-offer-side .r,.qa-offer .r{display:flex;gap:8px;flex-wrap:wrap}
  .qa-side-foot{border-top:1px solid var(--line);padding:12px 14px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:7px}
  .qa-side-foot .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .qa-mini{border:1px solid var(--line2);background:var(--field);color:var(--text2);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
  .qa-mini:hover{border-color:var(--accent);color:var(--accent-ink)}
  .qa-admin{border:0;background:none;padding:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  body.owner .qa-admin{color:#145c37;font-weight:700}
  /* 저장 위치 (2026-10-21): 왼쪽 아래 표시 + 고르는 팝업 */
  .qa-where{display:flex;align-items:center;gap:6px;min-width:0;color:var(--text2)}
  .qa-where b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .qa-where .qa-mini{margin-left:auto;flex:none}
  .qa-where-warn{border:1px solid #f1d29a;background:#fff6e5;color:#6b4100;border-radius:10px;padding:7px 9px;font-size:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .qa-place{width:min(520px,100%)}
  .qa-place-in{padding:22px 22px 18px}
  .qa-place-in h3{margin:0 0 4px;font-size:18px;color:var(--text)}
  .qa-place-in>p{margin:0 0 14px;font-size:13.5px;color:var(--text2)}
  .qa-place-opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--field);border-radius:14px;padding:13px 14px;margin:0 0 10px;font:inherit;color:var(--text);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .15s,transform .15s}
  .qa-place-opt:hover:not([aria-disabled=true]){border-color:var(--accent);transform:translateY(-1px)}
  .qa-place-opt[aria-disabled=true]{cursor:not-allowed;opacity:.6;box-shadow:none}
  .qa-place-opt .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--accent-soft)}
  .qa-place-opt b{display:flex;align-items:center;gap:8px;font-size:15px}
  .qa-place-opt small{display:block;margin-top:2px;font-size:12.5px;color:var(--text2);line-height:1.55}
  .qa-place-opt .now{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;color:#145c37;background:#e3f5ea;border:1px solid #a8dcbc}
  .qa-place-no{margin:-4px 0 12px;border:1px solid #f1d29a;background:#fff6e5;color:#5c3a00;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6}
  .qa-place-no code{display:inline-block;margin:4px 6px 0 0;padding:2px 7px;border-radius:6px;background:#fffdf7;border:1px solid #f3e2bd;font-size:12px;word-break:break-all}
  .qa-place-fine{margin:4px 0 0;font-size:12px;color:var(--muted)}

  /* 오른쪽: 채팅 */
  .qa-chat{flex:1;min-width:0;display:flex;flex-direction:column}
  .qa-top{flex:none;display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line)}
  .qa-menu{display:none;flex:none;width:36px;height:36px;border:1px solid var(--line2);border-radius:10px;background:var(--field);color:var(--text2);font-size:18px;cursor:pointer}
  .qa-title{display:flex;align-items:baseline;gap:8px;min-width:0;margin-right:auto}
  .qa-title b{font-size:15px;color:var(--text);white-space:nowrap}
  .qa-title{align-items:center}
  .qa-feats{display:flex;gap:6px;min-width:0;overflow:hidden}
  .qa-feats i{font-style:normal;font-size:12px;font-weight:600;white-space:nowrap;color:var(--text2);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .qa-opts{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);flex:none}
  .qa-model{position:relative}
  .qa-model-btn{display:inline-flex;align-items:center;gap:7px;height:36px;max-width:220px;border:1px solid var(--line2);background:var(--field);color:var(--text);border-radius:11px;padding:0 10px 0 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(92,58,34,.06)}
  .qa-model-btn:hover,.qa-model-btn[aria-expanded=true]{border-color:var(--accent);color:var(--accent-ink)}
  .qa-model-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qa-model-btn svg{flex:none;transition:transform .15s}
  .qa-model-btn[aria-expanded=true] svg{transform:rotate(180deg)}
  .qa-model-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:280px;padding:6px;border:1px solid var(--line2);border-radius:14px;background:var(--panel);box-shadow:var(--shadow-lg)}
  .qa-model-menu[hidden]{display:none}
  .qa-model-item{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;border:0;background:none;border-radius:10px;padding:9px 11px;font:inherit;color:var(--text);cursor:pointer}
  .qa-model-item:hover,.qa-model-item:focus-visible{background:var(--hover);outline:0}
  .qa-model-item[aria-selected=true]{background:var(--accent-soft)}
  .qa-model-item b{display:block;font-size:14.5px}
  .qa-model-item small{display:block;font-size:12.5px;color:var(--text2);line-height:1.5}
  .qa-model-item .ck{margin-left:auto;flex:none;width:18px;color:var(--accent-ink);font-weight:900;visibility:hidden}
  .qa-model-item[aria-selected=true] .ck{visibility:visible}
  .qa-opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
  .qa-opts input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
  .ai-status{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);background:var(--panel);white-space:nowrap}
  .ai-status i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
  .ai-status.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(30,138,82,.18)}
  .ai-status.off i{background:var(--danger)}
  .qa-scroll{flex:1;min-height:0;overflow-y:auto}
  .qa-log{max-width:800px;min-height:100%;margin:0 auto;padding:26px 20px 14px;display:flex;flex-direction:column;gap:18px}

  /* 빈 채팅: 가운데 아이콘·소개·추천 질문 */
  .qa-hello{margin:auto;max-width:660px;width:100%;text-align:center;padding:12px 0 24px}
  .qa-logo{width:58px;height:58px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 26px rgba(204,68,52,.28)}
  .qa-hello h2{margin:0 0 6px;font-size:clamp(22px,3vw,28px);letter-spacing:-.03em;color:var(--text)}
  .qa-hello p{margin:0 auto 22px;max-width:480px;font-size:15px;color:var(--text2)}
  .qa-suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left}
  .qa-suggest button{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line2);background:var(--field);border-radius:16px;padding:16px 18px;font:inherit;cursor:pointer;color:var(--text);box-shadow:var(--shadow-sm);transition:border-color .15s,transform .15s}
  .qa-suggest button:hover{border-color:var(--accent);transform:translateY(-1px)}
  .qa-suggest b{font-size:16px}
  .qa-suggest span{font-size:13px;color:var(--text2)}

  /* 아래: 입력창 (항상 같은 자리) */
  .qa-composer{flex:none;padding:8px 20px calc(12px + env(safe-area-inset-bottom))}
  .qa-form{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--field-line);background:var(--field);border-radius:20px;padding:9px 9px 9px 18px;box-shadow:var(--shadow-sm)}
  .qa-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(204,68,52,.14)}
  .qa-form textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;color:var(--text);line-height:1.5;height:44px;max-height:160px;padding:10px 0}
  .qa-form textarea::placeholder{color:var(--muted);opacity:1}
  .qa-send{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);font-size:18px;font-weight:900;cursor:pointer;display:grid;place-items:center}
  .qa-send:disabled{background:var(--line2);color:var(--text2);cursor:default}
  .qa-fine{max-width:760px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}

  /* 관리자(가르치기) 팝업 */
  .qa-modal{position:fixed;inset:0;z-index:80;background:rgba(40,25,15,.35);display:grid;place-items:center;padding:16px}
  .qa-modal[hidden]{display:none}
  .qa-modal-card{position:relative;width:min(700px,100%);max-height:88vh;max-height:88dvh;overflow:auto;border-radius:18px;background:var(--panel);box-shadow:var(--shadow-lg)}
  .qa-modal-card .teach{margin:0;border:0;box-shadow:none;padding:20px 22px}
  .qa-x{position:sticky;float:right;top:10px;margin:10px 10px 0 0;width:32px;height:32px;border:0;border-radius:10px;background:var(--panel2);color:var(--text2);font-size:18px;cursor:pointer;z-index:1}
  .qa-scrim{display:none}

  /* 내 말: 오른쪽 말풍선 */
  .me{align-self:flex-end;max-width:78%;padding:10px 15px;border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 4px 12px rgba(204,68,52,.18);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
  /* 쿼리봇 답: 말풍선 없이 아이콘 + 이름 + 글 (대화형 AI 화면처럼) */
  .turn{display:flex;gap:12px;align-items:flex-start;max-width:88%;animation:rise .25s ease-out}
  .avatar{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(204,68,52,.25)}
  .avatar.wiki{background:#ffffff;color:var(--text);border:1px solid var(--line2);font-family:Georgia,"Times New Roman",serif;font-size:17px;box-shadow:0 1px 3px rgba(92,58,34,.08)}
  .turn-body{min-width:0;flex:1}
  .who{font-size:13px;font-weight:700;color:var(--text2);margin:5px 0 6px;display:flex;align-items:center;gap:8px}
  .who-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
  .text{line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;color:var(--text)}
  .text.typing::after{content:"";display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;background:var(--accent);animation:blink .9s steps(2) infinite}
  .tools{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .15s}
  .turn:hover .tools,.turn:focus-within .tools{opacity:1}
  .tools button{border:1px solid transparent;background:none;color:var(--muted);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
  .tools button:hover{border-color:var(--line);color:var(--text);background:var(--hover)}

  /* 위키백과 검색 답: 출처 카드 */
  .src{border:1px solid var(--line2);border-radius:14px;background:linear-gradient(160deg,#ffffff,#fbf5ee);overflow:hidden}
  .src-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel2)}
  .src-top svg{flex:none}
  .src-title{padding:12px 14px 2px;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .src-text{padding:4px 14px 12px;line-height:1.7;color:var(--text2);word-break:keep-all;overflow-wrap:anywhere}
  .src-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--accent-ink);text-decoration:none}
  .src-link:hover{background:var(--hover)}
  .src-link small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 기다리는 중: 점 세 개 */
  .dots{display:inline-flex;gap:5px;padding:8px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  .wait-note{font-size:13px;color:var(--muted);margin-top:2px}

  /* 오류·알림 */
  .alert{align-self:flex-start;display:flex;gap:10px;align-items:flex-start;max-width:88%;padding:10px 14px;border-radius:12px;border:1px solid #f2b8bd;background:#fff1f1;color:#9b1c2c;font-size:14px}
  .alert.warn{border-color:#f1d29a;background:#fff6e5;color:#7a4a00}
  .sys{align-self:center;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--panel)}

  /* 주인이 가르친 답: 초록 표시 */
  .avatar.taught{background:linear-gradient(135deg,#1e8a52,#2f9e6a);box-shadow:0 4px 14px rgba(30,138,82,.25)}
  .who-tag.taught{color:#145c37;background:#e3f5ea;border-color:#a8dcbc}

  /* 가르치기 모드 (주인만) */
  .fix{display:none}
  body.owner .fix{display:inline-block}
  .teach-toggle{margin:18px 0 0;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .teach-toggle button{border:0;background:none;color:var(--accent-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
  .teach{margin-top:12px;border:1px solid var(--line2);border-radius:16px;background:var(--panel);box-shadow:var(--shadow-sm);padding:16px 18px}
  .teach h3{margin:0 0 4px;font-size:16px;color:var(--text)}
  .teach p{margin:0 0 10px;font-size:13px;color:var(--muted)}
  .teach label.f{display:block;font-size:13px;font-weight:700;color:var(--text2);margin:10px 0 4px}
  .teach input[type=password],.teach textarea,.edit textarea{width:100%;border:1px solid var(--field-line);background:var(--field);border-radius:10px;padding:9px 12px;color:var(--text);font:inherit;font-size:14px}
  .teach textarea,.edit textarea{min-height:60px;resize:vertical}
  .teach input:focus,.teach textarea:focus,.edit textarea:focus{outline:2px solid var(--focus);border-color:var(--accent)}
  .teach .row,.edit .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .teach .row label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text2);cursor:pointer}
  .teach .row input[type=checkbox]{accent-color:var(--accent)}
  .go{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:800;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer}
  .go:disabled{opacity:.6;cursor:default}
  .sub{border:1px solid var(--field-line);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;background:var(--field);color:var(--text2);cursor:pointer}
  .teach-msg{font-size:13px;margin-top:8px;color:#145c37}
  .teach-msg.bad{color:#9b1c2c}
  .teach-list{margin-top:12px;border-top:1px solid var(--line);padding-top:6px;max-height:280px;overflow:auto}
  .teach-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--text2)}
  .teach-item div{flex:1;min-width:0;word-break:break-word}
  .teach-item b{color:var(--accent-ink)}
  .edit{margin-top:8px;border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel2)}
  .edit .lbl{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px}
  .wpick{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--text2);flex-wrap:wrap}
  .wpick b{font-weight:700;margin-right:2px}
  .wpick button{width:28px;height:28px;border-radius:8px;border:1px solid var(--field-line);background:var(--field);color:var(--text2);font:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:0}
  .wpick button[aria-pressed=true]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent}
  .wpick small{color:var(--muted);margin-left:4px}
  .similar{margin-top:8px;border:1px solid #f1d29a;background:#fff6e5;border-radius:12px;padding:10px 12px;font-size:13px;color:#5c3a00}
  .similar .it{margin:6px 0;padding:6px 8px;border-radius:8px;background:#fffdf7;border:1px solid #f3e2bd;word-break:break-word}
  .similar .row{margin-top:8px}
  .teach-item select{border:1px solid var(--field-line);border-radius:8px;background:var(--field);color:var(--text2);font:inherit;font-size:12px;height:28px}

<script>
(() => {
  const API = "https://querybot-ai.onrender.com";
  // 무료 서버는 한동안 안 쓰면 잠들고, 깨어나는 데 50초 넘게 걸리기도 한다 → 넉넉히 기다린다.
  const WAKE_TIMEOUT = 90000;
  const T = {
    ko: { on: "연결됨", off: "연결 안 됨", wake: "서버 깨우는 중", switched: "모델을 바꿨습니다. 새 대화를 시작합니다.", waking: "서버를 깨우는 중입니다. 첫 답은 1분 정도 걸릴 수 있습니다.", down: "지금은 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.", busy: "요청이 많습니다. 잠시 후 다시 시도해 주세요.", fail: "답을 받지 못했습니다. 잠시 후 다시 시도해 주세요.", copy: "복사", copied: "복사됨", wikiTag: "위키백과 검색", wikiOpen: "위키백과에서 보기", aiTag: "AI 답변", taughtTag: "가르친 답", newChat: "새 대화", noChats: "아직 대화가 없습니다", today: "오늘", yesterday: "어제", week: "지난 7일", older: "이전", delAsk: "이 대화를 삭제하시겠습니까?", helloTitle: "QueryBot과 이야기해 보세요", helloText: "편하게 말을 걸어 보세요. 사람·나라 같은 지식 질문은 위키백과에서 찾아 답합니다." },
    en: { on: "Online", off: "Offline", wake: "Waking", switched: "Model changed. Starting a new chat.", waking: "Waking the server… the first answer can take about a minute.", down: "Can't reach the server right now. Please try again later.", busy: "Too many messages. Please wait a moment.", fail: "No answer received. Please try again.", copy: "Copy", copied: "Copied", wikiTag: "Wikipedia search", wikiOpen: "Open on Wikipedia", aiTag: "AI answer", taughtTag: "Taught answer", newChat: "New chat", noChats: "No chats yet", today: "Today", yesterday: "Yesterday", week: "Previous 7 days", older: "Older", delAsk: "Delete this chat?", helloTitle: "Chat with QueryBot", helloText: "Say anything in Korean. Questions about people or places are answered from Wikipedia." }
  };
  const SUGGEST = [
    ["오늘 너무 피곤하다", "위로가 필요할 때"],
    ["좋아하는 사람이 생겼어", "설레는 이야기"],
    ["이순신은 누구야?", "위키백과 검색"],
    ["심심해", "이야기 상대가 필요할 때"]
  ];
  const lang = () => (document.documentElement.lang === "en" ? "en" : "ko");
  const t = (k) => T[lang()][k];
  const $ = (id) => document.getElementById(id);
  const log = $("log"), scroller = $("scroller"), input = $("input"), send = $("send"), status = $("status");
  const modelSel = $("model"), mem = $("mem"), convList = $("convList");
  let online = null, busy = false;
  // 서버가 알려 주는 모델 이름(한국어)의 영어 이름
  // 모델 이름 (사용자 요청 2026-10-21): 사이트에 올라간 최고 모델은 QueryBot the Best, 예전 모델은 단계 번호로
  const MODEL_NAME = { latest: "QueryBot the Best", stage3: "QueryBot 3", v1: "QueryBot 1" };
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 고른 모델·기억 설정은 이 브라우저에만 기억해 둔다 (못 쓰는 환경이면 그냥 넘어감)
  const store = {
    get(k) { try { return localStorage.getItem("qbAi." + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("qbAi." + k, v); } catch (e) {} }
  };
  if (store.get("mem") === "0") mem.checked = false;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };
  function put(node) {
    const hello = log.querySelector(".qa-hello");
    if (hello) hello.remove();
    log.appendChild(node);
    toBottom();
    return node;
  }
  const addMe = (text) => put(el("div", "me", text));
  const addSys = (text) => put(el("div", "sys", text));
  function addAlert(text, warn) {
    const a = el("div", "alert" + (warn ? " warn" : ""));
    a.append(el("span", "", warn ? "⏳" : "⚠"), el("span", "", text));
    return put(a);
  }

  // 빈 채팅: 가운데 아이콘·소개·추천 질문
  function showHello() {
    log.innerHTML = "";
    const box = el("div", "qa-hello");
    box.appendChild(el("div", "qa-logo", "Q")).setAttribute("aria-hidden", "true");
    box.appendChild(el("h2", "", t("helloTitle")));
    if (t("helloText")) box.appendChild(el("p", "", t("helloText")));
    const grid = el("div", "qa-suggest");
    for (const [q, sub] of SUGGEST) {
      const b = el("button");
      b.type = "button";
      b.append(el("b", "", q), el("span", "", sub));
      b.addEventListener("click", () => ask(q));
      grid.appendChild(b);
    }
    box.appendChild(grid);
    log.appendChild(box);
  }

  // =========================================================
  // 대화 기록 — 사용자가 '대화 보관함 만들기'에 동의했을 때만, 이 기기(브라우저)에만 저장. 서버에는 남지 않는다.
  // 동의 전에는 지금 대화만 화면에 있고, 새로고침하면 사라진다. (2026-10-21 사용자 요청: 자동 저장 대신 설득 후 동의)
  // =========================================================
  const CONV_KEY = "qbAi.convs", GONE_KEY = "qbAi.convGone", MAX_CONVS = 60, MAX_DIR_CONVS = 300, MAX_MSGS = 200;
  let histOn = store.get("histOn") === "1";
  let askedThisVisit = false;  // 이번 방문에 채팅 안 안내를 이미 띄웠는지
  let convs = [];
  if (histOn) {
    try { convs = JSON.parse(localStorage.getItem(CONV_KEY) || "[]"); if (!Array.isArray(convs)) convs = []; } catch (e) { convs = []; }
  }
  let cur = null;  // 지금 대화 {id, title, created, updated, model, messages: [{role, content, kind?, source?}]}
  function saveConvs() {
    if (!histOn) return;
    convs = convs.slice(0, dir ? MAX_DIR_CONVS : MAX_CONVS);
    // 폴더에 저장할 때도 최근 대화는 브라우저에 같이 둔다 (새로고침하자마자 목록이 보이고, 폴더 연결이 끊겨도 잃지 않게)
    try { localStorage.setItem(CONV_KEY, JSON.stringify(convs.slice(0, MAX_CONVS))); } catch (e) { /* 저장 공간이 꽉 찼거나 막힘 → 이번 화면에서만 유지 */ }
  }

  // ---------- 저장 위치: 내 컴퓨터 폴더 (2026-10-21 사용자 요청: 파일 탐색기에서 폴더를 직접 고르고, 어디에 저장되는지 표시) ----------
  // 폴더 = showDirectoryPicker로 고른 폴더. 대화 하나 = QueryBot_날짜_시각_id.json 파일 하나.
  // 고른 폴더(핸들)는 IndexedDB에 보관하고, 새로고침 뒤에는 권한을 다시 확인한다 (권한 요청은 버튼을 눌렀을 때만 가능).
  const canPickDir = typeof window.showDirectoryPicker === "function";
  let dir = null;          // FileSystemDirectoryHandle
  let dirState = "none";   // none | ok | need(권한 다시 받아야 함) | lost(폴더를 못 찾음·이 브라우저에서 못 씀)
  let fileQ = Promise.resolve();  // 파일 쓰기는 한 줄로 차례대로 (같은 파일을 동시에 열지 않게)
  const fileOf = new Map();       // 대화 id → 폴더 안 파일 이름
  const useDir = () => store.get("histDir") === "1";
  const kv = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open("qbAi", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(k) {
      const db = await kv.open();
      return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });

  };
  const pad2 = (n) => String(n).padStart(2, "0");
  function fileName(c) {
    const d = new Date(c.created || Date.now());
    return "QueryBot_" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_" + pad2(d.getHours()) + pad2(d.getMinutes()) + "_" + c.id.replace(/[^a-z0-9_-]/gi, "") + ".json";
  }
  function folderTrouble(e) {
    dirState = e && e.name === "NotFoundError" ? "lost" : "need";
    paintFoot();
  }
  function writeConv(c) {
    if (!dir || dirState !== "ok" || !c) return fileQ;
    const name = fileOf.get(c.id) || fileName(c);
    const body = JSON.stringify(Object.assign({ app: "querybot-ai", version: 1 }, c), null, 1);  // 지금 내용을 바로 떠 둔다
    const d = dir;
    fileQ = fileQ.then(async () => {
      const w = await (await d.getFileHandle(name, { create: true })).createWritable();
      await w.write(body);
      await w.close();
      fileOf.set(c.id, name);
    }).catch(folderTrouble);

  }
  // 지운 대화: 폴더가 연결돼 있으면 파일도 지우고, 끊겨 있으면 기억해 두었다가 다시 연결될 때 지운다
  const gone = {
    get() { try { const a = JSON.parse(localStorage.getItem(GONE_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } },
    set(a) { try { a.length ? localStorage.setItem(GONE_KEY, JSON.stringify(a.slice(-500))) : localStorage.removeItem(GONE_KEY); } catch (e) {} }
  };
  function removeConvFile(c) {
    if (!useDir()) return;
    if (!dir || dirState !== "ok") { gone.set(gone.get().concat(c.id)); return; }
    const name = fileOf.get(c.id) || fileName(c);
    const d = dir;
    fileQ = fileQ.then(() => d.removeEntry(name)).then(() => fileOf.delete(c.id)).catch((e) => { if (e && e.name !== "NotFoundError") folderTrouble(e); });
  }
  // 폴더와 이 브라우저의 대화를 합친다: 같은 대화면 더 나중에 고친 쪽, 폴더에만 있으면 목록에 추가, 브라우저에만 있으면 폴더에 쓰기
  async function syncFolder() {
    if (!dir || dirState !== "ok") return 0;
    const disk = new Map();  // id → {c, name}
    try {
      for await (const [name, h] of dir.entries()) {
        if (h.kind !== "file" || !/\.json$/i.test(name)) continue;
        try {
          const f = await h.getFile();
          if (f.size > 5e6) continue;
          const data = JSON.parse(await f.text());
          if (!data || data.app !== "querybot-ai" || !Array.isArray(data.messages)) continue;  // 대화 파일만 (내보내기 묶음 등은 건드리지 않음)
          const c = cleanConv(data);
          if (c && (!disk.has(c.id) || (disk.get(c.id).c.updated || 0) < (c.updated || 0))) disk.set(c.id, { c, name });

  // 폴더를 저장 위치로 정한다 (고른 직후 또는 다시 연결했을 때)

  // 새로고침 뒤: 보관해 둔 폴더를 꺼내 권한이 살아 있으면 바로 합치고, 아니면 '폴더 다시 연결' 버튼을 보인다

  async function reconnectFolder() {

  // 저장 위치 고르기 팝업. mode = "create"(프로젝트 만들기) | "change"(위치 바꾸기)
  const placeModal = $("placeModal");

      else {

        cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText(flag); cp.textContent = "복사됨"; } catch (e) { cp.textContent = "복사 실패"; } setTimeout(() => (cp.textContent = "주소 복사"), 1500); });

  const closePlace = () => { placeModal.hidden = true; };
  $("placeClose").addEventListener("click", closePlace);
  placeModal.addEventListener("click", (e) => { if (e.target === placeModal) closePlace(); });
  $("placeDir").addEventListener("click", async () => {

    paintFoot();

  });

  });

  // 동의하면(저장 위치까지 고르면) 보관함을 바로 만들고, 지금 하던 대화부터 저장한다
  async function startHistory(h) {

    // 빈 화면이면 첫 화면(추천 질문)은 그대로 두고, 저장 위치는 왼쪽 아래에 보인다
  }
  const enableHistory = () => openPlace("create");
  async function disableHistory() {
    const msg = useDir()

  // 보관함 설명 (왼쪽 칸과 채팅 안내에서 같이 씀)
  const OFFER_POINTS = ["지난 대화를 왼쪽에서 다시 열어 볼 수 있습니다", "열어 둔 대화에 이어서 이야기할 수 있습니다", "이 기기에만 저장되며 서버에는 남지 않습니다", "언제든 끄고 한 번에 삭제할 수 있습니다"];

  // 왼쪽 아래: 기록이 켜져 있을 때만 저장 위치·위치 바꾸기·내보내기·가져오기·끄기

  // 앞 대화 (서버에 보낼 것·가르치기 때 같이 저장할 것)
  const hist = () => (cur ? cur.messages.map((m) => ({ role: m.role, content: m.content.slice(0, 400) })) : []);

  function dayLabel(ts) {
    const d = new Date(ts), n = new Date();
    const same = (a, b) => a.toDateString() === b.toDateString();
    if (same(d, n)) return t("today");
    const y = new Date(n); y.setDate(n.getDate() - 1);

  function renderList() {

  function newChat() {
    cur = null;
    showHello();
    renderList();
    closeSide();
    input.focus();
  }

  // 저장된 대화 다시 보기 (한 글자씩 써지는 효과 없이)
  function openConv(id) {
    const c = convs.find((x) => x.id === id);
    if (!c) return;
    cur = c;
    log.innerHTML = "";
    const msgs = c.messages;
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.role === "user") { addMe(m.content); continue; }
      const prevUser = i > 0 && msgs[i - 1].role === "user" ? msgs[i - 1].content : "";
      const meta = prevUser ? { user: prevUser, ctx: msgs.slice(Math.max(0, i - 3), i - 1).map((x) => ({ role: x.role, content: x.content })) } : null;
      if (m.kind === "wiki" && m.source) addWikiReply(m.content, m.source, meta);
      else addAiReply(m.content, meta, m.kind === "taught" ? "taught" : "ai", false);
    }
    if (!msgs.length) showHello();
    if (c.model && [...modelSel.options].some((o) => o.value === c.model)) modelSel.value = c.model;
    paintModel();
    renderList();
    closeSide();
    toBottom();
  }

  // 한 번 주고받을 때마다 지금 대화에 저장 (첫 질문이 대화 제목)
  function record(text, reply, kind, source) {
    if (!cur) {
      cur = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), title: text.slice(0, 40), created: Date.now(), updated: Date.now(), model: modelSel.value, messages: [] };
    }
    const a = { role: "assistant", content: reply, kind };
    if (source) a.source = source;
    cur.messages.push({ role: "user", content: text }, a);
    cur.messages = cur.messages.slice(-MAX_MSGS);
    cur.updated = Date.now();
    cur.model = modelSel.value;
    if (!histOn) {
      // 기록이 꺼져 있으면 저장하지 않고, 첫 대화를 나눈 뒤 한 번만 채팅 안에서 권해 본다
      if (!askedThisVisit && store.get("histOn") !== "0") { askedThisVisit = true; setTimeout(() => put(offerCard(true)), 900); }
      return;
    }
    convs = [cur].concat(convs.filter((c) => c.id !== cur.id));
    saveConvs();
    writeConv(cur);
    renderList();
  }

  // 내보내기·가져오기: 기록을 파일로 백업하거나 다른 기기로 옮기기
  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "querybot-ai", version: 1, exported: new Date().toISOString(), convs }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = "querybot-대화기록-" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  // 파일에서 읽은 대화는 그대로 믿지 않고 필요한 모양만 골라 담는다 (가져오기·폴더 읽기 공용). 모양이 틀리면 null
  function cleanConv(c) {
    if (!c || typeof c.id !== "string" || !c.id || !Array.isArray(c.messages)) return null;
    const messages = [];
    for (const m of c.messages.slice(-MAX_MSGS)) {
      if (!m || (m.role !== "user" && m.role !== "assistant") || typeof m.content !== "string") continue;
      const x = { role: m.role, content: m.content.slice(0, 2000) };
      if (m.role === "assistant") {
        x.kind = ["ai", "wiki", "taught"].includes(m.kind) ? m.kind : "ai";
        if (typeof m.source === "string" && /^https:\/\/([a-z]+\.)?wikipedia\.org\//.test(m.source)) x.source = m.source;
      }
      messages.push(x);
    }
    if (!messages.length) return null;
    return { id: c.id.slice(0, 40), title: String(c.title || messages[0].content).slice(0, 40), created: Number(c.created) || Date.now(), updated: Number(c.updated) || Date.now(), model: typeof c.model === "string" ? c.model.slice(0, 32) : "latest", messages };
  }
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    let added = 0;
    try {
      if (f.size > 5e6) throw new Error("big");
      const data = JSON.parse(await f.text());
      // 내보내기 묶음({convs:[…]}), 대화 목록([…]), 폴더에 저장된 대화 파일 하나({app, messages…}) 모두 받는다
      const list = Array.isArray(data) ? data : data && Array.isArray(data.convs) ? data.convs : data && Array.isArray(data.messages) ? [data] : null;
      if (!list) throw new Error("form");
      const have = new Set(convs.map((c) => c.id));
      const fresh = [];
      for (const raw of list) {
        const c = cleanConv(raw);
        if (!c || have.has(c.id)) continue;
        convs.push(c);
        fresh.push(c);
        have.add(c.id);
        added++;
      }
      convs.sort((a, b) => (b.updated || 0) - (a.updated || 0));
      saveConvs();
      fresh.forEach(writeConv);
      renderList();
      alert(added ? "대화 " + added + "개를 가져왔습니다." : "새로 가져올 대화가 없습니다.");
    } catch (err) {
      alert("가져올 수 없는 파일입니다. 이 페이지에서 '내보내기'로 만든 파일인지 확인해 주세요.");
    }
  });

  // 폰: 대화 기록 서랍
  const openSide = () => document.body.classList.add("side-open");
  const closeSide = () => document.body.classList.remove("side-open");
  $("menuBtn").addEventListener("click", openSide);
  $("scrim").addEventListener("click", closeSide);
  $("newChat").addEventListener("click", newChat);
  $("histOff").addEventListener("click", disableHistory);

  // 쿼리봇 차례 한 칸: 아이콘 + 이름 + 내용. kind = "ai" | "wiki" | "taught"(주인이 가르친 답)
  function turnShell(kind) {
    const turn = el("div", "turn");
    const av = el("div", "avatar" + (kind === "wiki" ? " wiki" : kind === "taught" ? " taught" : ""), kind === "wiki" ? "W" : "Q");
    av.setAttribute("aria-hidden", "true");
    const body = el("div", "turn-body");
    const who = el("div", "who", "QueryBot");
    who.appendChild(el("span", "who-tag" + (kind === "taught" ? " taught" : ""), kind === "wiki" ? t("wikiTag") : kind === "taught" ? t("taughtTag") : t("aiTag")));
    body.appendChild(who);
    turn.append(av, body);
    return { turn, body };
  }

  function addWaiting() {
    const { turn, body } = turnShell("ai");
    body.querySelector(".who-tag").remove();
    const d = el("div", "dots");
    d.append(el("i"), el("i"), el("i"));
    body.appendChild(d);
    return put(turn);
  }

  // 답 아래 도구: 복사 + (가르치기 모드일 때만 보이는) 고치기. meta = {user, ctx}: 이 답을 부른 질문과 그 앞 대화
  function copyTool(getText, meta, body) {
    const tools = el("div", "tools");
    const b = el("button", "", t("copy"));
    b.type = "button";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(getText()); b.textContent = t("copied"); setTimeout(() => (b.textContent = t("copy")), 1500); } catch (e) {}
    });
    tools.appendChild(b);
    if (meta && body) {
      const f = el("button", "fix", "고치기");
      f.type = "button";
      f.title = "더 좋은 답을 직접 가르치기 (관리자만)";
      f.addEventListener("click", () => openEdit(body, meta, getText()));
      tools.appendChild(f);
    }
    return tools;
  }

  // 모델 답: 새 답은 한 글자씩 써지듯 보여 준다 (실제로는 다 받은 뒤 보여 주는 것). 저장된 대화를 열 땐 바로.
  function addAiReply(text, meta, kind, animate) {
    const { turn, body } = turnShell(kind || "ai");
    const p = el("div", "text");
    body.append(p, copyTool(() => text, meta, body));
    put(turn);
    if (reduceMotion || animate === false) { p.textContent = text; return; }
    p.classList.add("typing");
    const chars = [...text];
    let i = 0;
    const step = () => {
      i = Math.min(chars.length, i + 2);
      p.textContent = chars.slice(0, i).join("");
      toBottom();
      if (i < chars.length) setTimeout(step, 22); else p.classList.remove("typing");
    };
    step();
  }

  // 위키백과 답: 서버 글 "위키백과에서 찾아봤어요. <요약>\n(출처: 위키백과 「제목」)"을 나눠 출처 카드로
  function addWikiReply(text, url, meta) {
    const m = text.match(/\(출처:\s*위키백과\s*「([^」]+)」\)\s*$/);
    const title = m ? m[1] : "";
    const summary = text.replace(/\(출처:[^)]*\)\s*$/, "").replace(/^위키백과에서 찾아봤어요\.\s*/, "").trim();
    const { turn, body } = turnShell("wiki");
    const card = el("div", "src");
    const top = el("div", "src-top");
    top.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
    top.appendChild(el("span", "", lang() === "en" ? "Found on Korean Wikipedia" : "위키백과 검색 결과"));
    card.appendChild(top);
    if (title) card.appendChild(el("div", "src-title", title));
    card.appendChild(el("div", "src-text", summary));
    let safe = "";
    try { const u = new URL(url); if (u.protocol === "https:" && /(^|\.)wikipedia\.org$/.test(u.hostname)) safe = u.href; } catch (e) {}
    if (safe) {
      const a = el("a", "src-link");
      a.href = safe; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.append(el("span", "", t("wikiOpen") + " ↗"), el("small", "", "ko.wikipedia.org"));
      card.appendChild(a);
    }
    body.append(card, copyTool(() => summary + (title ? "\n(출처: 위키백과 「" + title + "」)" : ""), meta, body));
    put(turn);
  }

  // =========================================================
  // 가르치기 모드 (주인만). 가르친 대화는 PC 답변 서버에 저장 → 같은 말엔 몇 분 안에 사이트 AI가 그 답을 하고,
  // 모두 다음 학습 라운드에 들어간다. 키는 PC에서 '가르치기키만들기.bat'로 정하고, 이 브라우저에만 기억한다.
  // =========================================================
  const TEACH_API = "https://poem-defog-septum.ngrok-free.dev";
  const TEACH_HEADERS = { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" };
  const teachBox = $("teach"), teachState = $("teachState");
  let teachKey = store.get("teachKey") || "";
  let owner = false;

  async function teachCall(path, body) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    let r;
    try {
      r = await fetch(TEACH_API + path, { method: "POST", headers: TEACH_HEADERS, body: JSON.stringify(Object.assign({ key: teachKey }, body || {})), signal: ctrl.signal });
    } catch (e) {
      throw new Error("PC 답변 서버에 연결할 수 없습니다. 가르치기는 PC가 켜져 있을 때만 할 수 있습니다.");
    } finally {
      clearTimeout(timer);
    }
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (r.status === 401) { setOwner(false); teachKey = ""; store.set("teachKey", ""); }
    if (!r.ok) throw new Error(j.detail || ("오류 " + r.status));
    return j;
  }

  // 쿼리봇은 해요체로 말하도록 배우는 중 → 반말 답이면 한 번 물어본다
  const POLITE_END = /(요|죠|니다|니까)$/, INTERJ = /^(와|우와|헉|어머|아이고|저런|오|앗|네|음|아하|에구|아니요)$/;
  const politeOk = (s) => s.split(/(?<=[.!?])\s+/).every((x) => { const c = x.replace(/[^가-힣A-Za-z0-9]+$/, ""); return !c || POLITE_END.test(c) || INTERJ.test(c); });

  // 중요도 1~5: 학습 데이터에 넣는 횟수 (PC 서버 teach_store.WEIGHT_REPEAT와 같게)
  const REPEAT = { 1: 2, 2: 4, 3: 6, 4: 10, 5: 15 };
  function weightPicker(initial) {
    let w = initial || 3;
    const box = el("span", "wpick");
    box.appendChild(el("b", "", "중요도"));
    const hint = el("small");
    const btns = [1, 2, 3, 4, 5].map((n) => {
      const b = el("button", "", String(n));
      b.type = "button";
      b.title = "학습에 " + REPEAT[n] + "번 넣습니다";
      b.addEventListener("click", () => { w = n; paint(); });
      box.appendChild(b);
      return b;
    });
    box.appendChild(hint);
    function paint() {
      btns.forEach((b, i) => b.setAttribute("aria-pressed", String(i + 1 === w)));
      hint.textContent = "학습에 " + REPEAT[w] + "번";
    }
    paint();
    return { el: box, get: () => w };
  }

  const fmtDialog = (msgs) => msgs.map((m) => (m.role === "user" ? "사용자: " : "쿼리봇: ") + m.content).join(" / ");

  // 사이트 서버(Render)가 지금 쓰는 가르친 대화 — '사이트 반영됨' 표시용. 비교는 서버와 같은 방식(띄어쓰기·문장 부호 무시)
  const tnorm = (s) => s.replace(/[\s.,!?~…ㅠㅜ"'()\[\]{}:;·\-]+/g, "").toLowerCase();
  async function siteTaught(refresh) {
    try {
      if (refresh) await fetch(API + "/taught/refresh", { method: "POST" });
      const r = await fetch(API + "/taught", { cache: "no-store" });
      if (!r.ok) return null;
      const j = await r.json();
      j.map = new Map(j.items.map((it) => [it.q, it.a]));
      return j;
    } catch (e) { return null; }
  }
  const onSite = (st, msgs) => !!st && msgs.length === 2 && st.map.get(tnorm(msgs[0].content)) === msgs[1].content;

  // 가르친 직후: 사이트 서버가 바로 받아 가게 하고, 반영됐는지 메시지에 덧붙인다
  async function syncSite(messages, msgEl) {
    if (messages.length !== 2) return;
    const st = await siteTaught(true);
    if (!msgEl.isConnected) return;
    msgEl.textContent += onSite(st, messages) ? " · ✓ 사이트 서버에 반영됨" : " · 사이트 서버 반영 대기(서버가 쉬고 있으면 깨어날 때 반영됩니다)";
  }

  // 가르치기 저장. 서버가 '똑같거나 80% 이상 비슷한 가르침이 있다'고 하면 저장하지 않고 주인에게 고르게 한다.
  async function saveTeach(messages, msgEl, btn, weight, opts) {
    const answer = messages[messages.length - 1].content;
    if (!(opts && opts.mode) && !politeOk(answer) && !confirm("쿼리봇은 해요체(~요)로 말하도록 학습 중입니다. 그래도 이 답으로 가르치시겠습니까?")) return false;
    const old = msgEl.parentNode.querySelector(".similar");
    if (old) old.remove();
    if (btn) btn.disabled = true;
    try {
      const j = await teachCall("/teach", Object.assign({ messages, weight: weight || 3, mode: "check" }, opts || {}));
      if (!j.ok && j.similar) return await askSimilar(j.similar, messages, msgEl, btn, weight);
      msgEl.className = "teach-msg";
      msgEl.textContent = (messages.length === 2 ? "저장했습니다. 사이트 AI가 같은 말에 이 답을 하고, " : "저장했습니다. 이어지는 대화이므로 ")
        + "다음 학습 라운드에 " + REPEAT[weight || 3] + "번 들어갑니다. (모두 " + j.count + "개)";
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
      syncSite(messages, msgEl);
      return true;
    } catch (e) {
      msgEl.className = "teach-msg bad";
      msgEl.textContent = e.message;
      return false;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // 비슷한 가르침이 있을 때: 기존 것 바꾸기 / 따로 저장 / (완전히 같으면) 중요도만 바꾸기 / 취소
  function askSimilar(similar, messages, msgEl, btn, weight) {
    return new Promise((resolve) => {
      msgEl.textContent = "";
      const box = el("div", "similar");
      const same = similar.find((s) => s.same);
      box.appendChild(el("div", "", same ? "이미 같은 대화를 가르쳤습니다." : "비슷한 대화가 이미 있습니다. 어떻게 하시겠습니까?"));
      for (const s of similar.slice(0, 3)) {
        box.appendChild(el("div", "it", (s.same ? "같음" : "비슷함 " + s.score + "%") + " · 중요도 " + s.weight + " — " + fmtDialog(s.messages)));
      }
      const row = el("div", "row");
      const done = (v) => { box.remove(); resolve(v); };
      const mk = (label, cls, fn) => { const b = el("button", cls, label); b.type = "button"; b.addEventListener("click", fn); row.appendChild(b); };
      if (same) {
        if (same.weight !== (weight || 3)) {
          mk("중요도만 " + (weight || 3) + "(으)로 바꾸기", "go", async () => {
            try {
              await teachCall("/teach/weight", { id: same.id, weight: weight || 3 });
              msgEl.className = "teach-msg"; msgEl.textContent = "중요도를 바꿨습니다. 다음 학습 라운드부터 " + REPEAT[weight || 3] + "번 들어갑니다.";
              done(true);
            } catch (e) { msgEl.className = "teach-msg bad"; msgEl.textContent = e.message; done(false); }
          });
        }
      } else {
        mk("이걸로 바꾸기", "go", async () => { box.remove(); resolve(await saveTeach(messages, msgEl, btn, weight, { mode: "replace", replace_id: similar[0].id })); });
        mk("따로 저장", "sub", async () => { box.remove(); resolve(await saveTeach(messages, msgEl, btn, weight, { mode: "new" })); });
      }
      mk("취소", "sub", () => { msgEl.className = "teach-msg"; msgEl.textContent = "저장하지 않았습니다."; done(false); });
      box.appendChild(row);
      msgEl.parentNode.insertBefore(box, msgEl.nextSibling);
    });
  }

  // AI 답 아래 '고치기': 더 좋은 답을 적어서 가르친다 (질문과 그 앞 대화는 자동으로 같이)
  function openEdit(body, meta, current) {
    const old = body.querySelector(".edit");
    if (old) { old.remove(); return; }
    const box = el("div", "edit");
    box.appendChild(el("div", "lbl", "\"" + meta.user + "\"에 대한 더 좋은 답" + (meta.ctx.length ? " (앞 대화도 같이 가르쳐요)" : "")));
    const ta = el("textarea");
    ta.maxLength = 200;
    ta.value = current.replace(/\n?\(출처:[^)]*\)\s*$/, "").trim().slice(0, 200);
    const row = el("div", "row");
    const go = el("button", "go", "가르치기"); go.type = "button";
    const no = el("button", "sub", "취소"); no.type = "button";
    const wp = weightPicker(3);
    const msg = el("div", "teach-msg");
    row.append(go, no, wp.el);
    box.append(ta, row, msg);
    body.appendChild(box);
    ta.focus();
    no.addEventListener("click", () => box.remove());
    go.addEventListener("click", async () => {
      const a = ta.value.trim();
      if (!a) { msg.className = "teach-msg bad"; msg.textContent = "답을 적어 주세요."; return; }
      const ok = await saveTeach(meta.ctx.concat([{ role: "user", content: meta.user }, { role: "assistant", content: a }]), msg, go, wp.get());
      if (ok) setTimeout(() => box.remove(), 3000);
    });
  }

  function setOwner(v) {
    owner = v;
    document.body.classList.toggle("owner", v);
    $("teachToggle").textContent = v ? "● 관리자 모드" : "관리자";
    if (!v) teachState.textContent = "";
  }

  function renderTeach() {
    teachBox.innerHTML = "";
    teachBox.hidden = false;
    if (!owner) {
      teachBox.append(el("h3", "", "관리자 · 가르치기"),
        el("p", "", "PC에서 '가르치기키만들기.bat'로 정한 키를 입력해 주세요. 키는 이 브라우저에만 저장됩니다."));
      const form = el("form");
      const inp = el("input"); inp.type = "password"; inp.autocomplete = "current-password"; inp.placeholder = "가르치기 키"; inp.maxLength = 200;
      const row = el("div", "row");
      const go = el("button", "go", "켜기"); go.type = "submit";
      const msg = el("div", "teach-msg");
      row.append(go);
      form.append(inp, row, msg);
      teachBox.appendChild(form);
      inp.focus();
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        teachKey = inp.value;
        go.disabled = true;
        try {
          const j = await teachCall("/teach/check");
          store.set("teachKey", teachKey);
          setOwner(true);
          teachState.textContent = "· 가르친 대화 " + j.count + "개";
          renderTeach();
        } catch (err) {
          teachKey = "";
          msg.className = "teach-msg bad";
          msg.textContent = err.message;
        } finally {
          go.disabled = false;
        }
      });
      return;
    }
    teachBox.append(el("h3", "", "관리자 모드 · 가르치기"),
      el("p", "", "AI 답 아래 '고치기'로 더 좋은 답을 가르치거나, 여기서 새 대화를 가르칠 수 있습니다. 한 번 주고받은 대화는 사이트 AI가 같은 말에 바로 그 답을 하고, 모두 다음 학습에 들어갑니다. 중요도가 높을수록 학습에 여러 번 들어가며, 똑같거나 80% 넘게 비슷한 대화가 있으면 저장 전에 알려 드립니다. 개인정보는 넣지 마세요."));
    // 주고받기 칸들: '+ 이어서'를 누르면 한 번 더 주고받는 칸이 붙어서 이어지는 대화로 가르친다 (최대 MAX_EX번)
    const MAX_EX = 6;
    const pairsBox = el("div", "pairs");
    const pairs = [];
    function addPair() {
      const n = pairs.length + 1;
      const wrap = el("div", "pair");
      const q = el("textarea"); q.maxLength = 200;
      const a = el("textarea"); a.maxLength = 200;
      q.placeholder = n === 1 ? "예: 나 요즘 수영 배워" : "앞 이야기에 이어지는 말 (예: 오늘 25미터 갔어)";
      a.placeholder = n === 1 ? "예: 수영 좋죠! 배운 지 얼마나 됐어요?" : "앞 이야기를 이어받는 답 (예: 처음 수영으로 25미터라니 대단해요!)";
      wrap.append(el("label", "f", n === 1 ? "사용자 말" : "사용자 말 " + n), q, el("label", "f", n === 1 ? "쿼리봇 답" : "쿼리봇 답 " + n), a);
      pairsBox.appendChild(wrap);
      pairs.push({ wrap, q, a });
      paintPairs();
      if (n > 1) q.focus();
    }
    function paintPairs() {
      plus.disabled = pairs.length >= MAX_EX;
      plus.textContent = pairs.length >= MAX_EX ? "최대 " + MAX_EX + "번까지" : "+ 이어서 한 번 더 주고받기";
      minus.hidden = pairs.length <= 1;
    }
    const plus = el("button", "sub", ""); plus.type = "button";
    const minus = el("button", "sub", "− 마지막 주고받기 빼기"); minus.type = "button";
    plus.addEventListener("click", addPair);
    minus.addEventListener("click", () => { const p = pairs.pop(); if (p) p.wrap.remove(); paintPairs(); });
    const plusRow = el("div", "row");
    plusRow.append(plus, minus);
    const row = el("div", "row");
    const ctxLabel = el("label");
    const ctxBox = el("input"); ctxBox.type = "checkbox";
    ctxLabel.append(ctxBox, document.createTextNode("지금 대화의 바로 앞 주고받기도 맨 앞에 같이"));
    const go = el("button", "go", "가르치기"); go.type = "button";
    const listBtn = el("button", "sub", "가르친 대화 보기"); listBtn.type = "button";
    const wp = weightPicker(3);
    const msg = el("div", "teach-msg");
    const list = el("div", "teach-list"); list.hidden = true;
    const row2 = el("div", "row");
    row2.append(wp.el, ctxLabel);
    const offBtn = el("button", "sub", "관리자 모드 끄기"); offBtn.type = "button";
    offBtn.addEventListener("click", () => { setOwner(false); teachKey = ""; store.set("teachKey", ""); closeModal(); });
    row.append(go, listBtn, offBtn);
    teachBox.append(pairsBox, plusRow, row2, row, msg, list);
    addPair();
    go.addEventListener("click", async () => {
      const msgs = [];
      for (const p of pairs) {
        const uq = p.q.value.trim(), ua = p.a.value.trim();
        if (!uq || !ua) { msg.className = "teach-msg bad"; msg.textContent = "모든 칸에 사용자 말과 쿼리봇 답을 적어 주세요(빈 칸은 '− 마지막 주고받기 빼기'로 뺄 수 있습니다)."; return; }
        msgs.push({ role: "user", content: uq }, { role: "assistant", content: ua });
      }
      let ctx = ctxBox.checked ? hist().slice(-2) : [];
      if (ctx.length / 2 + pairs.length > MAX_EX) ctx = [];
      if (await saveTeach(ctx.concat(msgs), msg, go, wp.get())) {
        while (pairs.length > 1) pairs.pop().wrap.remove();
        pairs[0].q.value = ""; pairs[0].a.value = "";
        paintPairs();
        ctxBox.checked = false;
        if (!list.hidden) loadList(list, msg);
      }
    });
    listBtn.addEventListener("click", () => { list.hidden = !list.hidden; if (!list.hidden) loadList(list, msg); });
  }

  async function loadList(list, msg) {
    list.textContent = "불러오는 중…";
    try {
      const [j, st] = await Promise.all([teachCall("/teach/list"), siteTaught(false)]);
      list.innerHTML = "";
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
      // 반영 상태 요약: 사이트 서버가 마지막으로 받아 간 때, 학습이 마지막으로 가져간 때
      list.appendChild(el("div", "sync-line",
        (st ? "사이트 서버: " + st.count + "개 쓰는 중 (" + (st.updated || "아직 못 받음").slice(5, 16) + " 받음)" : "사이트 서버: 확인 못 함(쉬고 있을 수 있습니다)")
        + " · 학습: " + (j.last_export ? j.last_export.slice(5, 16) + "에 마지막으로 가져감" : "아직 안 가져감")));
      if (!j.items.length) { list.appendChild(el("div", "", "아직 가르친 대화가 없습니다.")); return; }
      for (const it of j.items) {
        const row = el("div", "teach-item");
        const d = el("div");
        it.messages.forEach((m, i) => {
          if (i) d.appendChild(document.createElement("br"));
          d.append(el("b", "", m.role === "user" ? "사용자: " : "쿼리봇: "), document.createTextNode(m.content));
        });
        // 실제 서버에 들어갔는지
        const badges = el("div", "badges");
        if (it.messages.length !== 2) badges.appendChild(el("span", "bdg no", "이어지는 대화 · 학습에만 사용"));
        else if (onSite(st, it.messages)) badges.appendChild(el("span", "bdg ok", "✓ 사이트 서버 반영됨"));
        else badges.appendChild(el("span", "bdg wait", st ? "⏳ 사이트 서버 반영 대기" : "사이트 서버 확인 못 함"));
        if (j.last_export && it.at && it.at <= j.last_export) badges.appendChild(el("span", "bdg ok", "✓ 학습 데이터에 들어감"));
        else badges.appendChild(el("span", "bdg wait", "⏳ 다음 학습 라운드에 들어감"));
        d.appendChild(badges);
        // 중요도 바꾸기 (학습에 넣는 횟수)
        const sel = el("select");
        sel.title = "중요도 (학습에 넣는 횟수)";
        for (const n of [1, 2, 3, 4, 5]) {
          const o = el("option", "", "중요도 " + n + " · " + REPEAT[n] + "번");
          o.value = String(n);
          sel.appendChild(o);
        }
        sel.value = String(it.weight || 3);
        sel.addEventListener("change", async () => {
          try { await teachCall("/teach/weight", { id: it.id, weight: Number(sel.value) }); msg.className = "teach-msg"; msg.textContent = "중요도를 바꿨습니다."; }
          catch (e) { msg.className = "teach-msg bad"; msg.textContent = e.message; sel.value = String(it.weight || 3); }
        });
        const del = el("button", "sub", "삭제"); del.type = "button";
        del.addEventListener("click", async () => {
          if (!confirm("이 가르침을 삭제하시겠습니까?")) return;
          try { await teachCall("/teach/delete", { id: it.id }); row.remove(); siteTaught(true); } catch (e) { msg.className = "teach-msg bad"; msg.textContent = e.message; }
        });
        row.append(d, sel, del);
        list.appendChild(row);
      }
    } catch (e) {
      list.textContent = "";
      msg.className = "teach-msg bad";
      msg.textContent = e.message;
    }
  }

  // 관리자(가르치기) 팝업: 일반 방문자 화면엔 자리를 차지하지 않는다
  const modal = $("teachModal");
  const openModal = () => { renderTeach(); modal.hidden = false; closeSide(); };
  const closeModal = () => { modal.hidden = true; };
  $("teachToggle").addEventListener("click", openModal);
  $("teachClose").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!placeModal.hidden) closePlace(); else if (!modal.hidden) closeModal(); else closeSide(); } });
  // 전에 키를 넣어 둔 브라우저면 조용히 다시 확인해서 관리자 모드만 켠다 (팝업은 안 띄움)
  async function resumeOwner() {
    if (!teachKey) return;
    try {
      const j = await teachCall("/teach/check");
      setOwner(true);
      teachState.textContent = "· 가르친 대화 " + j.count + "개";
    } catch (e) {}
  }

  function setStatus(key) {
    status.className = "ai-status " + (key === "on" ? "on" : "off");
    const span = status.querySelector("span");
    span.dataset.ko = T.ko[key];
    span.dataset.en = T.en[key];
    span.textContent = t(key);
    status.title = t(key);
  }

  function setOnline(v) {
    online = v;
    setStatus(v ? "on" : "off");
  }

  async function checkHealth() {
    // 바로 대답이 없으면 잠든 서버를 깨우는 중이라고 보여 준다.
    const slow = setTimeout(() => { if (online !== true) setStatus("wake"); }, 3000);
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), WAKE_TIMEOUT);
      const r = await fetch(API + "/state", { signal: ctrl.signal });
      clearTimeout(timer);
      setOnline(r.ok);
      if (r.ok) fillModels((await r.json()).models);
    } catch (e) {
      setOnline(false);
    }
    clearTimeout(slow);
  }

  // 모델 고르기: 기본 select는 숨겨 두고(값·change 이벤트는 그대로 씀) 이름 + 설명이 보이는 목록을 띄운다
  const MODEL_DESC = {
    latest: ["가장 잘 대답하는 최신 모델", "The newest and best model"],
    stage3: ["이전 세대 모델", "An earlier model"],
    v1: ["처음 만든 초기 모델", "The very first model"]
  };
  const modelBtn = $("modelBtn"), modelMenu = $("modelMenu");
  function paintModel() {
    const o = modelSel.options[modelSel.selectedIndex];
    $("modelName").textContent = o ? o.textContent : "";
  }
  function closeModels() { modelMenu.hidden = true; modelBtn.setAttribute("aria-expanded", "false"); }
  function openModels() {
    modelMenu.innerHTML = "";
    for (const o of modelSel.options) {
      const it = el("button", "qa-model-item");
      it.type = "button";
      it.setAttribute("role", "option");
      it.setAttribute("aria-selected", o.value === modelSel.value ? "true" : "false");
      const txt = el("span");
      txt.appendChild(el("b", "", o.textContent));
      const d = MODEL_DESC[o.value];
      if (d) txt.appendChild(el("small", "", d[lang() === "en" ? 1 : 0]));
      it.append(txt, el("span", "ck", "✓"));
      it.addEventListener("click", () => {
        closeModels();
        modelBtn.focus();
        if (modelSel.value === o.value) return;
        modelSel.value = o.value;
        paintModel();
        modelSel.dispatchEvent(new Event("change"));
      });
      modelMenu.appendChild(it);
    }
    modelMenu.hidden = false;
    modelBtn.setAttribute("aria-expanded", "true");
    const on = modelMenu.querySelector("[aria-selected=true]") || modelMenu.firstChild;
    if (on) on.focus();
  }
  modelBtn.addEventListener("click", () => (modelMenu.hidden ? openModels() : closeModels()));
  document.addEventListener("click", (e) => { if (!modelMenu.hidden && !e.target.closest(".qa-model")) closeModels(); });
  modelMenu.addEventListener("keydown", (e) => {
    const items = [...modelMenu.children], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
    else if (e.key === "Escape") { e.stopPropagation(); closeModels(); modelBtn.focus(); }
  });

  function fillModels(list) {
    if (!Array.isArray(list) || !list.length) return;
    const want = (cur && cur.model) || store.get("model") || modelSel.value;
    modelSel.innerHTML = "";
    for (const m of list) {
      const o = document.createElement("option");
      o.value = m.key;
      o.textContent = MODEL_NAME[m.key] || m.label;
      modelSel.appendChild(o);
    }
    if (list.some((m) => m.key === want)) modelSel.value = want;
    paintModel();
  }

  async function ask(text) {
    text = (text || "").trim();
    if (busy || !text) return;
    busy = true; send.disabled = true;
    const asked = modelSel.value;
    const ctx = mem.checked ? hist().slice(-2) : [];  // 가르치기('고치기')할 때 같이 저장할 바로 앞 주고받기
    // 앞 대화는 최근 2번 주고받은 것만: 작은 모델은 앞 대화가 길면 헷갈려서 이상한 답을 한다 (2026-10-21)
    const before = mem.checked ? hist().slice(-4) : [];
    addMe(text);
    const wait = addWaiting();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), WAKE_TIMEOUT);
    const slow = setTimeout(() => { wait.querySelector(".turn-body").appendChild(el("div", "wait-note", t("waking"))); toBottom(); }, 5000);
    let err = null, warn = false;
    try {
      const r = await fetch(API + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, model: asked, history: before }),
        signal: ctrl.signal
      });
      if (r.status === 429) { err = t("busy"); warn = true; }
      else if ([404, 502, 503, 504].includes(r.status)) { err = t("down"); setOnline(false); }
      else if (!r.ok) { err = t("fail"); }
      else {
        const j = await r.json();
        const reply = j.reply || "";
        wait.remove();
        const meta = { user: text, ctx };
        const kind = j.source ? "wiki" : j.taught ? "taught" : "ai";
        if (j.source) addWikiReply(reply, j.source, meta); else addAiReply(reply, meta, kind, true);
        setOnline(true);
        if (modelSel.value === asked) record(text, reply, kind, j.source);  // 기다리는 사이 모델을 바꿨으면 대화에 섞지 않는다
      }
    } catch (e) {
      err = t("down");
      setOnline(false);
    }
    clearTimeout(timer);
    clearTimeout(slow);
    if (err) { wait.remove(); addAlert(err, warn); }
    busy = false; send.disabled = false; input.focus();
  }

  // 입력창: Enter로 보내고 Shift+Enter는 줄 바꿈. 한글 조합 중 Enter는 무시(글자가 끊겨 보내지는 것 막기). 내용에 맞춰 높이가 늘어남.
  function fitInput() {
    input.style.height = "";  // CSS 기본 높이로 돌린 뒤, 글이 넘칠 때만 늘린다
    if (input.scrollHeight > input.clientHeight + 1) input.style.height = Math.min(160, input.scrollHeight + 2) + "px";
  }
  input.addEventListener("input", fitInput);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      $("form").requestSubmit();
    }
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    fitInput();
    ask(text);
  });
  // 모델을 바꾸면 다른 모델이 앞 대화를 이어받지 않게 새 대화로 시작한다.
  modelSel.addEventListener("change", () => {
    store.set("model", modelSel.value);
    if (cur && cur.messages.length) { newChat(); addSys(t("switched")); }
  });
  mem.addEventListener("change", () => { store.set("mem", mem.checked ? "1" : "0"); $("mem2").checked = mem.checked; });
  // 폰: '앞 대화 기억'은 서랍 안 스위치로 (위쪽 체크와 같은 값)
  $("mem2").checked = mem.checked;
  $("mem2").addEventListener("change", () => { mem.checked = $("mem2").checked; mem.dispatchEvent(new Event("change")); });
  $("newTop").addEventListener("click", newChat);

  function applyPlaceholder() { input.placeholder = input.dataset["ph" + (lang() === "en" ? "En" : "Ko")]; }
  // 언어를 바꾸면 안내 문구·대화 목록도 그 언어로
  new MutationObserver(() => { applyPlaceholder(); renderList(); if (log.querySelector(".qa-hello")) showHello(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  document.addEventListener("DOMContentLoaded", () => {
    applyPlaceholder();
    showHello();
    renderList();
    paintFoot();
    initFolder();
    checkHealth();
    resumeOwner();
  });
  // 주기적으로 확인하지 않는다 (확인 요청이 서버를 계속 깨워 무료 사용 시간을 쓰지 않게).
  // 탭으로 돌아왔을 때만 2분에 한 번 확인하고, 평소 상태는 /chat 응답으로 갱신된다.
  let lastCheck = 0;
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastCheck > 120000) { lastCheck = Date.now(); checkHealth(); }
  });
})();
</script>
</body>
</html>
