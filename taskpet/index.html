<div class="step"><p data-ko="아래 버튼으로 TaskPet-extension.zip을 받아 압축을 풉니다. (TaskPet 로봇 우클릭 → '브라우저 확장 받기'를 눌러도 다운로드 폴더에 바로 생겨요)" data-en="Download TaskPet-extension.zip below and unzip it. (Or right-click the TaskPet robot → 'Get browser extension' to save it straight to your Downloads folder.)"></p></div>
