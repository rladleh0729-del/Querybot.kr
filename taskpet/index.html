<section class="section" id="install"><div class="wrap prose"><div class="eyebrow">INSTALL</div><h2 data-ko="설치는 파일 하나" data-en="One file to install"></h2><div class="steps">
<div class="step"><p data-ko="TaskPet.exe를 내려받아 실행하면 바로 설치되고 로봇이 나타납니다. 컴퓨터를 켤 때도 자동으로 실행돼요." data-en="Download TaskPet.exe and run it. It installs itself, the robot appears, and it starts with Windows."></p></div>
<div class="step"><p data-ko="Windows가 'PC 보호' 경고를 띄우면 '추가 정보 → 실행'을 누르세요. 서명하지 않은 개인 프로그램이라 뜨는 경고이고, 소스 코드는 GitHub에 모두 공개되어 있어요." data-en="If Windows shows 'Windows protected your PC', click 'More info → Run anyway'. It appears because the app is unsigned; the full source is on GitHub."></p></div>
<div class="step"><p data-ko="이미 열려 있던 Claude Code 세션은 새로 시작해야 잡혀요. 이후로는 따로 할 일이 없어요." data-en="Restart any Claude Code sessions that were already open. That's it."></p></div>
<div class="step"><p data-ko="로봇 화면은 Windows 언어에 맞춰 나오고, 우클릭 → 설정 → 언어 · Language에서 10개 언어 중 고를 수 있어요." data-en="The robot follows your Windows language. Pick from 10 languages under right-click → Settings → Language."></p></div>
</div>
<div class="note" data-ko="개인정보: 모든 정보는 내 컴퓨터 안에서만 읽고 어디에도 보내지 않습니다. 제거는 로봇 우클릭 → TaskPet 제거, 또는 Windows 설정 → 앱에서 할 수 있고, 추가했던 설정만 깔끔하게 지워져요. Anthropic·OpenAI와는 관계없는 개인 프로젝트입니다." data-en="Privacy: everything is read locally and nothing leaves your PC. Uninstall from the robot's right-click menu or Windows Settings → Apps; only what TaskPet added is removed. Not affiliated with Anthropic or OpenAI."></div>

<section class="section" id="extension"><div class="wrap prose"><div class="eyebrow">BROWSER EXTENSION</div><h2 data-ko="브라우저 AI 채팅도 보려면 (선택)" data-en="Also watch browser AI chats (optional)"></h2><p class="lead" data-ko="TaskPet을 먼저 설치한 뒤, 작은 확장 프로그램을 브라우저에 넣으면 chatgpt.com · gemini.google.com · claude.ai · grok.com · kimi.ai 에서 AI가 답하는 중인지, 끝났는지도 로봇이 알려 줍니다. Chrome 웹 스토어에서 버튼 하나로 설치할 수 있어요." data-en="After installing TaskPet, add this small extension to your browser to also see whether AI chats on chatgpt.com, gemini.google.com, claude.ai, grok.com and kimi.ai are answering or done. Install it from the Chrome Web Store in one click."></p><div class="steps">
<div class="step"><p data-ko="아래 버튼으로 Chrome 웹 스토어의 TaskPet for AI Chats 페이지를 열고 'Chrome에 추가'를 누릅니다. Brave · Edge에서도 같은 페이지에서 설치돼요. (TaskPet 로봇 우클릭 → '브라우저 확장 설치'를 눌러도 이 페이지가 열려요)" data-en="Open TaskPet for AI Chats on the Chrome Web Store with the button below and click 'Add to Chrome'. Brave and Edge install from the same page. (Right-clicking the TaskPet robot → 'Install browser extension' opens it too.)"></p></div>
<div class="step"><p data-ko="브라우저를 완전히 껐다 켜 주세요. (TaskPet과 연결 정보를 다시 읽어야 해요) 예전에 직접 불러온 확장이 있다면 확장 페이지에서 지워 주세요." data-en="Fully restart the browser so it picks up the TaskPet connection. If you loaded the extension manually before, remove that copy on the extensions page."></p></div>
</div>
<div class="note" data-ko="확장은 평소에 입력창의 '중지' 버튼이 있는지와 대화 제목·주소만 확인합니다. 대화 글은 로봇에서 그 탭 줄을 펼쳐 보는 동안에만 읽고, 로봇에서 보낸 답은 그 탭 입력창에 넣어 보내 줍니다. 모든 정보는 같은 컴퓨터의 TaskPet에만 전달되고 인터넷으로 보내지 않습니다." data-en="Normally the extension only checks whether the 'Stop' button is shown plus the chat title and URL. It reads message text only while you expand that tab's row in the robot, and types replies you send from the robot into that tab. Everything goes only to TaskPet on the same computer, never over the internet."></div>
