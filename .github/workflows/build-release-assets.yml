name: Build QueryBot release assets

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "extension/**"
      - "native-host/**"
      - "QueryBotAudioSetup.iss"
      - ".github/workflows/build-release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: querybot-latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp imageio-ffmpeg PySide6 requests mutagen Pillow comtypes
          python -c "import comtypes.client; comtypes.client.GetModule('UIAutomationCore.dll')"

      - name: Verify playlist and GUI selection
        shell: pwsh
        run: python -m unittest discover -s gui -p 'test_*.py' -v

      - name: Build standalone GUI EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name QueryBotAudioGUI --paths gui --collect-all yt_dlp --collect-all imageio_ffmpeg --hidden-import comtypes --hidden-import comtypes.client --hidden-import comtypes.automation --hidden-import comtypes.gen.UIAutomationClient gui/querybot_gui.py
          Copy-Item dist\QueryBotAudioGUI.exe .\QueryBotAudioGUI.exe

      - name: Build Chrome Native Host EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name QueryBotNativeHost --paths gui --paths native-host --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all mutagen --collect-all PIL --hidden-import server --distpath dist\native --workpath build\native --specpath build\native native-host\querybot_native_host.py

      - name: Build Native Host Setup EXE
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          & $compiler QueryBotAudioSetup.iss
          if ($LASTEXITCODE -ne 0) { throw "Native Host Setup build failed" }

      - name: Verify executable startup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import subprocess; subprocess.run(['./QueryBotAudioGUI.exe', '--check-startup'], check=True, timeout=90)"
          python -c "import subprocess; subprocess.run(['./QueryBotAudioGUI.exe', '--check-browser'], check=True, timeout=90)"
          python -c "import subprocess; subprocess.run(['./QueryBotAudioGUI.exe', '--check-capture-runtime'], check=True, timeout=90)"

      - name: Package Chrome extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension\* -DestinationPath QueryBotChromeExtension.zip -Force

      - name: Package matching source and build identity
        shell: pwsh
        run: |
          git archive --format=zip --output=QueryBotAudio-source.zip HEAD
          $info = @{ commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; built_at = (Get-Date).ToUniversalTime().ToString("o"); gui_sha256 = (Get-FileHash QueryBotAudioGUI.exe -Algorithm SHA256).Hash.ToLower(); setup_sha256 = (Get-FileHash QueryBotAudioSetup.exe -Algorithm SHA256).Hash.ToLower() }
          $info | ConvertTo-Json | Set-Content QueryBotAudio-build.json -Encoding utf8

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "querybot-audio-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "QueryBot Audio Downloads" --notes "Current QueryBot Audio GUI and Chrome extension downloads."
          }
          gh release upload $tag QueryBotAudioGUI.exe QueryBotAudioSetup.exe QueryBotChromeExtension.zip QueryBotAudio-source.zip QueryBotAudio-build.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw "Latest source tag update failed" }

