name: Build QueryBot release assets

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "extension/**"
      - ".github/workflows/build-release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp imageio-ffmpeg

      - name: Build standalone GUI EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name QueryBotAudioGUI --collect-all yt_dlp --collect-all imageio_ffmpeg gui/querybot_gui.py
          Copy-Item dist\QueryBotAudioGUI.exe .\QueryBotAudioGUI.exe

      - name: Package Chrome extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension\* -DestinationPath QueryBotChromeExtension.zip -Force

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "querybot-audio-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "QueryBot Audio Downloads" --notes "Current QueryBot Audio GUI and Chrome extension downloads."
          }
          gh release upload $tag QueryBotAudioGUI.exe QueryBotChromeExtension.zip --clobber
