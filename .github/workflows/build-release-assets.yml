name: Build QueryBot release assets

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "extension/**"
      - ".github/workflows/build-release-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: querybot-latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp imageio-ffmpeg PySide6 fastapi uvicorn requests mutagen Pillow

      - name: Verify playlist and GUI selection
        shell: pwsh
        run: python -m unittest discover -s gui -p test_playlist.py -v

      - name: Build standalone GUI EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name QueryBotAudioGUI --paths gui --collect-all yt_dlp --collect-all imageio_ffmpeg gui/querybot_gui.py
          Copy-Item dist\QueryBotAudioGUI.exe .\QueryBotAudioGUI.exe

      - name: Package Chrome extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension\* -DestinationPath QueryBotChromeExtension.zip -Force

      - name: Package matching source and build identity
        shell: pwsh
        run: |
          git archive --format=zip --output=QueryBotAudio-source.zip HEAD
          $info = @{ commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID; built_at = (Get-Date).ToUniversalTime().ToString("o"); gui_sha256 = (Get-FileHash QueryBotAudioGUI.exe -Algorithm SHA256).Hash.ToLower() }
          $info | ConvertTo-Json | Set-Content QueryBotAudio-build.json -Encoding utf8

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "querybot-audio-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "QueryBot Audio Downloads" --notes "Current QueryBot Audio GUI and Chrome extension downloads."
          }
          gh release upload $tag QueryBotAudioGUI.exe QueryBotChromeExtension.zip QueryBotAudio-source.zip QueryBotAudio-build.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw "Latest source tag update failed" }

