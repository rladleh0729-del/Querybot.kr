name: Deploy querybot.kr to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.txt' --exclude 'wrangler.jsonc' --exclude '.deploy-trigger' --exclude '_deploy' --exclude 'keepalive' ./ _deploy/
          # 2026-11-25 사용자: 'GPT처럼 querybot.kr을 메인으로' — 첫 주소(/)도 AI 채팅. 원본은 ai/index.html 하나(예전 /ai/ 주소도 그대로)
          cp ai/index.html _deploy/index.html

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # AI 서버(Render 무료) 깨우기 Worker — 사이트 배포가 끝난 뒤 따로, 실패해도 사이트 배포에는 영향 없음 (2026-11-09)
      - name: Deploy keep-awake cron worker
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: keepalive
          command: deploy
