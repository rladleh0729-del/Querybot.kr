<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QueryBot Audio</title>
<style>
*{box-sizing:border-box}body{margin:0;width:350px;font-family:Segoe UI,Malgun Gothic,sans-serif;background:#08101f;color:#f4f7fb}
.wrap{padding:16px}.card{background:#101a2d;border:1px solid #263650;border-radius:18px;padding:18px}
.logo{font-size:18px;font-weight:800;margin-bottom:5px}.logo b{color:#68a9ff}.sub{font-size:12px;color:#95a5bf;margin-bottom:18px}
.box{font-size:12px;line-height:1.5;padding:11px 12px;border:1px solid #263650;background:#0a1322;border-radius:12px;margin-bottom:12px;word-break:break-all;max-height:70px;overflow:hidden}
button{width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;margin-top:8px}
.primary{background:linear-gradient(135deg,#63a7ff,#867cff);color:white}.secondary{background:#18253d;color:#d8e4f6;border:1px solid #2c3d5a}
.status{margin-top:13px;color:#9fb0ca;font-size:12px;line-height:1.5}.ok{color:#72d8a6}.err{color:#ff8b8b}
</style>
</head>
<body><div class="wrap"><div class="card">
<div class="logo">Query<b>Bot</b> Audio</div>
<div class="sub">Chrome → Windows local converter</div>
<div id="page" class="box">현재 탭 확인 중…</div>
<button id="convert" class="primary">현재 영상 FLAC 변환</button>
<button id="ping" class="secondary">Windows 연결 확인</button>
<button id="folder" class="secondary">저장 폴더 열기</button>
<div id="status" class="status">준비 완료</div>
</div></div><script src="popup.js"></script></body></html>
